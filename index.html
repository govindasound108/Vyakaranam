  function viewEsercizi() {
    const EX = [['scan', 'ex.scanD'], ['fill', 'ex.fillD'], ['spot', 'ex.spotD'], ['metre', 'ex.metreD'],
      ['schema', 'ex.schemaD'], ['yati', 'ex.yatiD'], ['gana', 'ex.ganaD']];
    return `<p class="intro">${t('ex.intro')}</p><div class="list">` +
      EX.map(([id, dk]) => {
        const p = progress[id];
        return `<button class="vrow ex-c" data-act="start" data-type="${id}">
          <span class="vt"><span class="ex-t">${kindName(id)}</span><span class="vd">${t(dk)}</span><span class="vp">${p ? t('ex.tried', { ok: p.ok, tot: p.tot }) : t('ex.notTried')}</span></span>${CHEV}</button>`;
      }).join('') + '</div>';
  }

  // ---------- esercizi ----------
  const MOD_KINDS = { chanda: CH_KINDS, alfabeto: ALPHA_KINDS, sandhi: SANDHI_KINDS, sillabe: SYL_KINDS, nomi: NO_KINDS, pronomi: PR_KINDS, verbi: VE_KINDS, vocab: VO_KINDS }; // tipi di domanda che ogni modulo mette nei test
  function testKinds() {
    const act = MODULES.filter(m => m.active).map(m => m.id);
    const ids = S.testAll ? act : S.testMods.filter(id => act.includes(id));
    const k = [], mods = ids.filter(id => MOD_KINDS[id]);
    mods.forEach(id => MOD_KINDS[id].forEach(x => { if (!k.includes(x)) k.push(x); }));
    return k.length ? { kinds: k, mods } : { kinds: CH_KINDS.slice(), mods: ['chanda'] };
  }

  // sceglie un pāda non ancora usato in questa sessione, tra i versi che passano il filtro
  function pickPadaWhere(ex, pred) {
    const pool = VERSES.filter(pred);
    if (!pool.length) return { v: VERSES[0], pi: 0 };
    for (let tt = 0; tt < 80; tt++) {
      const v = pool[rnd(pool.length)], pi = rnd(4), key = v.id + pi;
      if (!ex.used.has(key)) { ex.used.add(key); return { v, pi }; }
    }
    return { v: pool[rnd(pool.length)], pi: rnd(4) };
  }
  function pickPada(ex) {
    if (ex.order) { const k = ex.order[ex.n - 1]; return { v: verseById(ex.vid), pi: k }; }
    return pickPadaWhere(ex, ex.metre ? (v => v.metre === ex.metre) : () => true);
  }
  const hasYati = v => E.METRE_BY_ID[v.metre].yati.length > 0;
  const schemaMetres = () => E.METRES.filter(m => m.pattern);

  // una "scheda" è la descrizione di una domanda, abbastanza piccola da salvarla tra gli errori
  function randItem(kind, ex) {
    if (SANDHI_KINDS.includes(kind)) return sandhiItem(kind, ex);
    if (NEWK.includes(kind)) return newItem(kind, ex);
    if (SYL_KINDS.includes(kind)) return slItem(kind, ex);
    if (kind === 'gana') {
      const mode = ['p2n', 'n2p', 'next'][rnd(3)];
      if (mode === 'next') { const i = rnd(7); return { kind: 'gana', mode, given: E.GANA_ORDER[i], answer: E.GANA_ORDER[i + 1] }; }
      return { kind: 'gana', mode, answer: E.GANA_ORDER[rnd(8)] };
    }
    if (kind === 'schema') {
      const ms = schemaMetres();
      return { kind: 'schema', mid: ms[rnd(ms.length)].id, mode: rnd(2) === 0 ? 'marks' : 'names' };
    }
    if (kind === 'yati') { const { v, pi } = pickPadaWhere(ex, v => hasYati(v) && (!ex.metre || v.metre === ex.metre)); return { kind, vid: v.id, pi }; }
    if (kind === 'letter' || kind === 'varga' || kind === 'hari') {
      const src = kind === 'letter' ? ALPHA.order : ALPHA.cons;
      let id = src[rnd(src.length)];
      for (let k = 0; k < 20 && ex.used.has(kind + id); k++) id = src[rnd(src.length)];
      ex.used.add(kind + id);
      if (kind === 'hari') return { kind, letter: id, mode: rnd(2) === 0 ? 'l2n' : 'n2l' };
      return kind === 'letter' ? { kind, answer: id, mode: rnd(2) === 0 ? 'd2i' : 'i2d' } : { kind, letter: id };
    }
    if (kind === 'odd') {
      const gs = shuffle(ALPHA.G.map(x => x.id)), g = ALPHA.GB[gs[0]], h = ALPHA.GB[gs[1]];
      return { kind, ids: shuffle(g.ids).slice(0, 3).concat(h.ids[rnd(h.ids.length)]) };
    }
    if (kind === 'grid') return { kind, blanks: shuffle(Array.from({ length: 25 }, (_, i) => i)).slice(0, 5) };
    const { v, pi } = pickPada(ex);
    if (kind === 'fill') {
      const n = E.syllabify(v.lines[pi]).length;
      return { kind, vid: v.id, pi, hide: shuffle(Array.from({ length: n }, (_, i) => i)).slice(0, 2).sort((a, b) => a - b) };
    }
    if (kind === 'spot') return { kind, vid: v.id, pi, flip: rnd(E.syllabify(v.lines[pi]).length) };
    return { kind, vid: v.id, pi };
  }

  function keyOf(it) {
    if (NEWK.includes(it.kind)) return keyNew(it);
    switch (it.kind) {
      case 'fill': return 'fill:' + it.vid + ':' + it.pi + ':' + it.hide.join(',');
      case 'spot': return 'spot:' + it.vid + ':' + it.pi + ':' + it.flip;
      case 'schema': return 'schema:' + it.mid + ':' + it.mode;
      case 'letter': return 'letter:' + it.answer + ':' + it.mode;
      case 'varga': return 'varga:' + it.letter;
      case 'hari': return 'hari:' + it.letter + ':' + it.mode;
      case 'odd': return 'odd:' + it.ids.slice().sort().join(',');
      case 'grid': return 'grid:' + it.blanks.slice().sort((a, b) => a - b).join(',');
      case 'gana': return 'gana:' + it.answer + ':' + it.mode + (it.given ? ':' + it.given : '');
      case 'sa_res': case 'sa_sut': case 'sa_join': case 'sa_split': case 'sa_mat': case 'sa_comp': return keyOfSa(it);
      case 'sl_lg': case 'sl_rule': case 'sl_tap': case 'sl_div': return keyOfSl(it);
      default: return it.kind + ':' + it.vid + ':' + it.pi;
    }
  }

  // le schede salvate possono venire da una versione precedente o da un altro dispositivo: si controlla che siano giocabili
  function validItem(it) {
    if (!it || typeof it !== 'object' || KINDS.indexOf(it.kind) < 0) return false;
    if (SANDHI_KINDS.includes(it.kind)) return validSa(it);
    if (NEWK.includes(it.kind)) return validNew(it);
    if (SYL_KINDS.includes(it.kind)) return validSl(it);
    if (it.kind === 'gana') return !!E.GANA[it.answer] && ['p2n', 'n2p', 'next'].indexOf(it.mode) >= 0 && (it.mode !== 'next' || !!E.GANA[it.given]);
    if (it.kind === 'letter') return typeof it.answer === 'string' && !!ALPHA.L[it.answer] && (it.mode === 'd2i' || it.mode === 'i2d');
    if (it.kind === 'varga') return typeof it.letter === 'string' && !!ALPHA.L[it.letter] && ALPHA.L[it.letter].kind === 'cons';
    if (it.kind === 'hari') return typeof it.letter === 'string' && !!ALPHA.L[it.letter] && ALPHA.L[it.letter].kind === 'cons' && (it.mode === 'l2n' || it.mode === 'n2l');
    if (it.kind === 'odd') return !!ALPHA.oddOf(it.ids);
    if (it.kind === 'grid') return Array.isArray(it.blanks) && it.blanks.length === 5 && new Set(it.blanks).size === 5 && it.blanks.every(n => Number.isInteger(n) && n >= 0 && n < 25);
    if (it.kind === 'schema') return !!(E.METRE_BY_ID[it.mid] && E.METRE_BY_ID[it.mid].pattern) && (it.mode === 'marks' || it.mode === 'names');
    const v = verseById(it.vid);
    if (!v || !(it.pi >= 0 && it.pi <= 3)) return false;
    const n = E.syllabify(v.lines[it.pi]).length;
    if (it.kind === 'fill') return Array.isArray(it.hide) && it.hide.length > 0 && it.hide.length <= 3 && it.hide.every(i => Number.isInteger(i) && i >= 0 && i < n);
    if (it.kind === 'spot') return Number.isInteger(it.flip) && it.flip >= 0 && it.flip < n;
    if (it.kind === 'yati') return hasYati(v);
    return true;
  }

  // la pausa si memorizza come "4" o "4,10" e si scrive nella lingua corrente solo quando si mostra
  function yatiLabel(key) {
    const ys = String(key).split(',').map(Number);
    return ys.length === 1 ? t('yq.after1', { a: ys[0] }) : ys.length === 2 ? t('yq.after2', { a: ys[0], b: ys[1] }) : ys.join(', ');
  }

  function buildQ(it) {
    const key = keyOf(it), item = cleanItem(it);
    if (SANDHI_KINDS.includes(it.kind)) return buildSa(it, key, item);
    if (NEWK.includes(it.kind)) return buildNew(it, key, item);
    if (SYL_KINDS.includes(it.kind)) return buildSl(it, key, item);
    if (it.kind === 'scan') {
      const syls = E.syllabify(verseById(it.vid).lines[it.pi]);
      return { kind: 'scan', key, item, vid: it.vid, pi: it.pi, syls, guess: syls.map(() => ''), checked: false, hint: false };
    }
    if (it.kind === 'fill') {
      const syls = E.syllabify(verseById(it.vid).lines[it.pi]);
      return { kind: 'fill', key, item, vid: it.vid, pi: it.pi, syls, hide: it.hide.slice(), guess: syls.map(() => ''), checked: false };
    }
    if (it.kind === 'spot') {
      const syls = E.syllabify(verseById(it.vid).lines[it.pi]);
      return { kind: 'spot', key, item, vid: it.vid, pi: it.pi, syls, flip: it.flip, picked: null };
    }
    if (it.kind === 'metre') {
      const v = verseById(it.vid);
      const others = shuffle(E.METRES.filter(m => m.id !== v.metre)).slice(0, 3).map(m => m.id);
      return { kind: 'metre', key, item, vid: it.vid, pi: it.pi, answer: v.metre, opts: shuffle([v.metre, ...others]), picked: null };
    }
    if (it.kind === 'schema') {
      const others = shuffle(schemaMetres().filter(m => m.id !== it.mid)).slice(0, 3).map(m => m.id);
      return { kind: 'schema', key, item, mid: it.mid, mode: it.mode, answer: it.mid, opts: shuffle([it.mid, ...others]), picked: null };
    }
    if (it.kind === 'yati') {
      const v = verseById(it.vid), m = E.METRE_BY_ID[v.metre], n = m.n;
      const answer = m.yati.join(',');
      const keys = new Set([answer]), extra = [];
      shuffle([-2, -1, 1, 2]).forEach(d => {
        const ys = m.yati.map(y => Math.max(2, Math.min(n - 2, y + d)));
        if (ys.some((y, i) => i > 0 && y <= ys[i - 1])) return;
        const k = ys.join(',');
        if (!keys.has(k)) { keys.add(k); extra.push(k); }
      });
      return { kind: 'yati', key, item, vid: it.vid, pi: it.pi, answer, opts: shuffle([answer, ...extra.slice(0, 3)]), picked: null };
    }
    if (it.kind === 'letter') {
      const id = it.answer, others = shuffle(ALPHA.pool(id)).slice(0, 3);
      return { kind: 'letter', key, item, mode: it.mode, answer: id, opts: shuffle([id, ...others]), picked: null };
    }
    if (it.kind === 'varga') {
      const g = ALPHA.L[it.letter].grp, others = shuffle(ALPHA.G.map(x => x.id).filter(x => x !== g)).slice(0, 3);
      return { kind: 'varga', key, item, letter: it.letter, answer: g, opts: shuffle([g, ...others]), picked: null };
    }
    if (it.kind === 'hari') {
      const nm = ALPHA.nameOf(it.letter);
      if (it.mode === 'l2n') {
        const others = shuffle(ALPHA.NAMES.map(x => x.id).filter(x => x !== nm)).slice(0, 3);
        return { kind: 'hari', key, item, mode: 'l2n', letter: it.letter, answer: nm, opts: shuffle([nm, ...others]), picked: null };
      }
      const others = shuffle(ALPHA.cons.filter(x => ALPHA.nameOf(x) !== nm)).slice(0, 3);
      return { kind: 'hari', key, item, mode: 'n2l', letter: it.letter, name: nm, answer: it.letter, opts: shuffle([it.letter, ...others]), picked: null };
    }
    if (it.kind === 'odd') {
      const odd = ALPHA.oddOf(it.ids), ids = it.ids.slice().sort();
      return { kind: 'odd', key, item, answer: odd, opts: shuffle(ids), picked: null };
    }
    if (it.kind === 'grid') {
      const bl = it.blanks.slice().sort((a, b) => a - b);
      return { kind: 'grid', key, item, blanks: bl, placed: {}, sel: bl[0], pool: shuffle(bl.map(cellId)), checked: false };
    }
    const nm = it.answer, base = { kind: 'gana', key, item, mode: it.mode, answer: nm, given: it.given || null, picked: null };
    if (it.mode === 'p2n') return Object.assign(base, { opts: E.GANA_ORDER.slice() });
    const others = shuffle(E.GANA_ORDER.filter(n => n !== nm)).slice(0, 3);
    return Object.assign(base, { opts: shuffle([nm, ...others]) });
  }

  // nel test, una domanda su tre circa (se ci sono punti deboli con almeno 2 errori) va su ciò che sbagli di più
  function weakQ(ks) {
    const w = Object.entries(store.weak).filter(([, n]) => n >= 2);
    if (!w.length || Math.random() > 0.3) return null;
    let r = rnd(sum(w.map(x => x[1]))), key = w[0][0];
    for (const [k, n] of w) { if (r < n) { key = k; break; } r -= n; }
    const i = key.indexOf(':'), ty = key.slice(0, i), a = key.slice(i + 1);
    if (ty === 'sutra') return weakSa(+a, ks);
    const nw = weakNew(ty, a, ks); if (nw) return nw;
    if (ty === 'gana' && ks.includes('gana') && E.GANA[a]) return buildQ({ kind: 'gana', answer: a, mode: rnd(2) === 0 ? 'p2n' : 'n2p' });
    if (ty === 'letter' && ks.includes('letter') && ALPHA.L[a]) return buildQ({ kind: 'letter', answer: a, mode: rnd(2) === 0 ? 'd2i' : 'i2d' });
    if (ty === 'varga' && ks.includes('varga') && ALPHA.GB[a]) return buildQ({ kind: 'varga', letter: ALPHA.GB[a].ids[rnd(ALPHA.GB[a].ids.length)] });
    if (ty === 'hname' && ks.includes('hari') && ALPHA.NB[a]) return buildQ({ kind: 'hari', letter: ALPHA.NB[a].ids[rnd(ALPHA.NB[a].ids.length)], mode: rnd(2) === 0 ? 'l2n' : 'n2l' });
    if (ty === 'metre' && ks.includes('metre')) {
      const vs = VERSES.filter(v => v.metre === a.split('>')[0]);
      return vs.length ? buildQ({ kind: 'metre', vid: vs[rnd(vs.length)].id, pi: rnd(4) }) : null;
    }
    if (ty === 'yati' && ks.includes('yati')) {
      const vs = VERSES.filter(v => v.metre === a && hasYati(v));
      return vs.length ? buildQ({ kind: 'yati', vid: vs[rnd(vs.length)].id, pi: rnd(4) }) : null;
    }
    if (ty === 'rule' && SYL_KINDS.some(k => ks.includes(k)) && (!ks.includes('scan') || rnd(2) === 0)) { const wq = slWeak(a, ks); if (wq) return wq; }
    if (ty === 'rule' && ks.includes('scan')) {
      const c = [];
      VERSES.forEach(v => v.lines.forEach((l, pi) => { if (E.syllabify(l).some(x => a === 'laghu' ? x.w === 'L' : x.w === 'G' && (x.r || 'R1') === a)) c.push({ v, pi }); }));
      if (!c.length) return null;
      const pick = c[rnd(c.length)];
      return buildQ({ kind: 'scan', vid: pick.v.id, pi: pick.pi });
    }
    return null;
  }

  function makeQ(ex) {
    if (ex.queue) return buildQ(ex.queue[ex.n - 1]);
    let kind = ex.type;
    if (kind === 'mix' && ex.metre) return buildQ(randItem(ex.kinds[rnd(ex.kinds.length)], ex));
    if (kind === 'mix') {
      const ks = ex.kinds || CH_KINDS;
      const wq = weakQ(ks); if (wq) return wq;
      // prima si sceglie il modulo, poi il tipo di domanda: ogni modulo pesa uguale
      const ms = ex.mods && ex.mods.length ? ex.mods : null;
      if (ms) { const ka = MOD_KINDS[ms[rnd(ms.length)]]; kind = ka[rnd(ka.length)]; }
      else kind = ks[rnd(ks.length)];
    }
    return buildQ(randItem(kind, ex));
  }

  function newEx(type, o) {
    return Object.assign({ type, vid: null, origin: 'chanda', n: 0, total: 5, score: 0, q: null, done: false, used: new Set(), log: [] }, o);
  }
  function begin(ex) { ex.t0 = Date.now(); ex.end = 0; S.ex = ex; S.screen = 'ex'; nextQ(); }
  function startEx(type, vid) {
    const ex = newEx(type, { vid: vid || null, mod: ALPHA_KINDS.includes(type) ? 'alfabeto' : SANDHI_KINDS.includes(type) ? 'sandhi' : SYL_KINDS.includes(type) ? 'sillabe' : modOfKind(type) });
    if (vid) { ex.total = 4; ex.order = shuffle([0, 1, 2, 3]); }
    store.last = type; save(); begin(ex);
  }
  // "Esercitati" su un metro: scansione, pāda da completare, errore da trovare e yati, solo sui versi di quel metro
  function startMetreEx(mid) {
    const m = E.METRE_BY_ID[mid], kinds = ['scan', 'fill', 'spot'].concat(m.yati.length ? ['yati'] : []);
    begin(newEx('mix', { origin: 'chanda', metre: mid, kinds, total: 8 }));
  }
  function startTest() { store.last = 'mix'; save(); const k = testKinds(); begin(newEx('mix', { origin: 'test', total: S.testLen, kinds: k.kinds, mods: k.mods })); }

  // Test del giorno: un po' di tutto, con fino a tre domande da ripassare (quelle in scadenza)
  function buildDaily(total) {
    const items = [], seen = new Set();
    const push = it => { const k = keyOf(it); if (seen.has(k)) return; seen.add(k); items.push(cleanItem(it)); };
    shuffle(dueList().filter(validItem)).slice(0, 3).forEach(push);
    const ex = { used: new Set() }, order = shuffle(EXK);
    for (let i = 0, guard = 0; items.length < total && guard < 300; guard++) push(randItem(order[i++ % order.length], ex));
    return shuffle(items);
  }
  function startDaily(fresh) {
    const d = store.daily;
    let items, pos = 0, score = 0, log = [];
    if (!fresh && d && d.k === today() && !d.done && d.items.length && d.items.every(validItem)) {
      items = d.items;
      pos = Math.min(num(d.pos, items.length), items.length);
      score = Math.min(num(d.score, pos), pos);
      log = Array.isArray(d.log) ? d.log.filter(r => r && EXK.includes(r.kind)).map(r => ({ kind: r.kind, ok: !!r.ok })).slice(0, items.length) : [];
    } else items = buildDaily(DAILY_N);
    store.daily = { k: today(), items, done: false, pos, score, log };
    store.last = 'daily'; save();
    begin(newEx('daily', { origin: 'test', total: items.length, queue: items, n: pos, score, log }));
  }
  // Ripasso errori: solo le domande sbagliate in precedenza (prima quelle in scadenza), fino a DAILY_N
  function startReview() {
    const all = store.wrong.filter(validItem);
    if (!all.length) return;
    const items = shuffle(all.filter(isDue)).concat(shuffle(all.filter(x => !isDue(x)))).slice(0, DAILY_N).map(it => cleanItem(it));
    begin(newEx('review', { origin: 'test', total: items.length, queue: shuffle(items), n: 0, score: 0, log: [] }));
  }
  // ricorda a che punto è il Test del giorno, così si riprende dalla domanda giusta
  function noteDaily() {
    const ex = S.ex, d = store.daily;
    if (S.screen !== 'ex' || !ex || ex.type !== 'daily' || !d || d.done || ex.done) return;
    const ans = ex.q && (ex.q.checked || (ex.q.picked !== null && ex.q.picked !== undefined)) ? 1 : 0;
    const pos = ex.n - 1 + ans;
    if (d.pos === pos && d.score === ex.score) return;
    d.pos = pos; d.score = ex.score; d.log = ex.log.slice(); save();
  }
  function nextQ() {
    const ex = S.ex;
    if (ex.n >= ex.total) {
      ex.done = true; ex.q = null; ex.end = Date.now();
      if (ex.type === 'daily' && store.daily) store.daily.done = true;
      save(); return;
    }
    ex.n++; ex.q = makeQ(ex);
  }

  // cronometro dell'esercizio: parte con la prima domanda, si ferma al risultato
  function exClock(ex) {
    const ms = Math.max(0, (ex.end || Date.now()) - (ex.t0 || Date.now())), m = Math.floor(ms / 60000), sec = Math.floor(ms / 1000) % 60;
    return m + ':' + String(sec).padStart(2, '0');
  }
  function exHead(ex) {
    const answered = ex.q && (ex.q.checked || (ex.q.picked !== null && ex.q.picked !== undefined));
    const pct = ex.done ? 100 : Math.round(100 * ((ex.n - 1) + (answered ? 1 : 0)) / ex.total);
    const back = ex.origin === 'test' ? 'ex-exit-test' : ex.vid ? 'ex-exit-verse' : 'ex-exit';
    const label = ex.origin === 'test' ? t('x.test') : ex.metre ? t('tab.metres') : ex.vid ? t('x.toVerse') : t('x.exercises');
    return topbar(ex.metre ? E.METRE_BY_ID[ex.metre].name : kindName(ex.type), ex.done ? t('x.result') : t('x.qOf', { n: ex.n, t: ex.total }), back, label, `<span class="extimer" id="extimer" role="timer" aria-label="${esc(t('x.timer'))}">${exClock(ex)}</span>`, true) +
      `<div class="bar-track slim"><div class="bar-fill" style="width:${pct}%"></div></div>`;
  }

  function viewEx() {
    const ex = S.ex;
    if (ex.done) {
      const by = {};
      ex.log.forEach(r => { const b = by[r.kind] || (by[r.kind] = { ok: 0, tot: 0 }); b.tot++; if (r.ok) b.ok++; });
      const brk = (ex.type === 'mix' || ex.type === 'daily' || ex.type === 'review')
        ? `<ul class="kvl">${EXK.filter(k => by[k]).map(k => `<li><span class="kl">${kindName(k)}</span><span class="kv">${t('x.ofShort', { a: by[k].ok, b: by[k].tot })}</span></li>`).join('')}</ul>` : '';
      const back = ex.origin === 'test' ? 'ex-exit-test' : ex.vid ? 'ex-exit-verse' : 'ex-exit';
      const note = ex.type === 'daily' ? `<p class="note c">${t('x.dailyNote')}</p>` : '';
      return exHead(ex) + `<section class="panel done">
        <p class="done-n">${t('x.outOf', { s: ex.score, t: ex.total })}</p>
        <p class="muted">${ex.type === 'scan' ? t('x.padaOk') : t('x.correct')}</p>${brk}${note}
        <div class="row"><button class="btn btn-p" data-act="again">${ex.type === 'daily' ? t('x.dailyAgain') : t('x.again')}</button>
        <button class="btn" data-act="${back}">${ex.origin === 'test' ? t('x.toTests') : ex.metre ? t('x.toMetre') : ex.vid ? t('x.toVerseBtn') : t('x.toEx')}</button></div></section>`;
    }
    const q = ex.q;
    const V = { scan: viewScanQ, fill: viewFillQ, spot: viewSpotQ, metre: viewMetreQ, schema: viewSchemaQ, yati: viewYatiQ, gana: viewGanaQ,
      letter: viewLetterQ, varga: viewVargaQ, hari: viewHariQ, odd: viewOddQ, grid: viewGridQ,
      sl_lg: viewSillabeQ, sl_rule: viewSillabeQ, sl_tap: viewSillabeQ, sl_div: viewSillabeQ,
      sa_res: viewSandhiQ, sa_sut: viewSandhiQ, sa_join: viewSandhiQ, sa_split: viewSandhiQ, sa_mat: viewSandhiQ, sa_comp: viewSandhiQ }[q.kind] || viewNewQ;
    return exHead(ex) + V(q, ex);
  }

  const lastBtn = ex => (ex.n >= ex.total ? t('x.seeResult') : t('x.next'));
  const needIdx = q => (q.kind === 'fill' ? q.hide : q.syls.map((s, i) => i));
  const countText = q => t(q.kind === 'fill' ? 'fq.count' : 'sq.count', { m: needIdx(q).filter(i => q.guess[i]).length, n: needIdx(q).length });

  function viewScanQ(q, ex) {
    const v = verseById(q.vid), m = E.METRE_BY_ID[v.metre], line = v.lines[q.pi];
    const done = q.checked;
    const state = done ? q.syls.map((s, i) => q.guess[i] === s.w ? 'ok' : 'bad') : null;
    const grid = padaGrid(q.syls, m, done
      ? { marks: q.syls.map(s => s.w), state, tags: true, guess: q.guess }
      : { marks: q.guess, interactive: true });
    const marked = q.guess.filter(Boolean).length;
    const wrong = done ? q.syls.map((s, i) => ({ s, i })).filter(x => q.guess[x.i] !== x.s.w) : [];
    const items = wrong.slice(0, 3).map(x => t('sq.item', {
      s: esc(x.s.t), g: W(q.guess[x.i]), w: W(x.s.w),
      why: x.s.w === 'G' ? t('sq.whyG', { r: t('rule.' + (x.s.r || 'R1')).replace(/ \(R\d\)$/, ''), c: x.s.r || 'R1' }) : t('sq.whyL')
    }));
    return `<section class="panel q">
      <p class="q-lab">${esc(t('sq.lab', { n: q.pi + 1, ref: v.ref }))}</p>
      <p class="dev q-dev">${E.toDevanagari(line)}</p>
      <p class="q-iast">${esc(line)}</p>
      ${grid}
      ${done ? `<p class="res ${wrong.length ? 'bad' : 'ok'}" role="status">${wrong.length
          ? `${t('sq.score', { a: q.syls.length - wrong.length, b: q.syls.length })} ${items.join('. ')}.`
          : t('sq.allRight')}</p>${legend()}`
        : `<p class="muted" id="cnt">${countText(q)}</p>
           ${q.hint ? `<p class="hint">${t('sq.hint', { m: m.name, n: m.n })}</p>` : ''}`}
      <div class="row">
        ${done ? `<button class="btn btn-p" data-act="next">${lastBtn(ex)}</button>`
          : `<button class="btn" data-act="hint"${q.hint ? ' disabled' : ''}>${t('sq.hintBtn')}</button>
             <button class="btn btn-p" id="check" data-act="check"${marked === q.syls.length ? '' : ' disabled'}>${t('sq.check')}</button>`}
      </div></section>`;
  }

  function viewMetreQ(q, ex) {
    const v = verseById(q.vid), line = v.lines[q.pi];
    const done = q.picked !== null;
    const opts = q.opts.map((id, i) => {
      let cls = 'opt';
      if (done) { if (id === q.answer) cls += ' ok'; else if (i === q.picked) cls += ' bad'; }
      return `<button class="${cls}" data-act="opt" data-i="${i}"${done ? ' disabled' : ''}><span class="mname">${E.METRE_BY_ID[id].name}</span><span class="dev-s">${E.METRE_BY_ID[id].dev}</span></button>`;
    }).join('');
    let fb = '';
    if (done) {
      const m = E.METRE_BY_ID[q.answer];
      const pm = E.METRE_BY_ID[q.opts[q.picked]];
      const right = pm.id === q.answer;
      const syls = E.syllabify(line), Wd = E.wstr(syls);
      const schema = schemaOf(m);
      // dove il pāda non corrisponde al metro scelto
      const whyNot = () => {
        if (Wd.length !== pm.n) return t('mq.count', { w: Wd.length, m: pm.name, n: pm.n });
        const diff = [];
        for (let i = 0; i < Wd.length; i++) {
          const want = pm.pattern ? pm.pattern[i] : (i === 4 ? 'L' : i === 5 ? 'G' : null);
          if (want && want !== Wd[i]) diff.push(t('mq.diff', { i: i + 1, s: esc(syls[i].t), a: W(Wd[i]), m: pm.name, b: W(want) }));
        }
        return diff.length ? t('mq.countOk', { d: diff.slice(0, 3).join('; ') + (diff.length > 3 ? t('mq.more', { k: diff.length - 3 }) : '') }) : '';
      };
      const why = right ? '' : `<p class="lab first">${t('mq.where')}</p><p>${whyNot() || t('mq.chose', { m: pm.name })}</p>`;
      const how = right ? '' : `<p class="lab">${t('mq.how', { m: m.name })}</p>
        <p class="lak">${m.lak.map(esc).join('<br>')}</p>
        <p>${t('met.sylls', { n: m.n })} · ${schema}${m.pattern ? `<span class="muted"> · ${yatiText(m)}</span>` : ''}</p>
        ${m.pattern ? strip(m) : ''}`;
      fb = `<p class="res ${right ? 'ok' : 'bad'}" role="status">${right ? t('mq.right') : t('mq.wrong', { a: m.name, b: pm.name })} ${t('mq.schema', { s: schema })}</p>
        ${why}
        <p class="lab${right ? ' first' : ''}">${t('mq.step')}</p>
        ${padaGrid(syls, m, { tags: true })}${legend()}${how}
        <div class="row"><button class="btn btn-p" data-act="next">${lastBtn(ex)}</button></div>`;
    }
    return `<section class="panel q">
      <p class="q-lab">${t('mq.which')}</p>
      <p class="dev q-dev">${E.toDevanagari(line)}</p>
      <p class="q-iast">${esc(line)}</p>
      <div class="opts lst">${opts}</div>${fb}</section>`;
  }

  // perché una sillaba è laghu o guru, in una frase (comincia con " — ")
  const ruleWhy = s => (s.w === 'G'
    ? t('sq.whyG', { r: t('rule.' + (s.r || 'R1')).replace(/ \(R\d\)$/, ''), c: s.r || 'R1' })
    : t('sq.whyL'));
  const weakRule = s => 'rule:' + (s.w === 'G' ? (s.r || 'R1') : 'laghu');

  function viewFillQ(q, ex) {
    const v = verseById(q.vid), m = E.METRE_BY_ID[v.metre], line = v.lines[q.pi], done = q.checked;
    const hidden = i => q.hide.indexOf(i) >= 0;
    const marks = q.syls.map((s, i) => (done || !hidden(i) ? s.w : q.guess[i]));
    const state = done ? q.syls.map((s, i) => (!hidden(i) ? '' : q.guess[i] === s.w ? 'ok' : 'bad')) : null;
    const grid = padaGrid(q.syls, m, done
      ? { marks: q.syls.map(s => s.w), state, tags: true, guess: q.guess }
      : { marks, interactive: true, open: q.hide, hid: q.hide });
    const wrong = done ? q.hide.filter(i => q.guess[i] !== q.syls[i].w) : [];
    const ready = q.hide.every(i => q.guess[i]);
    const okTxt = t('fq.right', { x: q.hide.map(i => t('fq.one', { i: i + 1, w: W(q.syls[i].w) })).join(t('fq.and')) });
    return `<section class="panel q">
      <p class="q-lab">${esc(t('fq.lab', { n: q.pi + 1, ref: v.ref }))}</p>
      <p class="dev q-dev">${E.toDevanagari(line)}</p>
      <p class="q-iast">${esc(line)}</p>
      <p class="hint">${t('fq.hint', { m: m.name, s: schemaOf(m) })}</p>
      ${grid}
      ${done ? `<p class="res ${wrong.length ? 'bad' : 'ok'}" role="status">${wrong.length
          ? wrong.map(i => t('fq.item', { i: i + 1, s: esc(q.syls[i].t), g: W(q.guess[i]), w: W(q.syls[i].w), why: ruleWhy(q.syls[i]) })).join('. ') + '.'
          : okTxt}</p>${legend()}`
        : `<p class="muted" id="cnt">${countText(q)}</p>`}
      <div class="row">
        ${done ? `<button class="btn btn-p" data-act="next">${lastBtn(ex)}</button>`
          : `<button class="btn btn-p" id="check" data-act="check"${ready ? '' : ' disabled'}>${t('sq.check')}</button>`}
      </div></section>`;
  }

  function viewSpotQ(q, ex) {
    const v = verseById(q.vid), m = E.METRE_BY_ID[v.metre], line = v.lines[q.pi], done = q.picked !== null;
    const shown = q.syls.map((s, i) => (i === q.flip ? (s.w === 'G' ? 'L' : 'G') : s.w));
    const f = q.syls[q.flip];
    const grid = done
      ? padaGrid(q.syls, m, { marks: q.syls.map(s => s.w), state: q.syls.map((s, i) => (i === q.flip ? 'ok' : i === q.picked ? 'bad' : '')), tags: true })
      : padaGrid(q.syls, m, { marks: shown, interactive: true, act: 'spotpick' });
    const right = done && q.picked === q.flip;
    const fb = done ? `<p class="res ${right ? 'ok' : 'bad'}" role="status">${right
        ? t('spq.found')
        : t('spq.was', { i: q.picked + 1, s: esc(q.syls[q.picked].t) })} ${t('spq.expl', { i: q.flip + 1, s: esc(f.t), a: W(shown[q.flip]), b: W(f.w), why: ruleWhy(f) })}</p>${legend()}
      <div class="row"><button class="btn btn-p" data-act="next">${lastBtn(ex)}</button></div>` : '';
    return `<section class="panel q">
      <p class="q-lab">${t('spq.lab')}</p>
      <p class="dev q-dev">${E.toDevanagari(line)}</p>
      <p class="q-iast">${esc(line)}</p>
      <p class="hint">${t('spq.hint', { n: q.pi + 1, m: m.name, s: schemaOf(m) })}</p>
      ${grid}
      ${done ? '' : `<p class="muted">${t('spq.tap')}</p>`}${fb}</section>`;
  }

  function viewSchemaQ(q, ex) {
    const m = E.METRE_BY_ID[q.mid], done = q.picked !== null;
    const head = q.mode === 'marks'
      ? `<p class="q-lab">${t('sch.marks')}</p><div style="display:flex;justify-content:center;margin:14px 0">${strip(m)}</div>`
      : `<p class="q-lab">${t('sch.names')}</p><p class="schema-names">${E.ganaNames(m.pattern).join(' ')}</p>`;
    const opts = q.opts.map((id, i) => {
      let cls = 'opt';
      if (done) { if (id === q.answer) cls += ' ok'; else if (i === q.picked) cls += ' bad'; }
      return `<button class="${cls}" data-act="opt" data-i="${i}"${done ? ' disabled' : ''}><span class="mname">${E.METRE_BY_ID[id].name}</span><span class="dev-s">${E.METRE_BY_ID[id].dev}</span></button>`;
    }).join('');
    let fb = '';
    if (done) {
      const pm = E.METRE_BY_ID[q.opts[q.picked]], right = pm.id === q.answer;
      fb = `<p class="res ${right ? 'ok' : 'bad'}" role="status">${right ? t('mq.right') : t('mq.wrong', { a: m.name, b: pm.name })} ${t('met.sylls', { n: m.n })} · ${E.ganaNames(m.pattern).join(' ')} · ${yatiText(m)}.</p>
        ${strip(m)}
        <p class="lab">${t('met.laks')}</p><p class="lak">${m.lak.map(esc).join('<br>')}</p>
        <div class="row"><button class="btn btn-p" data-act="next">${lastBtn(ex)}</button></div>`;
    }
    return `<section class="panel q">${head}<div class="opts lst">${opts}</div>${fb}</section>`;
  }

  function viewYatiQ(q, ex) {
    const v = verseById(q.vid), m = E.METRE_BY_ID[v.metre], line = v.lines[q.pi], done = q.picked !== null;
    const syls = E.syllabify(line);
    const opts = q.opts.map((k, i) => {
      let cls = 'opt';
      if (done) { if (k === q.answer) cls += ' ok'; else if (i === q.picked) cls += ' bad'; }
      return `<button class="${cls}" data-act="opt" data-i="${i}"${done ? ' disabled' : ''}><span class="ylab">${esc(yatiLabel(k))}</span></button>`;
    }).join('');
    const right = done && q.opts[q.picked] === q.answer;
    const fb = done ? `<p class="res ${right ? 'ok' : 'bad'}" role="status">${right ? t('mq.right') : t('yq.not')} ${t('yq.fb', { m: m.name, l: yatiLabel(q.answer), y: yatiText(m) })}</p>
      <div class="row"><button class="btn btn-p" data-act="next">${lastBtn(ex)}</button></div>` : '';
    return `<section class="panel q">
      <p class="q-lab">${t('yq.lab')}</p>
      <p class="dev q-dev">${E.toDevanagari(line)}</p>
      <p class="q-iast">${esc(line)}</p>
      <p class="hint">${t('yq.hint', { n: q.pi + 1, m: m.name, s: m.n })}</p>
      ${padaGrid(syls, m, { nums: true, noYati: !done })}
      <div class="opts lst">${opts}</div>${fb}</section>`;
  }

  function viewGanaQ(q, ex) {
    const done = q.picked !== null;
    const marks = pat => `<span class="gmarks">${[...pat].map(c => mk(c)).join('')}</span>`;
    const nameOpts = () => q.opts.map((n, i) => {
      let cls = 'opt gopt';
      if (done) { if (n === q.answer) cls += ' ok'; else if (i === q.picked) cls += ' bad'; }
      return `<button class="${cls}" data-act="opt" data-i="${i}"${done ? ' disabled' : ''}>${n}</button>`;
    }).join('');
    let head, opts;
    if (q.mode === 'p2n') {
      head = `<p class="q-lab">${t('gq.p2n')}</p><div class="gbig">${marks(E.GANA[q.answer])}</div>`;
      opts = nameOpts();
    } else if (q.mode === 'next') {
      head = `<p class="q-lab">${t('gq.next', { x: q.given })}</p>`;
      opts = nameOpts();
    } else {
      head = `<p class="q-lab">${t('gq.n2p', { x: q.answer })}</p>`;
      opts = q.opts.map((n, i) => {
        let cls = 'opt gopt';
        if (done) { if (n === q.answer) cls += ' ok'; else if (i === q.picked) cls += ' bad'; }
        return `<button class="${cls}" data-act="opt" data-i="${i}" aria-label="${[...E.GANA[n]].map(c => W(c)).join(' ')}"${done ? ' disabled' : ''}>${marks(E.GANA[n])}</button>`;
      }).join('');
    }
    let fb = '';
    if (done) {
      const right = q.opts[q.picked] === q.answer;
      const what = `<b>${q.answer}</b> = ${[...E.GANA[q.answer]].map(c => W(c)).join(' ')}.`;
      fb = `<p class="res ${right ? 'ok' : 'bad'}" role="status">${right ? t('mq.right') : t('gq.wrong')} ${q.mode === 'next' ? t('gq.nextFb', { g: q.given, a: q.answer }) + ' ' : ''}${what}</p>
        <div class="row"><button class="btn btn-p" data-act="next">${lastBtn(ex)}</button></div>`;
    }
    // nella domanda sull'ordine la formula resta nascosta finché non si risponde, altrimenti darebbe la risposta
    const mnem = q.mode === 'next' && !done ? '' : '<p class="muted mnem">yamātārājabhānasalagaṃ</p>';
    return `<section class="panel q">${head}<div class="opts g${q.mode === 'n2p' ? '2' : '4'}">${opts}</div>${fb}${mnem}</section>`;
  }


  const letterTxt = id => `<span class="dev-s" style="margin:0">${ALPHA.L[id].dev}</span> ${id}`;
  const nextRow = ex => `<div class="row"><button class="btn btn-p" data-act="next">${lastBtn(ex)}</button></div>`;

  function viewLetterQ(q, ex) {
    const A = ALPHA.L[q.answer], done = q.picked !== null, d2i = q.mode === 'd2i';
    const head = d2i ? `<p class="q-lab">${t('lq.d2i')}</p><p class="al-big">${A.dev}</p>`
      : `<p class="q-lab">${t('lq.i2d')}</p><p class="al-big is">${q.answer}</p>`;
    const opts = q.opts.map((id, i) => {
      let cls = 'opt gopt' + (d2i ? '' : ' dopt');
      if (done) { if (id === q.answer) cls += ' ok'; else if (i === q.picked) cls += ' bad'; }
      return `<button class="${cls}" data-act="opt" data-i="${i}"${done ? ' disabled' : ''}>${d2i ? id : ALPHA.L[id].dev}</button>`;
    }).join('');
    let fb = '';
    if (done) {
      const right = q.opts[q.picked] === q.answer;

  // ---- paradigmi: una sola forma di accesso per nomi, pronomi e verbi (riga × numero) ----
  const PAR = {};

  function siPools() {
    if (SIP) return SIP;
    const words = [], cls = { R1: [], R2: [], R3: [], laghu: [], R4: [] };
    VERSES.forEach(v => v.lines.forEach((line, pi) => {
      const n = siWords(line).length;
      for (let wi = 0; wi < n; wi++) {
        const info = wordInfo(v.id, pi, wi);
        if (!info) continue;
        if (info.syls.length >= 2) words.push(info);
        if (info.syls.length < 2 && !info.last) continue;
        info.syls.forEach((s, sy) => {
          if (s.amb) return;
          const c = s.w === 'G' ? (s.r || 'R1') : 'laghu';
          if (cls[c]) cls[c].push({ vid: v.id, pi, wi, sy });
        });
      }
    }));
    SIP = { words, cls,
      tap: words.filter(w => w.syls.length <= 8 && !w.syls.some(s => s.amb) && w.syls.some(s => s.w === 'G')),
      div: words.filter(w => divVariants(w).length >= 3) };
    return SIP;
  }
  const siRef = w => ({ vid: w.vid, pi: w.pi, wi: w.wi });
  const siKeyW = w => w.vid + ':' + w.pi + ':' + w.wi;
  const sylClass = s => (s.w === 'G' ? (s.r || 'R1') : 'laghu');
  const divHtml = (info, hi) => info.syls.map((s, i) => (i === hi ? `<b class="si-hl">${esc(s.t)}</b>` : esc(s.t))).join('<i class="si-sep"> | </i>');

  // ---- vocabolario ----
  const vi = e => esc(e.i) + (e.tr ? '<sup class="dg">†</sup>' : '');

  // ---- schede ----
  function keyNew(it) {
    switch (it.kind) {
      case 'no_cell': case 'pr_cell': case 'no_case': case 'pr_case': return `${it.kind}:${it.pid}:${it.cs}:${it.nb}`;
      case 'no_num': return `no_num:${it.pid}:${it.cs}:${it.mode}`;
      case 'no_err': return `no_err:${it.pid}:${it.cs}:${it.nb}:${it.c2}:${it.n2}`;
      case 'no_tab': case 'pr_tab': case 've_tab': return `${it.kind}:${it.pid}:${it.blanks.slice().sort((a, b) => a - b).join(',')}`;
      case 've_cell': return `ve_cell:${it.pid}:${it.mode}:${it.ps}:${it.nb}`;
      case 've_end': return `ve_end:${it.pid}:${it.ps}:${it.nb}`;
      case 've_pada': return `ve_pada:${it.w}`;
      case 'si_wt': case 'si_rule': return `${it.kind}:${it.vid}:${it.pi}:${it.wi}:${it.sy}`;
      case 'si_tap': case 'si_div': return `${it.kind}:${it.vid}:${it.pi}:${it.wi}`;
      default: return `${it.kind}:${it.w}${it.mode ? ':' + it.mode : ''}`;   // vo_*
    }
  }
  const inRange = (x, n) => Number.isInteger(x) && x >= 0 && x < n;
  function validNew(it) {
    const k = it.kind;
    if (k === 've_pada') return typeof it.w === 'string' && !!PADA_BY[it.w];
    if (k.startsWith('vo_')) return typeof it.w === 'string' && !!VOC_BY[it.w] && (k !== 'vo_card' || it.mode === 'w2m' || it.mode === 'm2w');
    if (k.startsWith('si_')) {
      const info = typeof it.vid === 'string' && inRange(it.pi, 4) && inRange(it.wi, 99) ? wordInfo(it.vid, it.pi, it.wi) : null;
      if (!info) return false;
      if (k === 'si_tap') return siPools().tap.some(w => siKeyW(w) === siKeyW(info));
      if (k === 'si_div') return divVariants(info).length >= 3;
      const s = info.syls[it.sy];
      return inRange(it.sy, info.syls.length) && !s.amb && (info.syls.length >= 2 || info.last);
    }
    const P = typeof it.pid === 'string' ? PAR[it.pid] : null;
    if (!P || P.mod !== modOfKind(k)) return false;
    if (k === 'no_tab' || k === 'pr_tab' || k === 've_tab') {
      return tabOkP(P) && Array.isArray(it.blanks) && it.blanks.length === TAB_N[P.mod] && new Set(it.blanks).size === it.blanks.length &&
        it.blanks.every(i => inRange(i, P.nc * 3) && P.ok(Math.floor(i / 3), i % 3));
    }
    if (k === 've_cell') {
      if (it.mode !== 'a' && it.mode !== 'b') return false;
      return inRange(it.ps, it.mode === 'a' ? 3 : 4) && inRange(it.nb, 3) && !(it.mode === 'b' && pronOpen(it.ps, it.nb));
    }
    if (k === 've_end') return inRange(it.ps, 3) && inRange(it.nb, 3);
    if (!inRange(it.cs, P.nc)) return false;
    if (k === 'no_cell' || k === 'pr_cell') return inRange(it.nb, 3) && P.ok(it.cs, it.nb);
    if (k === 'no_case' || k === 'pr_case') return inRange(it.nb, 3) && uniqCell(P, it.cs, it.nb);
    if (k === 'no_num') return (it.mode === 's2p' || it.mode === 's2d') && P.ok(it.cs, 0) && P.ok(it.cs, it.mode === 's2p' ? 2 : 1) && P.txt(it.cs, 0) !== P.txt(it.cs, it.mode === 's2p' ? 2 : 1);
    if (k === 'no_err') {
      if (!inRange(it.nb, 3) || !inRange(it.c2, P.nc) || !inRange(it.n2, 3) || !rowOk(P, it.cs) || !P.ok(it.c2, it.n2)) return false;
      return ![0, 1, 2].some(n => P.txt(it.cs, n) === P.txt(it.c2, it.n2));
    }
    return false;
  }

  function newItem(kind, ex) {
    const used = ex.used;
    const once = f => { let it; for (let k = 0; k < 40; k++) { it = f(); const kk = keyNew(it); if (!used.has(kk)) { used.add(kk); return it; } } return it; };
    const P = mod => PAR[nmPick(parIds(mod))];
    switch (kind) {
      case 'no_cell': case 'pr_cell': return once(() => { const p = P(kind === 'no_cell' ? 'nomi' : 'pronomi'), x = nmPick(cellsOf(p)); return { kind, pid: p.id, cs: x.c, nb: x.n }; });
      case 'no_case': case 'pr_case': return once(() => { const p = P(kind === 'no_case' ? 'nomi' : 'pronomi'), x = nmPick(cellsOf(p).filter(y => uniqCell(p, y.c, y.n))); return { kind, pid: p.id, cs: x.c, nb: x.n }; });
      case 'no_num': return once(() => {
        const p = P('nomi'), mode = rnd(2) ? 's2p' : 's2d', n = mode === 's2p' ? 2 : 1;
        const rows = nmRange(8).filter(c => p.ok(c, 0) && p.ok(c, n) && p.txt(c, 0) !== p.txt(c, n));
        return { kind, pid: p.id, cs: nmPick(rows), mode };
      });
      case 'no_err': return once(() => {
        const p = P('nomi'), c = nmPick(nmRange(8).filter(r => rowOk(p, r))), n = rnd(3);
        const rep = nmPick(cellsOf(p).filter(x => ![0, 1, 2].some(m => p.txt(c, m) === p.txt(x.c, x.n))));
        return { kind, pid: p.id, cs: c, nb: n, c2: rep.c, n2: rep.n };
      });
      case 'no_tab': case 'pr_tab': case 've_tab': return once(() => {
        const mod = kind === 'no_tab' ? 'nomi' : kind === 'pr_tab' ? 'pronomi' : 'verbi';
        const p = PAR[nmPick(parIds(mod).filter(id => tabOkP(PAR[id])))];
        return { kind, pid: p.id, blanks: shuffle(cellsOf(p)).slice(0, TAB_N[mod]).map(x => x.c * 3 + x.n).sort((a, b) => a - b) };
      });
      case 've_cell': return once(() => {
        const mode = rnd(2) ? 'a' : 'b';
        for (;;) { const ps = rnd(mode === 'a' ? 3 : 4), nb = rnd(3); if (mode === 'b' && pronOpen(ps, nb)) continue; return { kind, pid: nmPick(VERBS).id, mode, ps, nb }; }
      });
      case 've_end': return once(() => ({ kind, pid: nmPick(VERBS).id, ps: rnd(3), nb: rnd(3) }));
      case 've_pada': return once(() => ({ kind, w: nmPick(PADA).s }));
      case 'si_wt': case 'si_rule': return once(() => {
        const cl = siPools().cls;
        let c;
        if (kind === 'si_wt') c = rnd(2) ? 'laghu' : nmPick(['R1', 'R2', 'R3', 'R4'].filter(x => cl[x].length));
        else c = nmPick(Object.keys(cl).filter(x => cl[x].length));
        const r = nmPick(cl[c]);
        return { kind, vid: r.vid, pi: r.pi, wi: r.wi, sy: r.sy };
      });
      case 'si_tap': return once(() => Object.assign({ kind }, siRef(nmPick(siPools().tap))));
      case 'si_div': return once(() => Object.assign({ kind }, siRef(nmPick(siPools().div))));
      case 'vo_card': return once(() => ({ kind, w: nmPick(VOCAB).i, mode: rnd(2) ? 'w2m' : 'm2w' }));
      default: return once(() => ({ kind, w: nmPick(VOCAB).i }));   // vo_mean, vo_word
    }
  }

  // ---- domande ----
  function buildNew(it, key, item) {
    const k = it.kind, base = { kind: k, key, item, picked: null };
    if (k === 'no_cell' || k === 'pr_cell') {
      const P = PAR[it.pid], ans = P.txt(it.cs, it.nb), opts = formOpts(P, it.cs, it.nb, ans);
      return Object.assign(base, { pid: it.pid, cs: it.cs, nb: it.nb, answer: ans, opts, dv: devMapOf(P, opts) });
    }
    if (k === 'no_case' || k === 'pr_case') {
      const P = PAR[it.pid], me = it.cs + ',' + it.nb;
      return Object.assign(base, { pid: it.pid, cs: it.cs, nb: it.nb, answer: me, opts: comboOpts(P, it.cs, it.nb) });
    }
    if (k === 'no_num') {
      const P = PAR[it.pid], n = it.mode === 's2p' ? 2 : 1, ans = P.txt(it.cs, n), opts = formOpts(P, it.cs, n, ans);
      return Object.assign(base, { pid: it.pid, cs: it.cs, mode: it.mode, tn: n, answer: ans, opts, dv: devMapOf(P, opts.concat([P.txt(it.cs, 0)])) });
    }
    if (k === 'no_err') {
      const P = PAR[it.pid], rep = P.txt(it.c2, it.n2);
      return Object.assign(base, { pid: it.pid, cs: it.cs, nb: it.nb, c2: it.c2, n2: it.n2, rep, row: [0, 1, 2].map(n => (n === it.nb ? rep : P.txt(it.cs, n))), answer: it.nb, opts: [0, 1, 2] });
    }
    if (k === 'no_tab' || k === 'pr_tab' || k === 've_tab') {
      const bl = it.blanks.slice().sort((a, b) => a - b);
      return Object.assign(base, { pid: it.pid, blanks: bl, placed: {}, sel: bl[0], pool: shuffle(bl.slice()), checked: false });
    }
    if (k === 've_cell') {
      const P = PAR[it.pid], p = Math.min(it.ps, 2), ans = P.txt(p, it.nb), opts = formOpts(P, p, it.nb, ans);
      return Object.assign(base, { pid: it.pid, mode: it.mode, ps: it.ps, nb: it.nb, answer: ans, opts, dv: devMapOf(P, opts) });
    }
    if (k === 've_end') {
      const P = PAR[it.pid];
      return Object.assign(base, { pid: it.pid, ps: it.ps, nb: it.nb, answer: it.ps + ',' + it.nb, opts: comboOpts(P, it.ps, it.nb) });
    }
    if (k === 've_pada') {
      const x = PADA_BY[it.w];
      return Object.assign(base, { w: it.w, answer: x.pada, opts: shuffle(['p', 'a']) });
    }
    if (k.startsWith('si_')) {
      const info = wordInfo(it.vid, it.pi, it.wi), b = Object.assign(base, { vid: it.vid, pi: it.pi, wi: it.wi, info });
      if (k === 'si_wt') { const s = info.syls[it.sy]; return Object.assign(b, { sy: it.sy, answer: s.w, opts: shuffle(['L', 'G']) }); }
      if (k === 'si_rule') {
        const s = info.syls[it.sy], c = sylClass(s), last = s.fin && it.sy === info.syls.length - 1;
        const opts = ['R1', 'R2', 'R3'].concat(last ? ['R4'] : [], ['laghu']);
        return Object.assign(b, { sy: it.sy, answer: c, last, opts: shuffle(opts) });
      }
      if (k === 'si_tap') return Object.assign(b, { sel: info.syls.map(() => false), checked: false });
      const { toks, bs } = divParts(info), ans = divStr(toks, bs);
      return Object.assign(b, { answer: ans, opts: shuffle([ans].concat(shuffle(divVariants(info)).slice(0, 3))) });
    }
    // vocabolario
    const e = VOC_BY[it.w];
    if (k === 'vo_card') return Object.assign(base, { w: it.w, mode: it.mode, flipped: false });
    if (k === 'vo_mean') {
      const pool = VOCAB.filter(x => x.m !== e.m), near = shuffle(pool.filter(x => x.g === e.g)), far = shuffle(pool.filter(x => x.g !== e.g)), out = [];
      near.concat(far).forEach(x => { if (out.length < 3 && !out.includes(x.m)) out.push(x.m); });
      return Object.assign(base, { w: it.w, answer: e.m, opts: shuffle([e.m].concat(out)) });
    }
    const pool = VOCAB.filter(x => x.i !== e.i && x.m !== e.m), near = shuffle(pool.filter(x => x.g === e.g)), far = shuffle(pool.filter(x => x.g !== e.g)), out = [];
    near.concat(far).forEach(x => { if (out.length < 3) out.push(x.i); });
    return Object.assign(base, { w: it.w, answer: e.i, opts: shuffle([e.i].concat(out)) });
  }

  // punti deboli di una risposta sbagliata
  function newWeak(q) {
    const k = q.kind;
    if (k === 've_cell' || k === 've_end') return ['vform:' + Math.min(q.ps, 2) + q.nb];
    if (k === 'no_cell' || k === 'pr_cell' || k === 'no_case' || k === 'pr_case' || k === 'no_num' || k === 'no_err') return ['case:' + q.cs];
    if (k === 'si_wt' || k === 'si_rule') return ['rule:' + sylClass(q.info.syls[q.sy])];
    if (k.startsWith('vo_')) return ['word:' + q.w];
    return [];
  }
  // domanda mirata su un punto debole (Test): caso, forma verbale, parola o regola sillabica
  function weakNew(ty, a, ks) {
    if (ty === 'case' && /^[0-7]$/.test(a)) {
      const c = +a, mods = [];
      if (ks.includes('no_cell')) mods.push('no_cell');
      if (ks.includes('pr_cell') && c < 7) mods.push('pr_cell');
      if (!mods.length) return null;
      const kind = nmPick(mods), P = PAR[nmPick(parIds(kind === 'no_cell' ? 'nomi' : 'pronomi'))], ns = [0, 1, 2].filter(n => P.ok(c, n));
      return ns.length ? buildQ({ kind, pid: P.id, cs: c, nb: nmPick(ns) }) : null;
    }
    if (ty === 'vform' && /^[0-2][0-2]$/.test(a) && ks.includes('ve_cell')) return buildQ({ kind: 've_cell', pid: nmPick(VERBS).id, mode: 'a', ps: +a[0], nb: +a[1] });
    if (ty === 'word' && VOC_BY[a]) {
      const kinds = ['vo_mean', 'vo_word', 'vo_card'].filter(x => ks.includes(x));
      if (!kinds.length) return null;
      const kind = nmPick(kinds);
      return buildQ(kind === 'vo_card' ? { kind, w: a, mode: rnd(2) ? 'w2m' : 'm2w' } : { kind, w: a });
    }
    if (ty === 'rule' && (ks.includes('si_wt') || ks.includes('si_rule')) && (!ks.includes('scan') || rnd(2))) {
      const c = siPools().cls[a];
      if (!c || !c.length) return null;
      const r = nmPick(c), both = ks.includes('si_wt') && ks.includes('si_rule');
      const kind = both ? (rnd(2) ? 'si_rule' : 'si_wt') : (ks.includes('si_rule') ? 'si_rule' : 'si_wt');
      return buildQ({ kind, vid: r.vid, pi: r.pi, wi: r.wi, sy: r.sy });
    }
    return null;
  }

  // ---------- schermate dei moduli ----------
  const MTORDER = ['teoria', 'esercizi'];
  const MTLAB = { sillabe: 'tab.rules', nomi: 'tab.tables', pronomi: 'tab.tables', verbi: 'tab.tables', vocab: 'tab.words' };
  function modNav() {
    const id = S.screen;
    return modbar('m', [['teoria', t(MTLAB[id])], ['esercizi', t('tab.exercises')]], S.mtab, t('mod.' + id), 'mtab');
  }
  const NSEL = { nomi: 'krishna', pronomi: 'asmad', verbi: 'vand' };
  function selBar(mod) {
    const labs = { verbi: id => t('ve.sel.' + verbOf(id).pada) };
    return `<div class="np-sel" role="group">` + parIds(mod).map(id => {
      const on = S.nsel[mod] === id, P = PAR[id];
      return `<button class="np-b${on ? ' on' : ''}" data-act="nsel" data-mod="${mod}" data-id="${id}" aria-pressed="${on}">${esc(labs[mod] ? labs[mod](id) : P.name)}</button>`;
    }).join('') + '</div>';
  }
  // tabella (riga × numero) per la teoria e per le domande
  function tblHtml(P, o) {
    o = o || {};
    const rl = o.rowLab || (c => `${t('csa.' + c)}<small>${CASE_SK[c]}</small>`);
    const head = `<span></span>` + [0, 1, 2].map(n => `<span class="np-h">${numN(n)}</span>`).join('');
    let rows = '';
    for (let c = 0; c < P.nc; c++) {
      rows += `<span class="np-r">${rl(c)}</span>`;
      for (let n = 0; n < 3; n++) rows += o.cell ? o.cell(c, n) : plainCell(P, c, n, o);
    }
    return `<div class="np-t">${head}${rows}</div>`;
  }
  function plainCell(P, c, n, o) {
    const dv = P.dv(c, n), flag = P.mod === 'nomi' ? P.raw.t[c][n][2] : null;
    const hl = o.hl && o.hl(c, n) ? ' hl' : '';
    let body = o.hlsf ? o.hlsf(c, n) : esc(P.txt(c, n));
    return `<span class="np-c${flag === 'x' ? ' x' : ''}${hl}">${body}${flag ? '<sup class="dg">!</sup>' : ''}${dv ? `<span class="dv">${esc(dv)}</span>` : ''}</span>`;
  }

  // tabella vera per la teoria: rows = [etichetta di riga, [contenuto delle tre celle], [classi delle celle]]
  function tpTable(rows) {
    const head = '<th></th>' + [0, 1, 2].map(n => `<th scope="col">${numN(n)}</th>`).join('');
    const body = rows.map(r => `<tr><th scope="row" class="rh">${r[0]}</th>${r[1].map((c, i) => `<td class="${[i % 2 === 0 ? 'alt' : '', r[2] && r[2][i] ? r[2][i] : ''].join(' ').trim()}">${c}</td>`).join('')}</tr>`).join('');
    return `<div class="at-w"><table class="at tp"><colgroup><col style="width:70px"></colgroup><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }
  const hlOf = id => (c, n) => !!(S.hl && S.hl.id === id && S.hl.cells.some(x => x[0] === c && x[1] === n));
  function tblTab(P, o) {
    o = o || {};
    const rl = o.rowLab || (c => `${t('csa.' + c)}<small>${CASE_SK[c]}</small>`);
    const rows = [];
    for (let c = 0; c < P.nc; c++) {
      const cells = [], cls = [];
      for (let n = 0; n < 3; n++) {
        const dv = P.dv(c, n), flag = P.mod === 'nomi' ? P.raw.t[c][n][2] : null;
        const body = o.hlsf ? o.hlsf(c, n) : esc(P.txt(c, n));
        cells.push(`${body}${flag ? '<sup class="dg">!</sup>' : ''}${dv ? `<span class="dv">${esc(dv)}</span>` : ''}`);
        cls.push((flag === 'x' ? 'x' : '') + (o.hl && o.hl(c, n) ? ' hl' : ''));
      }
      rows.push([rl(c), cells, cls]);
    }
    return tpTable(rows);
  }

  function viewTeoriaNomi() {
    const id = S.nsel.nomi, P = PAR[id], N = P.raw;
    const hasFlag = N.t.some(r => r.some(c => c[2]));
    const lists = `<p class="lab">${t('no.cases')}</p>
      <ol class="np-ol">${CASE_SK.map((s, i) => `<li><b>${s}</b> <span class="dev-s">${CASE_DV[i]}</span> · ${caseN(i)}</li>`).join('')}</ol>
      <p class="lab">${t('no.numbers')}</p>
      <ol class="np-ol">${NUM_SK.map((s, i) => `<li><b>${s}</b> <span class="dev-s">${NUM_DV[i]}</span> · ${numN(i)}</li>`).join('')}</ol>
      <p class="lab">${t('no.genders')}</p>
      <ul class="np-ol"><li>${t('gn.f')}</li><li>${t('gn.m')}</li><li>${t('gn.n')}</li></ul>`;
    return `<p class="intro">${t('no.intro')}</p>${selBar('nomi')}
      <section class="card flat" data-pswipe="nomi">
        <h2 class="np-title">${esc(N.name)} <span class="dev-s">${N.dev}</span></h2>
        ${N.cls ? `<p class="np-cls">${esc(N.cls)}</p>` : ''}
        ${tblTab(P, { hl: hlOf(id) })}
        ${hasFlag ? `<p class="note tight"><sup class="dg">!</sup> ${t(N.t.some(r => r.some(c => c[2] === 'x')) ? 'no.flagX' : 'no.flagAlt')}</p>` : ''}
      </section>
      <section class="card flat">${lists.replace('<p class="lab">', '<p class="lab first">')}</section>`;
  }
  function viewTeoriaPronomi() {
    const id = S.nsel.pronomi, P = PAR[id], N = P.raw;
    return `<p class="intro">${t('pr.intro')}</p>${selBar('pronomi')}
      <section class="card flat" data-pswipe="pronomi">
        <h2 class="np-title">${esc(N.name)} <span class="dev-s">${N.dev}</span></h2>
        <p class="np-cls">${t('pr.p' + N.p)}</p>
        ${tblTab(P, { hl: hlOf(id) })}
      </section>`;
  }
  function viewTeoriaVerbi() {
    const id = S.nsel.verbi, V = verbOf(id), P = PAR[id], a = V.pada === 'a';
    const suf = tpTable([0, 1, 2].map(p => [perN(p), [0, 1, 2].map(n => `${esc(V.suf[p][n])}<span class="dv">${V.sd[p][n]}</span>`)]));
    const conj = tblTab(P, {
      hl: hlOf(id),
      rowLab: p => perN(p),
      hlsf: (p, n) => { const f = V.f[p][n], h = V.hl[p][n]; return esc(f.slice(0, f.length - h.length)) + `<b class="sf">${esc(h)}</b>`; }
    });
    const pr = tpTable([0, 1, 2, 3].map(ps => [ps < 2 ? perN(ps) : perN(2) + `<small>${t(ps === 2 ? 'pe.m' : 'pe.f')}</small>`, [0, 1, 2].map(n => {
      const f = V.f[Math.min(ps, 2)][n];
      return `${esc(pronV(id, ps, n))} ${esc(f)}${pronOpen(ps, n) ? '<sup class="dg">!</sup>' : ''}`;
    })]));
    const list = a ? VLIST.a : VLIST.p;
    return `<p class="intro">${t('ve.intro')}</p>${selBar('verbi')}
      <section class="card flat" data-pswipe="verbi">
        <h2 class="np-title">${esc(V.name)} <span class="dev-s">${V.dev}</span> <span class="np-sk">— ${t('ve.mean.' + id)}</span></h2>
        <p class="np-cls">${t('ve.pada.' + V.pada)}</p>
        <p class="lab">${t('ve.suf')}</p>${suf}
        <p class="note tight">${t('ve.note.' + V.pada)}</p>
        <p class="lab">${t('ve.conj', { v: esc(V.name) })}</p>${conj}
        <p class="lab">${t('ve.pron')}</p>${pr}
        <p class="note tight"><sup class="dg">!</sup> ${t('ve.flag3')}</p>
      </section>
      <section class="card flat">
        <p class="lab first">${t('ve.list.' + V.pada)}</p>
        <ul class="np-list">${list.map(x => `<li><span class="np-lw">${esc(x[1])}<span class="dev-s">${x[0]}</span></span><span class="np-lm">${esc(x[2])}</span></li>`).join('')}</ul>
      </section>`;
  }
  function viewTeoriaSillabe() {
    const ex = (line, hi) => `<p class="si-ex">${hi ? esc(line.slice(0, line.length - hi.length)) + `<b class="si-hl">${esc(hi)}</b>` : esc(line)}</p>`;
    return `<p class="intro">${t('si.intro')}</p>
      <section class="card">
        <p class="lab first">${t('si.def')}</p>
        <p class="si-p"><b>vāmana akṣara वामन अक्षर</b> = laghu akṣara लघु अक्षर</p>
        <p class="si-p"><b>trivikrama akṣara त्रिविक्रम अक्षर</b> = guru akṣara गुरु अक्षर</p>
        <p class="si-p muted">वामनो लघुः · vāmanaḥ laghuḥ<br>त्रिविक्रमो गुरुः · trivikramaḥ guruḥ</p>
        <p class="lab">${t('si.r1h')}</p>
        <p class="si-p">${t('si.r1a')}: <b>a अ · i इ · u उ · ṛ ऋ</b></p>
        <p class="si-p">${t('si.r1b')}: <b>ā आ · ī ई · ū ऊ · ṝ ॠ · e ए · ai ऐ · o ओ · au औ · aṁ अं · aḥ अः</b></p>
        <p class="lab">${t('si.r2h')}</p>
        <p class="si-p"><b>सत्सङ्गत् पूर्वो वामनोऽपि गुरुः</b><br>satsaṅgat pūrvo vāmano ’pi guruḥ</p>
        <p class="si-p">${t('si.r2')}</p>
        <p class="lab">${t('si.r3h')}</p>
        <p class="si-p"><b>vāmana + viṣṇucakra / viṣṇusarga / halanta = trivikrama</b></p>
        <p class="si-p">${t('si.r3')}</p>
        <p class="lab">${t('si.r4h')}</p>
        ${ex('kṣipraṁ bhavati dharmātmā', '')}
        ${ex('śaśvac-chāntiṁ nigacchati', 'ti')}
        ${ex('kaunteya pratijānīhi', '')}
        ${ex('na me bhaktaḥ praṇaśyati', 'ti')}
        <p class="si-p">${t('si.r4')}</p>
        <p class="note tight">${t('si.div')}</p>
        <p class="note tight">${t('si.words')}</p>
      </section>`;
  }
  function viewTeoriaVocab() {
    const grp = (g, h) => `<p class="lab${g === 'v' ? ' first' : ''}">${t(h)}</p><ul class="np-list">` +
      VOCAB.filter(e => e.g === g).map(e => `<li><span class="np-lw">${vi(e)}<span class="vo-d">${e.d}</span></span><span class="np-lm">${esc(e.m)}</span></li>`).join('') + '</ul>';
    return `<p class="intro">${t('vo.intro')}</p><section class="card">${grp('v', 'vo.verbs')}${grp('n', 'vo.nouns')}<p class="note tight">${t('vo.tr')}</p></section>`;
  }
  const THEORY = { sillabe: viewTeoriaSillabe, nomi: viewTeoriaNomi, pronomi: viewTeoriaPronomi, verbi: viewTeoriaVerbi, vocab: viewTeoriaVocab };
  function viewEserciziNew(mod) {
    return `<p class="intro">${t('ex.intro')}</p><div class="list">` + NEWMOD[mod].map(id => {
      const p = progress[id];
      return `<button class="vrow ex-c" data-act="start" data-type="${id}">
        <span class="vt"><span class="ex-t">${kindName(id)}</span><span class="vd">${t('ex.' + id + 'D')}</span><span class="vp">${p ? t('ex.tried', { ok: p.ok, tot: p.tot }) : t('ex.notTried')}</span></span>${CHEV}</button>`;
    }).join('') + '</div>';
  }
  function viewNewMod() {
    const id = S.screen;
    return topbar(t('mod.' + id), t(id + '.sub'), 'moduli', t('tab.modules'), modNav()) + (S.mtab === 'teoria' ? THEORY[id]() : viewEserciziNew(id));
  }

  // ---------- domande dei moduli ----------
  const fbRow = (right, q, a, b) => `<p class="res ${right ? 'ok' : 'bad'}" role="status">${right ? t('mq.right') : t('mq.wrong', { a, b })}</p>`;
  function optsHtml(q, label, cls, extra) {
    const done = q.picked !== null;
    return `<div class="opts ${cls}">` + q.opts.map((o, i) => {
      let c = 'opt' + (cls === 'g2' || cls === 'g3' ? ' gopt' : '') + (extra || '');
      if (done) { if (o === q.answer) c += ' ok'; else if (i === q.picked) c += ' bad'; }
      return `<button class="${c}" data-act="opt" data-i="${i}"${done ? ' disabled' : ''}>${label(o)}</button>`;
    }).join('') + '</div>';
  }
  const formLab = q => o => `<span class="mname">${esc(o)}</span>${q.dv && q.dv[o] ? `<span class="dv">${esc(q.dv[o])}</span>` : ''}`;
  const comboLab = (kind, o) => { const [c, n] = o.split(',').map(Number); return kind.startsWith('ve') ? pnLab(c, n) : cnLab(c, n); };
  const bigForm = (s, dv) => `<p class="np-w">${esc(s)}</p>${dv ? `<p class="np-d">${esc(dv)}</p>` : ''}`;
  const rowHtml = (P, c, nb) => `<p class="np-row">${[0, 1, 2].map(n => `<span class="${n === nb ? 'on' : ''}"><i>${numN(n)}</i>${esc(P.txt(c, n))}</span>`).join('')}</p>`;

  function viewTabQ(q, ex) {
    const P = PAR[q.pid], mod = P.mod, nm = esc(P.name);
    const left = q.pool.filter(i => !Object.values(q.placed).includes(i));
    const all = q.blanks.every(b => q.placed[b] !== undefined);
    const wrong = q.checked ? q.blanks.filter(b => txtAt(P, q.placed[b]) !== txtAt(P, b)) : [];
    const rl = mod === 'verbi' ? { rowLab: p => perN(p) } : {};
    const tb = tblHtml(P, Object.assign({}, rl, {
      cell: (c, n) => {
        const i = c * 3 + n, dv = P.dv(c, n);
        if (!q.blanks.includes(i)) return plainCell(P, c, n, {});
        const pid = q.placed[i];
        let cls = 'np-c blank';
        if (q.checked) cls += txtAt(P, pid) === txtAt(P, i) ? ' ok' : ' bad'; else if (q.sel === i) cls += ' sel';
        const inner = pid !== undefined ? esc(txtAt(P, pid)) : '&nbsp;';
        const was = q.checked && txtAt(P, pid) !== txtAt(P, i) ? `<span class="al-w">${esc(txtAt(P, i))}</span>` : '';
        return q.checked ? `<span class="${cls}">${inner}${was}</span>`
          : `<button type="button" class="${cls}" data-act="tcell" data-i="${i}" aria-label="${esc(pid !== undefined ? txtAt(P, pid) : '?')}">${inner}</button>`;
      }
    }));
    const lab = t(mod === 'nomi' ? 'no.q.tab' : mod === 'pronomi' ? 'pr.q.tab' : 've.q.tab', { n: nm, v: nm });
    const flagged = mod === 'nomi' && P.raw.t.some(r => r.some(c => c[2]));
    return `<section class="panel q"><p class="q-lab">${lab}</p>${tb}
      ${flagged ? `<p class="note tight"><sup class="dg">!</sup> ${t('no.flagAlt')}</p>` : ''}
      ${q.checked
        ? `<p class="res ${wrong.length ? 'bad' : 'ok'}" role="status">${wrong.length ? t('gr.score', { a: q.blanks.length - wrong.length, b: q.blanks.length }) : t('gr.all')}</p>${nextRow(ex)}`
        : `<div class="al-pool">${left.map(i => `<button type="button" class="al-chip" data-act="tchip" data-id="${i}"><span class="np-chip">${esc(txtAt(P, i))}</span></button>`).join('')}</div>
           <div class="row"><button class="btn btn-p" data-act="tcheck"${all ? '' : ' disabled'}>${t('sq.check')}</button></div>`}
    </section>`;
  }

  function viewSiQ(q, ex) {
    const info = q.info, done = q.kind === 'si_tap' ? q.checked : q.picked !== null;
    const dev = E.toDevanagari(info.text);
    const where = `<p class="si-where">${esc(t('sq.lab', { n: info.pi + 1, ref: info.ref }))}</p>`;
    const word = (hi) => `<p class="si-w">${divHtml(info, hi)}</p><p class="np-d">${dev}</p>`;
    const whyOf = s => (s.w === 'G' ? t('rule.' + (s.r || 'R1')) : t('si.why.L'));
    if (q.kind === 'si_wt' || q.kind === 'si_rule') {
      const s = info.syls[q.sy], right = done && q.opts[q.picked] === q.answer;
      let lab, label;
      if (q.kind === 'si_wt') { lab = t('si.q.wt'); label = o => `<span class="mname">${W(o)}</span>`; }
      else { lab = q.last ? t('si.q.last', { n: info.pi + 1, ref: info.ref }) : t('si.q.rule'); label = o => `<span class="mname">${t('si.o.' + o)}</span>`; }
      const cls = q.kind === 'si_wt' ? 'g2' : 'lst';
      let fb = '';
      if (done) {
        const ans = q.kind === 'si_wt' ? W(q.answer) : t('si.o.' + q.answer), pk = q.kind === 'si_wt' ? W(q.opts[q.picked]) : t('si.o.' + q.opts[q.picked]);
        fb = `${fbRow(right, q, ans, pk)}<p class="note tight">${esc(s.t)}: <b>${W(s.w)}</b> — ${esc(whyOf(s))}</p>${nextRow(ex)}`;
      }
      return `<section class="panel q"><p class="q-lab">${lab}</p>${q.kind === 'si_rule' && q.last ? where : ''}${word(q.sy)}${optsHtml(q, label, cls)}${fb}</section>`;
    }
    if (q.kind === 'si_tap') {
      const on = q.sel.filter(Boolean).length;
      const sy = info.syls.map((s, i) => {
        let cls = 'si-s' + (q.sel[i] ? ' on' : '');
        if (q.checked) cls = 'si-s ' + ((q.sel[i] === (s.w === 'G')) ? 'ok' : 'bad');
        const m = q.checked ? `<span class="si-m">${mk(s.w)}</span>` : '';
        return q.checked ? `<span class="${cls}">${esc(s.t)}${m}</span>`
          : `<button type="button" class="${cls}" data-act="sitap" data-i="${i}" aria-pressed="${!!q.sel[i]}">${esc(s.t)}</button>`;
      }).join('');
      const bad = q.checked ? info.syls.map((s, i) => ({ s, i })).filter(x => q.sel[x.i] !== (x.s.w === 'G')) : [];
      const items = bad.slice(0, 3).map(x => `“${esc(x.s.t)}”: ${W(x.s.w)} — ${esc(whyOf(x.s))}`);
      return `<section class="panel q"><p class="q-lab">${t('si.q.tap')}</p><p class="si-w plain">${esc(info.text)}</p><p class="np-d">${dev}</p>
        <div class="si-syl">${sy}</div>
        ${q.checked
          ? `<p class="res ${bad.length ? 'bad' : 'ok'}" role="status">${bad.length ? t('sq.score', { a: info.syls.length - bad.length, b: info.syls.length }) + ' ' + items.join('. ') + '.' : t('sq.allRight')}</p>${legend()}${nextRow(ex)}`
          : `<p class="muted c">${tn('si.tapCount', on)}</p><div class="row"><button class="btn btn-p" data-act="sicheck">${t('sq.check')}</button></div>`}
      </section>`;
    }
    // si_div
    const right = done && q.opts[q.picked] === q.answer;
    const fb = done ? `${fbRow(right, q, esc(q.answer), esc(q.opts[q.picked]))}<p class="note tight">${t('si.divNote')}</p>${nextRow(ex)}` : '';
    return `<section class="panel q"><p class="q-lab">${t('si.q.div')}</p><p class="si-w plain">${esc(info.text)}</p><p class="np-d">${dev}</p>
      ${optsHtml(q, o => `<span class="mname">${esc(o)}</span>`, 'lst')}${fb}</section>`;
  }

  function viewVocabQ(q, ex) {
    const e = VOC_BY[q.w], dag = e.tr ? `<p class="note c tight">${t('vo.tr')}</p>` : '';
    if (q.kind === 'vo_card') {
      const w2m = q.mode === 'w2m', done = q.picked !== null;
      const word = `<p class="np-w">${vi(e)}</p><p class="np-d vo-d">${e.d}</p>`, mean = `<p class="np-w vo-m">${esc(e.m)}</p>`;
      const front = w2m ? word : mean, back = w2m ? mean : word;
      return `<section class="panel q vo-card"><p class="q-lab">${t(w2m ? 'vo.q.mean' : 'vo.q.word')}</p>
        <div class="vo-face">${front}${q.flipped ? `<hr class="vo-hr">${back}${dag}` : ''}</div>
        ${!q.flipped ? `<div class="row"><button class="btn btn-p" data-act="vflip">${t('vo.show')}</button></div>`
          : done ? `<p class="res ${q.picked ? 'ok' : 'bad'}" role="status">${t(q.picked ? 'vo.fbKnew' : 'vo.fbAgain')}</p>${nextRow(ex)}`
          : `<div class="row"><button class="btn" data-act="vgrade" data-k="0">${t('vo.again')}</button><button class="btn btn-p" data-act="vgrade" data-k="1">${t('vo.knew')}</button></div>
             <p class="note c">${t('vo.cardNote')}</p>`}
      </section>`;
    }
    const done = q.picked !== null, right = done && q.opts[q.picked] === q.answer;
    if (q.kind === 'vo_mean') {
      const fb = done ? `${fbRow(right, q, esc(q.answer), esc(q.opts[q.picked]))}${dag}${nextRow(ex)}` : '';
      return `<section class="panel q"><p class="q-lab">${t('vo.q.mean')}</p><p class="np-w">${vi(e)}</p><p class="np-d vo-d">${e.d}</p>
        ${optsHtml(q, o => `<span class="mname vo-o">${esc(o)}</span>`, 'lst')}${fb}</section>`;
    }
    const lab = o => `<span class="mname">${vi(VOC_BY[o])}</span><span class="dv">${VOC_BY[o].d}</span>`;
    const fb = done ? `${fbRow(right, q, vi(VOC_BY[q.answer]) + ' ' + VOC_BY[q.answer].d, vi(VOC_BY[q.opts[q.picked]]))}${q.opts.some(o => VOC_BY[o].tr) ? `<p class="note c tight">${t('vo.tr')}</p>` : ''}${nextRow(ex)}` : '';
    return `<section class="panel q"><p class="q-lab">${t('vo.q.word')}</p><p class="np-w vo-m">${esc(e.m)}</p>
      ${optsHtml(q, lab, 'g2', ' oc')}${fb}</section>`;
  }

  function viewNewQ(q, ex) {
    const k = q.kind;
    if (k.startsWith('si_')) return viewSiQ(q, ex);
    if (k.startsWith('vo_')) return viewVocabQ(q, ex);
    if (k === 'no_tab' || k === 'pr_tab' || k === 've_tab') return viewTabQ(q, ex);
    const done = q.picked !== null, right = done && q.opts[q.picked] === q.answer;
    if (k === 've_pada') {
      const x = PADA_BY[q.w], names = { p: 'Parapada', a: 'Ātmapada' };
      const fb = done ? `${fbRow(right, q, names[q.answer], names[q.opts[q.picked]])}<p class="note tight">${t('ve.pada.p')}<br>${t('ve.pada.a')}</p>${nextRow(ex)}` : '';
      return `<section class="panel q"><p class="q-lab">${t('ve.q.pada')} <span class="np-sk">(${t('ve.pt.' + x.ty)})</span></p>${bigForm(x.ty === 'suf' ? '-' + x.s : x.s, '')}
        ${optsHtml(q, o => `<span class="mname">${names[o]}</span>`, 'g2')}${fb}</section>`;
    }
    const P = PAR[q.pid];
    let lab, head, label, cls = 'g2', extra = '', ctx = '';
    if (k === 'no_cell' || k === 'pr_cell') {
      lab = t(k === 'no_cell' ? 'no.q.cell' : 'pr.q.cell');
      head = `<p class="np-w">${esc(P.name)}</p><p class="np-d">${P.dev}</p><p class="np-s">${cnFull(q.cs, q.nb)}</p>`;
      label = formLab(q); extra = ' oc';
      if (done) ctx = rowHtml(P, q.cs, q.nb);
    } else if (k === 'no_case' || k === 'pr_case') {
      lab = t(k === 'no_case' ? 'no.q.case' : 'pr.q.case');
      head = bigForm(P.txt(q.cs, q.nb), P.dv(q.cs, q.nb)) + `<p class="np-s">${esc(P.name)}</p>`;
      label = o => `<span class="mname">${comboLab(k, o)}</span>`; cls = 'lst';
      if (done) ctx = rowHtml(P, q.cs, q.nb);
    } else if (k === 'no_num') {
      lab = t(q.mode === 's2p' ? 'no.q.num.p' : 'no.q.num.d');
      head = bigForm(P.txt(q.cs, 0), P.dv(q.cs, 0)) + `<p class="np-s">${esc(P.name)} · ${cnFull(q.cs, 0)}</p>`;
      label = formLab(q); extra = ' oc';
      if (done) ctx = rowHtml(P, q.cs, q.tn);
    } else if (k === 'no_err') {
      lab = t('no.q.err');
      head = `<p class="np-s first">${esc(P.name)} · ${caseN(q.cs)} <span class="np-sk">(${CASE_SK[q.cs]})</span></p><p class="np-trio">${q.row.map((s, n) => `<span class="${done ? (n === q.answer ? 'bad' : '') : ''}"><i>${numN(n)}</i>${esc(s)}</span>`).join('')}</p>`;
      label = o => `<span class="mname">${numN(o)}</span>`; cls = 'g3';
      if (done) ctx = `<p class="note tight">${t('no.fb.err', { w: esc(q.rep), l: cnLab(q.c2, q.n2), c: esc(P.txt(q.cs, q.nb)), m: numN(q.nb) })}</p>`;
    } else if (k === 've_cell') {
      const p = Math.min(q.ps, 2);
      lab = t(q.mode === 'a' ? 've.q.cellA' : 've.q.cellB', { v: esc(P.name) });
      head = q.mode === 'a'
        ? `<p class="np-w">${esc(P.name)}</p><p class="np-d">${P.dev}</p><p class="np-s">${pnLab(p, q.nb)}</p>`
        : `<p class="np-w">${esc(pronV(q.pid, q.ps, q.nb))} <span class="si-gap">${done ? esc(q.answer) : '_____'}</span></p><p class="np-s">${esc(P.name)} <span class="np-sk">${P.dev}</span></p>`;
      label = formLab(q); extra = ' oc';
      if (done) ctx = `<p class="note tight">${pnLab(p, q.nb)}: <b>${esc(q.answer)}</b> <span class="dev-s">${esc(P.dv(p, q.nb))}</span></p>`;
    } else {   // ve_end
      lab = t('ve.q.end');
      head = bigForm(P.txt(q.ps, q.nb), P.dv(q.ps, q.nb)) + `<p class="np-s">${esc(P.name)}</p>`;
      label = o => `<span class="mname">${comboLab(k, o)}</span>`; cls = 'lst';
      if (done) { const V = verbOf(q.pid), f = V.f[q.ps][q.nb], h = V.hl[q.ps][q.nb]; ctx = `<p class="note tight">${esc(f.slice(0, f.length - h.length))}<b class="sf">${esc(h)}</b> · ${t('ve.sufOf', { s: esc(V.suf[q.ps][q.nb]) })}</p>`; }
    }
    const lbl = o => label(o);
    let fb = '';
    if (done) {
      const A = k === 'no_err' ? numN(q.answer) : (cls === 'lst' ? comboLab(k, q.answer) : esc(q.answer));
      const B = k === 'no_err' ? numN(q.opts[q.picked]) : (cls === 'lst' ? comboLab(k, q.opts[q.picked]) : esc(q.opts[q.picked]));
      fb = `${fbRow(right, q, A, B)}${ctx}${nextRow(ex)}`;
    }
    return `<section class="panel q"><p class="q-lab">${lab}</p>${head}${optsHtml(q, lbl, cls, extra)}${fb}</section>`;
  }

  // ---------- schermate ----------
  const SORDER = ['regole', 'esercizi'];
  function sandhiNav() {
    return modbar('s', [['regole', t('tab.rules')], ['esercizi', t('tab.exercises')]], S.stab, t('sa.title'), 'stab');
  }
  function viewSandhi() {
    return topbar(t('sa.title'), t('sa.sub'), 'moduli', t('tab.modules'), sandhiNav()) + (S.stab === 'regole' ? viewSandhiRegole() : viewSandhiEsercizi());
  }

  // spiegazione di ogni sūtra: la frase di traduzione del libro Hari-nāmāmṛta-vyākaraṇam (inglese) e la sua traduzione italiana fedele.
  // I termini tecnici del libro (-rāma, -dvaya, viṣṇupada, viṣṇucakra…) restano in sanscrito.
  const SUT_INFO = {
    42: ['When a daśāvatāra is followed by its ekātmaka, it joins with the ekātmaka and becomes trivikrama.', 'Quando a un daśāvatāra segue il suo ekātmaka, si unisce all’ekātmaka e diventa trivikrama.'],
    43: ['When a-dvaya is followed by i-dvaya, it joins with i-dvaya and becomes e.', 'Quando ad a-dvaya segue i-dvaya, si unisce a i-dvaya e diventa e.'],
    44: ['When a-dvaya is followed by u-dvaya, it joins with u-dvaya and becomes o.', 'Quando ad a-dvaya segue u-dvaya, si unisce a u-dvaya e diventa o.'],

  // formule che il libro dà solo a parole (nelle formule del Notion mancano): mostrate come testo
  const SUT_FORM = { 47: ['a-dvaya + ḷ-dvaya = al'], 53: ['ḷ-dvaya + sarveśvara → l'] };

  function viewSandhiRegole() {
    const left = c => c.A.join(' / ') + ' + ' + (c.mode === 'fuse' ? c.B.join(' / ') : t('sa.sarv'));
    const missing = SANDHI.ST.map(s => s.n).filter(n => !SANDHI.EX.some(x => x.s === n) && !SANDHI.CLS.some(c => c.s === n));
    // un solo elenco: per ogni sūtra testo, formula sempre visibile; toccando si aprono spiegazione ed esempi
    const row = s => {
      const open = !!S.sx[s.n];
      const forms = SANDHI.CLS.filter(c => c.s === s.n).map(c => `<span class="sa-fm">${esc(left(c))} <span class="sa-eq">${c.mode === 'fuse' ? '=' : '→'}</span> <b class="sa-v">${esc(c.r)}</b></span>`)
        .concat((SUT_FORM[s.n] || []).map(f => `<span class="sa-fm">${esc(f)}</span>`)).join('');
      const info = SUT_INFO[s.n], expl = info ? info[LANG === 'it' ? 1 : 0] : '';
      const exs = SANDHI.EX.filter(x => x.s === s.n && x.r && x.a !== 'madhu').slice(0, 4).map(x => `<li class="sa-eg">${esc(x.text)}</li>`).join('');
      return `<li class="sa-sx${open ? ' open' : ''}"><button type="button" class="sa-sb" data-act="sutx" data-n="${s.n}" aria-expanded="${open}">
          <span class="sa-n">${s.n}</span><span class="sa-t">${esc(s.t)}<span class="sa-od">${sdev(s.t)}</span>${forms ? `<span class="sa-fms">${forms}</span>` : ''}</span>${CHEV}</button>
        ${open ? `<div class="sa-bd">${expl ? `<p class="sa-ex">${esc(expl)}</p>` : `<p class="sa-ex muted">${t('sa.noexp')}</p>`}${exs ? `<ul class="sa-egs">${exs}</ul>` : ''}</div>` : ''}</li>`;
    };
    // le tre sezioni del libro (indice del capitolo): Sarveśvara-sandhi, Viṣṇujana-sandhi, Viṣṇusarga-sandhi
    const SEC = [[42, 60, 'sa.sec1'], [61, 78, 'sa.sec2'], [79, 83, 'sa.sec3']];
    const sut = SEC.map(([a, b, k]) => `<section class="sa-sec card" aria-label="${esc(t(k))}">
        <header class="sa-sh"><span class="sa-shn"><b>${t(k)}</b><span>${t(k + 'd')}</span></span><i>${a}–${b}</i></header>
        <ul class="sa-ul sa-sl">${SANDHI.ST.filter(x => x.n >= a && x.n <= b).map(row).join('')}</ul></section>`).join('');
    return `<p class="intro">${t('sa.intro')}</p>
      ${sut}
      <p class="note">${t('sa.fnote')}</p>
      <p class="note tight">${t('sa.snote', { l: missing.join(', ') })}</p>`;
  }
  function viewSandhiEsercizi() {
    return `<p class="intro">${t('ex.intro')}</p><div class="list">` +
      SANDHI_KINDS.map(id => {
        const p = progress[id];
        return `<button class="vrow ex-c" data-act="start" data-type="${id}">
          <span class="vt"><span class="ex-t">${kindName(id)}</span><span class="vd">${t('ex.' + id + 'D')}</span><span class="vp">${p ? t('ex.tried', { ok: p.ok, tot: p.tot }) : t('ex.notTried')}</span></span>${CHEV}</button>`;
      }).join('') + '</div>';
  }

  function viewSandhiQ(q, ex) {
    const done = q.picked !== null, right = done && q.opts[q.picked] === q.answer;
    const x = q.xi ? SANDHI.EB[q.xi] : null, c = q.kind === 'sa_res' ? SANDHI.CLS[q.ci] : null;
    const sn = c ? c.s : x.s;
    let lab, head, grid = false;
    if (q.kind === 'sa_res') {
      lab = t(c.mode === 'fuse' ? 'sa.q.fuse' : 'sa.q.sem');
      head = `<p class="sa-pair">${esc(q.ra)} + ${esc(q.rb)}</p><p class="sa-dev">${sdev(q.ra + ' + ' + q.rb)}</p>`;
      grid = true;
    } else if (q.kind === 'sa_sut') {
      lab = t('sa.q.sut'); head = `<p class="sa-pair">${esc(x.pair)}</p><p class="sa-dev">${sdev(x.pair)}</p>`;
    } else if (q.kind === 'sa_join') {
      lab = t('sa.q.join'); head = `<p class="sa-pair">${esc(x.pair)}</p><p class="sa-dev">${sdev(x.pair)}</p>`;
    } else if (q.kind === 'sa_split') {
      lab = t('sa.q.split'); head = `<p class="sa-pair">${esc(x.plain)}</p><p class="sa-dev">${sdev(x.plain)}</p>`;
    } else if (q.kind === 'sa_mat') {
      lab = t('sa.q.mat', { n: q.sn }); head = `<p class="sa-pair sm">${esc(SANDHI.SB[q.sn].t)}</p><p class="sa-dev">${sdev(SANDHI.SB[q.sn].t)}</p>`;
    } else {
      lab = t('sa.q.comp');
      head = `<p class="sa-pair">${esc(x.pair)}</p><p class="sa-dev">${sdev(x.pair)}</p><p class="sa-blank">${esc(x.pre)}<span class="sa-gap${done ? (right ? ' ok' : ' bad') : ''}">${done ? esc(x.v) : '&nbsp;&nbsp;&nbsp;'}</span>${esc(x.post)}</p>`;
      grid = true;
    }
    const label = o => (q.kind === 'sa_sut' ? t('sa.sutra', { n: o }) + ' · ' + SANDHI.SB[o].t : o);
    const opts = q.opts.map((o, i) => {
      let cls = 'opt' + (grid ? ' gopt' : '');
      if (done) { if (o === q.answer) cls += ' ok'; else if (i === q.picked) cls += ' bad'; }
      return `<button class="${cls}" data-act="opt" data-i="${i}"${done ? ' disabled' : ''}>${grid ? (q.kind === 'sa_res' ? `<span class="sa-o c"><span>${esc(label(o))}</span><span class="sa-od">${sdev(o)}</span></span>` : esc(label(o))) : (q.kind === 'sa_sut' ? `<span class="sa-o"><span class="mname">${esc(t('sa.sutra', { n: o }))}</span><span class="sa-s">${esc(SANDHI.SB[o].t)}</span><span class="sa-od">${sdev(SANDHI.SB[o].t)}</span></span>` : `<span class="sa-o"><span class="mname">${esc(o)}</span><span class="sa-od">${sdev(o)}</span></span>`)}</button>`;
    }).join('');
    let fb = '';
    if (done) {
      const eg = q.kind === 'sa_res'
        ? (c.mode === 'fuse' ? `${q.ra} + ${q.rb} → ${c.r}` : `${q.ra} + ${q.rb} → ${c.r} + ${q.rb}`)
        : x.r ? x.text : x.pair;
      fb = `<p class="res ${right ? 'ok' : 'bad'}" role="status">${right ? t('mq.right') : t('mq.wrong', { a: esc(label(q.answer)), b: esc(label(q.opts[q.picked])) })}</p>
        <p class="note tight"><span class="sa-eg">${esc(eg)}</span><span class="sa-od">${sdev(eg)}</span></p>
        <p class="note tight"><b>${t('sa.sutra', { n: sn })}</b> · <span class="sa-s">${esc(SANDHI.SB[sn].t)}</span><span class="sa-od">${sdev(SANDHI.SB[sn].t)}</span></p>
        ${nextRow(ex)}`;
    }
    return `<section class="panel q"><p class="q-lab">${esc(lab)}</p>${head}
      <div class="opts ${grid ? 'g2' : 'lst'}">${opts}</div>${fb}</section>`;
  }

  // ---------- Analisi sillabica: schede, domande e schermate ----------
  const slPick = (list, ex, tag) => {
    for (let k = 0; k < 40; k++) {
      const x = list[rnd(list.length)], key = tag + x.w + (x.si === undefined ? '' : ':' + x.si);
      if (!ex || !ex.used.has(key)) { if (ex) ex.used.add(key); return x; }
    }
    return list[rnd(list.length)];
  };
  function slItem(kind, ex) {
    if (kind === 'sl_tap' || kind === 'sl_div') return { kind, w: slPick(SYL.words.map(w => ({ w })), ex, kind).w };
    if (kind === 'sl_rule') {
      const r = SYL.RULES[rnd(SYL.RULES.length)], x = slPick(SYL.byRule[r], ex, kind);
      return x.end ? { kind, w: x.w, si: x.si, end: 1 } : { kind, w: x.w, si: x.si };
    }
    const list = rnd(2) === 0 ? SYL.byRule.laghu : SYL.byRule.R1.concat(SYL.byRule.R2, SYL.byRule.R3, SYL.byRule.R4);
    const x = slPick(list, ex, kind);
    return x.end ? { kind, w: x.w, si: x.si, end: 1 } : { kind, w: x.w, si: x.si };
  }
  const keyOfSl = it => it.kind + ':' + it.w + (it.si === undefined ? '' : ':' + it.si + (it.end ? 'e' : ''));
  function validSl(it) {
    if (typeof it.w !== 'string' || !SYL.WB[it.w]) return false;
    if (it.kind === 'sl_tap') return true;
    if (it.kind === 'sl_div') return SYL.cuts(it.w).ok;
    if (it.end && !SYL.END[it.w]) return false;
    const s = SYL.sylls(it.w, it.end ? 1 : 0);
    return Number.isInteger(it.si) && it.si >= 0 && it.si < s.length;
  }
  function buildSl(it, key, item) {
    const end = it.end ? 1 : 0, syls = SYL.sylls(it.w, end);
    const base = { kind: it.kind, key, item, w: it.w, end, syls, picked: null };
    if (it.kind === 'sl_lg') return Object.assign(base, { si: it.si, answer: syls[it.si].w, opts: ['L', 'G'] });
    if (it.kind === 'sl_rule') return Object.assign(base, { si: it.si, answer: SYL.ruleKey(syls[it.si]), opts: SYL.RULES.slice() });
    if (it.kind === 'sl_tap') return Object.assign(base, { sel: syls.map(() => false), checked: false });
    const c = SYL.cuts(it.w);
    return Object.assign(base, { tks: c.tks, want: c.want, cuts: {}, checked: false });
  }
  // domanda su una regola che sbagli spesso (punti deboli)
  function slWeak(rule, ks) {
    const list = SYL.byRule[rule], kinds = ['sl_rule', 'sl_lg'].filter(k => ks.includes(k));
    if (!list || !list.length || !kinds.length) return null;
    const x = list[rnd(list.length)], kind = kinds[rnd(kinds.length)];
    return buildQ(x.end ? { kind, w: x.w, si: x.si, end: 1 } : { kind, w: x.w, si: x.si });
  }
