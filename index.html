  // ---------- Cerca ----------
  // indice di tutto ciò che si studia: sūtra (con formule, spiegazioni ed esempi), metri e gaṇa, versi, vocabolario, nomi, pronomi, verbi.
  // Il confronto ignora accenti, maiuscole, spazi e trattini (krsna trova kṛṣṇa). Le forme segnate come punto aperto del Notion non entrano.
  const nz = x => String(x).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[\s\-’'ʼ]/g, '');
  let SIDX = null;
  // grafia all'inglese come ripiego: krishna → krsna, bhyaam → bhyam
  const alt = x => nz(x).replace(/sh/g, 's').replace(/ri/g, 'r').replace(/aa/g, 'a').replace(/ii/g, 'i').replace(/uu/g, 'u').replace(/w/g, 'v');
  const plain = html => { const d = document.createElement('div'); d.innerHTML = html; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
  // porta il modulo sulla scheda voluta: teoria (tabelle, regole) o esercizi
  function showMod(mod, ex) {
    S.screen = mod; S.verse = null; S.sheet = null; S.hl = null;
    if (mod === 'alfabeto') S.atab = ex ? 'esercizi' : 'tabelle';
    else if (mod === 'sillabe' || mod === 'sandhi') S.stab = ex ? 'esercizi' : 'regole';
    else if (mod === 'chanda') S.tab = ex ? 'esercizi' : 'metri';
    else S.mtab = ex ? 'esercizi' : 'teoria';
  }
  // etichetta di una forma: dove sta nella tabella (caso o persona, e numero)
  function cellsLabel(P, cells) {
    const rowName = P.mod === 'verbi' ? perN : (c => t('csa.' + c));
    return [0, 1, 2].map(n => ({ n, rows: cells.filter(x => x.n === n).map(x => rowName(x.c)) })).filter(g => g.rows.length)
      .map(g => g.rows.join(', ') + ' · ' + numN(g.n)).join(' / ');
  }
  function searchIndex() {
    if (SIDX) return SIDX;
    const ix = [];
    const add = (k, id, title, sub, hay, x) => ix.push({ k, id, title, sub, hay: nz(hay), x: x || '' });
    // moduli ed esercizi
    MODULES.filter(m => m.active).forEach(m => add('modulo', m.id, t('mod.' + m.id), nz(m.src) === nz(t('mod.' + m.id)) ? '' : m.src, t('mod.' + m.id) + ' ' + m.src + ' ' + m.id));
    const KINDS = { alfabeto: ALPHA_KINDS, sillabe: SYL_KINDS, sandhi: SANDHI_KINDS, chanda: CH_KINDS };
    NMODS.forEach(m => { KINDS[m] = NEWMOD[m]; });

      const nm = kindName(k); if (nm === 'kind.' + k) return;
      const d = t('ex.' + k + 'D'), dd = d === 'ex.' + k + 'D' ? '' : d;
      add('esercizio', k, nm, t('mod.' + m) + (dd ? ' · ' + dd : ''), nm + ' ' + t('mod.' + m) + ' ' + dd, m);
    }));
    // argomenti: le sezioni di teoria che l'app mostra già (titoli e testo sotto ogni titolo)
    [['alfabeto', viewAlfaTabelle, 1], ['sillabe', viewSillabeRegole, 1], ['nomi', viewTeoriaNomi, 0], ['pronomi', viewTeoriaPronomi, 0], ['verbi', viewTeoriaVerbi, 0], ['vocab', viewTeoriaVocab, 0]].forEach(([m, fn, full]) => {

      let mm;

    } catch (e) { /* senza sezioni di sandhi */ }
    SANDHI.ST.forEach(st => {
      const info = SUT_INFO[st.n] || ['', ''];
      const forms = SANDHI.CLS.filter(c => c.s === st.n).map(c => c.A.join(' ') + ' ' + c.B.join(' ') + ' ' + c.r).concat(SUT_FORM[st.n] || []).join(' ');
      const exs = SANDHI.EX.filter(x => x.s === st.n && x.a !== 'madhu').map(x => x.text).join(' ');
      add('sutra', st.n, st.n + ' · ' + st.t, (LANG === 'it' ? info[1] : info[0]), st.n + ' ' + st.t + ' ' + E.toDevanagari(st.t) + ' ' + info[0] + ' ' + info[1] + ' ' + forms + ' ' + exs);
    });
    add('metre', 'gana', 'Gaṇa · गण', t('met.ganaSub'), 'gana ' + E.GANA_ORDER.join(' ') + ' yamatarajabhanasalagam');
    E.METRES.forEach(m => add('metre', m.id, m.name + ' · ' + m.dev, t('met.sylls', { n: m.n }) + ' · ' + schemaOf(m), m.name + ' ' + m.dev + ' ' + m.lak.join(' ')));
    VERSES.forEach(v => add('verse', v.id, v.ref, v.lines[0], v.ref + ' ' + v.lines.join(' ') + ' ' + v.lines.map(l => E.toDevanagari(l)).join(' ')));
    VOCAB.forEach(w => add('vocab', w.i, w.i + ' · ' + w.d, w.m, w.i + ' ' + w.d + ' ' + w.m));
    // paradigmi (solo nome e classe) e, a parte, ogni forma delle tabelle con le sue caselle. Le forme segnate come punto aperto del Notion non entrano.
    NOUNS.forEach(n => add('nomi', n.id, n.name + ' · ' + n.dev, n.cls || '', n.name + ' ' + n.dev + ' ' + n.cls + ' ' + n.id));
    PRONS.forEach(p => add('pronomi', p.id, p.name + ' · ' + p.dev, '', p.name + ' ' + p.dev + ' ' + p.id));
    VERBS.forEach(v => add('verbi', v.id, v.name + ' · ' + v.dev, v.mean, v.name + ' ' + v.dev + ' ' + v.mean + ' ' + v.id));
    Object.keys(PAR).forEach(id => {
      const P = PAR[id], seen = {};
      for (let c = 0; c < P.nc; c++) for (let n = 0; n < 3; n++) {
        if (P.mod === 'nomi' && P.raw.t[c][n][2] === 'x') continue;
        const dv = P.dv(c, n);
        P.txt(c, n).split(/\s*\/\s*/).forEach(f => {
          if (!f) return;
          const key = nz(f);
          (seen[key] = seen[key] || { f, dv, cells: [] }).cells.push({ c, n });
        });
      }
      Object.keys(seen).forEach(key => {
        const o = seen[key];
        ix.push({ k: 'forma', id, title: o.f + (o.dv ? ' · ' + o.dv : ''), sub: P.name + ' — ' + cellsLabel(P, o.cells), hay: nz(o.f + ' ' + o.dv), pn: nz(P.name + ' ' + id), x: o.cells.map(x => x.c + '.' + x.n).join(';') });
      });
    });
    SIDX = ix;
    return ix;
  }
  // distanza di modifica minima tra la ricerca q e una qualunque parte della parola w (anche un pezzo solo)
  function editSub(q, w) {
    const m = q.length, n = w.length;
    let prev = new Array(n + 1).fill(0), cur = new Array(n + 1);
    for (let i = 1; i <= m; i++) {
      cur[0] = i;
      for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j - 1] + (q[i - 1] === w[j - 1] ? 0 : 1), prev[j] + 1, cur[j - 1] + 1);
      const tmp = prev; prev = cur; cur = tmp;
    }
    return Math.min.apply(null, prev);
  }
  const fuzzyMax = q => Math.min(3, Math.floor(q.length / 4));   // errori ammessi: 4–7 lettere 1, 8–11 lettere 2, 12 o più 3
  const wordsOf = e => e.w || (e.w = (e.title + ' ' + (e.k === 'forma' ? '' : e.sub || '')).split(/[\s·\/()\-–—,.;:’'ʼ]+/).map(nz).filter(x => x.length >= 2));
  // risultati più affini: ogni parola scritta deve somigliare a una parola della voce (errori e pezzi di parola compresi)
  function fuzzyHits(ix, raw) {
    const toks = raw.split(/\s+/).map(nz).filter(x => x.length >= 2);
    if (!toks.length || toks.some(x => fuzzyMax(x) < 1)) return [];
    const out = [];
    ix.forEach(e => {
      const ws = wordsOf(e); let tot = 0;
      for (const q of toks) {
        const k = fuzzyMax(q); let best = 99;
        for (const w of ws) { const d = editSub(q, w); if (d < best) best = d; if (best === 0) break; }
        if (best > k) return;
        tot += best;
      }
      out.push(Object.assign({}, e, { score: tot }));
    });
    return out.sort((x, y) => x.score - y.score).slice(0, 10);
  }
  function searchHits(ix, raw, nq, digits, lenient) {
    if (digits) return ix.filter(e => e.k === 'sutra' && String(e.id).startsWith(raw));
    if (/^sutras?$/.test(nq)) return ix.filter(e => e.k === 'sutra');
    const toks = raw.split(/\s+/).filter(Boolean), fx = lenient ? alt : nz;
    // un paradigma che si chiama proprio come la ricerca non elenca tutte le sue forme
    const named = {};
    Object.keys(PAR).forEach(id => { if (nq === nz(PAR[id].name) || nq === nz(id)) named[id] = true; });
    let out = ix.filter(e => e.hay.includes(nq) && !(e.k === 'forma' && named[e.id]));
    // due parole: nome del paradigma + forma o desinenza (krishna bhyam, vand te)
    if (toks.length >= 2) {
      const a = fx(toks[0]), b = fx(toks.slice(1).join(''));
      const pair = ix.filter(e => e.k === 'forma' && e.pn.includes(a) && e.hay.includes(b));
      out = pair.concat(out.filter(e => pair.indexOf(e) < 0));
    }
    return out;
  }
  function searchResults(q) {
    const raw0 = String(q || '').trim(), n = nz(raw0);
    // «sutra 44», «sūtra n. 44», «sutra44» o solo «44»: il sūtra con quel numero
    const sm = /^(?:sutras?|sut)[n.:#]*(\d+)$/.exec(n);
    const raw = sm ? sm[1] : raw0;
    if (!n || (n.length < 2 && !/[^\u0000-ɏ]/.test(n) && !sm)) return `<p class="note c">${t('q.hint')}</p>`;
    const digits = /^\d+$/.test(raw), ix = searchIndex();
    let nq = sm ? raw : n, hit = searchHits(ix, raw, nq, digits, false), said = '', fuzzy = false;
    if (!hit.length && !digits) {
      const a = alt(raw);
      if (a !== n && a.length >= 2) { nq = a; hit = searchHits(ix, raw, nq, false, true); said = a; }
    }
    if (!hit.length && !digits) { hit = fuzzyHits(ix, raw); fuzzy = hit.length > 0; said = ''; nq = n; }
    if (!hit.length) return `<p class="note c">${t('q.none')}</p>`;
    const rank = e => (fuzzy ? e.score : digits ? (String(e.id) === raw ? 0 : 1) : e.hay === nq ? 0 : e.hay.startsWith(nq) ? 1 : nz(e.title).includes(nq) ? 2 : 3);
    const groups = [['modulo', t('q.g.mod')], ['esercizio', t('q.g.ex')], ['sezione', t('q.g.sec')], ['sutra', t('q.g.sutra')], ['metre', t('q.g.metre')], ['verse', t('q.g.verse')], ['vocab', t('mod.vocab')], ['forma', t('q.g.form')], ['nomi', t('mod.nomi')], ['pronomi', t('mod.pronomi')], ['verbi', t('mod.verbi')]];
    const blocks = groups.map(([k, label], gi) => {
      const rs = hit.filter(e => e.k === k).sort((x, y) => rank(x) - rank(y) || (digits ? Number(x.id) - Number(y.id) : 0));
      if (!rs.length) return null;
      const cap = k === 'forma' ? 8 : 6;
      const rows = rs.slice(0, cap).map(e => `<button class="vrow" data-act="searchgo" data-k="${e.k}" data-id="${esc(String(e.id))}" data-x="${esc(e.x || '')}"><span class="vt"><span class="ex-t">${esc(e.title)}</span>${e.sub ? `<span class="vd q-sub">${esc(e.sub)}</span>` : ''}</span>${CHEV}</button>`).join('');
      return { r: rank(rs[0]), gi, html: `<h2 class="h2">${label}</h2><div class="list">${rows}</div>${rs.length > cap ? `<p class="note">${t('q.more', { n: rs.length - cap })}</p>` : ''}` };
    }).filter(Boolean).sort((x, y) => x.r - y.r || x.gi - y.gi);
    const note = fuzzy ? `<p class="note c">${t('q.fuzzy', { q: esc(raw0) })}</p>` : said ? `<p class="note c">${t('q.lenient', { q: esc(said) })}</p>` : '';
    return note + blocks.map(b => b.html).join('');
  }
  function viewCerca() {

  // ---------- azioni ----------
  const goTo = (to, dir) => { S.screen = to; S.verse = null; S.sheet = null; S.hl = null; S.dir = dir || 0; draw(true); };

    searchgo(d) {

    goal(d) { store.goal = Math.max(GOAL_MIN, Math.min(GOAL_MAX, store.goal + (+d.d))); save(); draw(false); },

    'ex-exit'() {

      if (S.ex && S.ex.mod === 'alfabeto') { S.screen = 'alfabeto'; S.atab = 'esercizi'; }
      else if (S.ex && S.ex.mod === 'sandhi') { S.screen = 'sandhi'; S.stab = 'esercizi'; }
      else if (S.ex && NMODS.includes(S.ex.mod)) { S.screen = S.ex.mod; S.mtab = 'esercizi'; }
      else if (S.ex && S.ex.mod === 'sillabe') { S.screen = 'sillabe'; S.stab = 'esercizi'; }

    },
    'ex-exit-verse'() { S.screen = 'chanda'; S.tab = 'versi'; S.verse = S.ex.vid; S.vm = verseById(S.ex.vid).metre; S.scan = false; S.dir = -1; draw(true); },
    'ex-exit-test'() { goTo('test', -1); },
    tap(d, b) {
      const q = S.ex.q, i = +d.i;
      q.guess[i] = q.guess[i] === '' ? 'L' : q.guess[i] === 'L' ? 'G' : '';
      b.querySelector('.mkbox').innerHTML = mk(q.guess[i]);
      b.setAttribute('aria-label', q.syls[i].t + ': ' + W(q.guess[i]));
      const c = document.getElementById('cnt');

    },
    hint() { S.ex.q.hint = true; draw(false); },
    check() {
      const q = S.ex.q, idx = needIdx(q);
      if (!idx.every(k => q.guess[k])) return;
      q.checked = true;
      const bad = idx.filter(k => q.guess[k] !== q.syls[k].w).map(k => q.syls[k]);
      const all = bad.length === 0;
      if (all) { S.ex.score++; noteRight(q); }
      else noteWrong(q, Array.from(new Set(bad.map(weakRule))));
      addResult(q.kind, all); S.ex.log.push({ kind: q.kind, ok: all });
      draw(false);
    },
    spotpick(d) {
      const q = S.ex.q;
      if (q.picked !== null) return;
      q.picked = +d.i;
      const right = q.picked === q.flip;
      if (right) { S.ex.score++; noteRight(q); }
      else noteWrong(q, [weakRule(q.syls[q.flip])]);
      addResult('spot', right); S.ex.log.push({ kind: 'spot', ok: right });
      draw(false);
    },
    opt(d) {
      const q = S.ex.q;
      if (q.picked !== null) return;
      q.picked = +d.i;
      const right = q.opts[q.picked] === q.answer;
      if (right) { S.ex.score++; noteRight(q); }
      else {
        let wk;
        if (q.kind === 'yati') wk = 'yati:' + verseById(q.vid).metre;
        else if (q.kind === 'metre' || q.kind === 'schema') wk = 'metre:' + q.answer + '>' + q.opts[q.picked];
        else if (q.kind === 'letter') wk = 'letter:' + q.answer;
        else if (q.kind === 'varga') wk = 'varga:' + q.answer;
        else if (q.kind === 'hari') wk = 'hname:' + ALPHA.nameOf(q.letter);
        else if (q.kind === 'odd') wk = 'varga:' + ALPHA.L[q.answer].grp;
        else if (q.kind === 'sl_lg' || q.kind === 'sl_rule') wk = weakRule(q.syls[q.si]);
        else if (SANDHI_KINDS.includes(q.kind)) wk = 'sutra:' + (q.kind === 'sa_res' ? SANDHI.CLS[q.ci].s : SANDHI.EB[q.xi].s);

    },
    gcell(d) {
      const q = S.ex.q; if (q.checked) return;

    gchip(d) {
      const q = S.ex.q; if (q.checked) return;

    gcheck() {

    sltap(d, b) {

    slcut(d, b) {
      const q = S.ex.q; if (q.checked) return;

    slcheck() {

      if (q.kind === 'sl_tap') {

        all = bad.length === 0;
        wk = Array.from(new Set(bad.map(s => (s.w === 'G' ? 'rule:' + (s.r || 'R1') : 'rule:laghu'))));
      } else {

    next() { nextQ(); S.dir = 1; draw(true); },
    'code-copy'() {
      S.code = makeCode(); S.restore = false;
      const done = ok => { S.codeMsg = { ok, t: t(ok ? 'code.copied' : 'code.manual') }; draw(false); };

    },

    reset() {
      if (!S.rst) { S.rst = true; clearTimeout(S.rt); S.rt = setTimeout(() => { S.rst = false; if (S.screen === 'settings') draw(false); }, 4000); draw(false); return; }
      S.rst = false; S.code = null; S.codeMsg = null; S.restore = false; const g = store.goal, ep = (store.epoch || 0) + 1; progress = {}; store = freshStore(); store.goal = g; store.epoch = ep; save(); queuePush(true); draw(false);
    }

  // ---------- azioni dei moduli aggiunti nella 1.1.2 ----------
  Object.assign(ACT, {

    tchip(d) {

      let i = q.sel;

  let noClickUntil = 0;
  app.addEventListener('click', e => {
    if (Date.now() < noClickUntil) return;   // il rilascio di un trascinamento non vale come tocco
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const fn = ACT[b.dataset.act];

  // ---------- movimenti ----------
  // 1) trascinare il dito sulla barra in basso o sul controllo segmentato: l'indicatore segue il dito,
  //    al rilascio si passa alla voce più vicina
  let scr = null;
  const syncOn = (el, k) => el.querySelectorAll('[data-act]').forEach((b, j) => { b.classList.toggle('on', j === k); if (b.hasAttribute('aria-selected')) b.setAttribute('aria-selected', String(j === k)); });
  function scrubPos(el, x) {
    const n = +el.dataset.n, r = el.getBoundingClientRect();
    const p = parseFloat(getComputedStyle(el).getPropertyValue('--pad')) || 5;
    const w = (r.width - 2 * p - (n - 1) * 2) / n;
    return Math.max(0, Math.min(n - 1, (x - r.left - p - w / 2) / (w + 2)));
  }
  app.addEventListener('pointerdown', e => {
    const el = e.target.closest('[data-scrub]');
    if (!el || (e.pointerType === 'mouse' && e.button !== 0)) return;
    scr = { el, x0: e.clientX, pid: e.pointerId, moved: false, f: +el.dataset.i };
  });
  document.addEventListener('pointermove', e => {
    if (!scr || e.pointerId !== scr.pid) return;
    if (!scr.moved) {
      if (Math.abs(e.clientX - scr.x0) < 10) return;
      scr.moved = true; scr.el.classList.add('drag');
      try { scr.el.setPointerCapture(e.pointerId); } catch (err) { /* ok */ }
    }
    scr.f = scrubPos(scr.el, e.clientX);
    scr.el.style.setProperty('--i', scr.f.toFixed(3));
    syncOn(scr.el, Math.round(scr.f));
  });
  function endScrub(e, cancel) {
    if (!scr || e.pointerId !== scr.pid) return;
    const s = scr; scr = null;
    if (!s.moved) return;
    s.el.classList.remove('drag');
    noClickUntil = Date.now() + 120;
    const cur = +s.el.dataset.i, k = cancel ? cur : Math.round(s.f);
    const btn = s.el.querySelectorAll('[data-act]')[k];
    if (k === cur || !btn) { s.el.style.setProperty('--i', cur); syncOn(s.el, cur); return; }
    S.tp[s.el.dataset.scrub] = s.f;       // la nuova barra parte da dove si è lasciato l'indicatore
    ACT[btn.dataset.act](btn.dataset, btn, e);
  }
  document.addEventListener('pointerup', e => endScrub(e, false));
  document.addEventListener('pointercancel', e => endScrub(e, true));

  // 2) scorrere la pagina da un lato all'altro: scheda successiva o precedente; verso destra = indietro
  function swipe(dir) {   // dir +1: dito verso sinistra (avanti), -1: dito verso destra (indietro)
    if (S.sheet) return;
    const sc = S.screen;
    if (sc === 'home' || sc === 'moduli' || sc === 'test' || sc === 'cerca' || sc === 'settings') {
      const i = GORDER.indexOf(sc) + dir;
      if (i >= 0 && i < GORDER.length) ACT.go({ to: GORDER[i] });
    } else if (sc === 'alfabeto') {
      const i = AORDER.indexOf(S.atab) + dir;
      if (i >= 0 && i < AORDER.length) ACT.atab({ t: AORDER[i] });
      else if (dir < 0) ACT.moduli();
    } else if (NMODS.includes(sc)) {
      const i = MTORDER.indexOf(S.mtab) + dir;
      if (i >= 0 && i < MTORDER.length) ACT.mtab({ t: MTORDER[i] });
      else if (dir < 0) ACT.moduli();
    } else if (sc === 'sandhi' || sc === 'sillabe') {
      const i = SORDER.indexOf(S.stab) + dir;
      if (i >= 0 && i < SORDER.length) ACT.stab({ t: SORDER[i] });
      else if (dir < 0) ACT.moduli();
    } else if (sc === 'chanda') {
      if (S.tab === 'versi') { if (dir < 0) { if (S.verse) ACT['close-verse'](); else ACT['close-versi'](); } return; }
      const i = CORDER.indexOf(S.tab) + dir;
      if (i >= 0 && i < CORDER.length) ACT.tab({ t: CORDER[i] });
      else if (dir < 0) ACT.moduli();
    } else if (dir < 0) {
      if (sc === 'progress') ACT.home();
      else if (sc === 'info') ACT.settings();
    }
  }
  let tch = null;
  // sui paradigmi (Nomi, Pronomi, Verbi) lo swipe sulla tabella cambia la voce: kṛṣṇa → rādhā → hari…
  function pswipe(mod, dir) {
    const ids = parIds(mod), i = ids.indexOf(S.nsel[mod]) + dir;
    if (i < 0 || i >= ids.length) return;
    ACT.nsel({ mod, id: ids[i] });
    const c = app.querySelector('[data-pswipe]');
    if (c) c.classList.add(dir > 0 ? 'ps-f' : 'ps-b');
  }
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { tch = null; return; }
    const ps = e.target.closest('[data-pswipe]');
    if (ps && !S.sheet && !e.target.closest('[data-scrub], .codebox, .sheet-bg')) { tch = { x: e.touches[0].clientX, y: e.touches[0].clientY, p: ps.dataset.pswipe }; return; }
    if (e.target.closest('[data-scrub], .code, .codebox, .tbl, .sheet-bg, .plot, .pada, input')) { tch = null; return; }
    tch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!tch) return;
    const c = e.changedTouches[0], dx = c.clientX - tch.x, dy = c.clientY - tch.y, pm = tch.p;
    tch = null;
    if (pm) { if (Math.abs(dx) >= 50 && Math.abs(dx) >= Math.abs(dy) * 1.4) pswipe(pm, dx < 0 ? 1 : -1); return; }
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    swipe(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener('touchcancel', () => { tch = null; }, { passive: true });

  // ---------- tempo di studio: conta solo con un esercizio aperto, la pagina visibile e un tocco negli ultimi 30 secondi ----------
  let lastAct = Date.now(), ticks = 0;
  ['pointerdown', 'click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
  function tick() {
    if (S.screen !== 'ex' || !S.ex || S.ex.done || document.hidden) return;
    if (Date.now() - lastAct > 30000) return;
    dayRec(today(), true).sec++;
    if (++ticks % 10 === 0) save();
  }
  setInterval(tick, 1000);
  setInterval(() => { const el = document.getElementById('extimer'); if (el && S.screen === 'ex' && S.ex && !S.ex.done && !document.hidden) el.textContent = exClock(S.ex); }, 500);

  // ---------- barre che si nascondono scorrendo ----------
  (function () {
    const root = document.documentElement; let last = window.scrollY, acc = 0, timer = null;
    const HIDE_DELAY = 900;   // millisecondi di attesa, mentre si scorre verso il basso, prima che le barre spariscano
    const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
    window.addEventListener('scroll', () => {
      const y = Math.max(0, window.scrollY), d = y - last; last = y;
      if (y < 40) { acc = 0; cancel(); root.classList.remove('bars-off'); return; }
      if (Math.sign(d) !== Math.sign(acc)) acc = 0;
      acc += d;
      if (acc > 14) {
        if (!timer && !root.classList.contains('bars-off')) timer = setTimeout(() => { timer = null; if (window.scrollY >= 40) root.classList.add('bars-off'); }, HIDE_DELAY);
      } else if (acc < -8) { cancel(); root.classList.remove('bars-off'); }
    }, { passive: true });
    window.__barsReset = () => { cancel(); root.classList.remove('bars-off'); last = window.scrollY; acc = 0; };
  })();
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); queuePush(true); } });
  window.addEventListener('pagehide', () => { save(); queuePush(true); });
  if (window.__VR_TEST__) window.__vr = { tick, shift(n) { dayShift += n; draw(false); }, api: { S, ACT, store: () => store, progress: () => progress, buildQ, randItem, validItem, keyOf, cleanItem, newEx, wordInfo, siPools, divVariants, divParts, divStr, PAR, PADA, NEWK, NEWMOD, buildDaily, startDaily, weakQ, okWeakKey, weakText, makeCode, readCode, applyCode, EXK, MOD_KINDS, view, draw, E } };

  // ---------- aggiornamenti: trascina verso il basso nella Home ----------
  // L'app vive già sul dispositivo e funziona senza rete. La ricerca parte solo dal gesto e non blocca mai:
  // 1) legge solo l'inizio della pagina per trovare l'ID versione (pochi KB);
  // 2) se entro SOFT_MS non ha una risposta, la schermata si libera e il lavoro continua in background;
  // 3) se c'è una versione nuova la scarica (cache ricaricata) e propone "Aggiorna", senza ricaricare da sola.
  const Upd = (function () {
    const SOFT_MS = 1800, HARD_MS = 45000, PEEK_MAX = 16384, THRESH = 60, MAXPULL = 96;
    const PAGE = location.protocol.indexOf('http') === 0 ? location.href.split('#')[0] : null;
    // nel visualizzatore dell'artefatto l'indirizzo della pagina contiene il numero della versione (…/_f/<versione>/):
    // rileggerlo darebbe sempre la stessa versione, quindi lì il controllo non può funzionare
    const FRAMED = /\.frame\.claudeusercontent\.com$/i.test(location.hostname);
    // con il service worker (modalità offline) la pagina normale arriva dalla copia salvata: il controllo usa un indirizzo con ?u=,
    // che il service worker lascia passare sempre alla rete
    const fresh = () => { const u = new URL(PAGE); u.searchParams.set('u', Date.now()); return u.href; };
    // dopo il download la nuova pagina sostituisce quella salvata, così «Aggiorna» ricarica davvero la versione nuova
    async function keep(html) {
      try {
        if (!window.caches || html.indexOf('</html>') < 0) return;
        const urls = [new URL('./', PAGE).href, new URL('index.html', PAGE).href];
        for (const k of await caches.keys()) {
          if (k.indexOf('vyakaranam-') !== 0) continue;
          const c = await caches.open(k);
          for (const u of urls) await c.put(u, new Response(html, { headers: { 'Content-Type': 'text/html; charset=utf-8' } }));
        }
      } catch (e) {}
    }
    const BUILD = Number(window.VR_N) || 0;
    const RE = /VR_N\s*=\s*(\d+)/;
    const P = d => '<svg class="pi" viewBox="0 0 24 24" aria-hidden="true">' + d + '</svg>';
    const IC = {
      arrow: P('<path d="M12 5v13M6 13l6 6 6-6"/>'),
      spin: '<svg class="pi spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>',
      ok: P('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
      info: P('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>')
    };
    const el = document.createElement('div');
    el.className = 'ptr'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');
    document.body.appendChild(el);
    let busy = false, ready = null, hideT = 0, t0 = null, pull = 0, shown = false, armed = null;

    function place(y, o, snap) {
      el.classList.toggle('snap', !!snap);
      el.style.transform = 'translate(-50%, ' + y + 'px)';
      el.style.opacity = o;
    }
    function open(icon, text, btn) {
      clearTimeout(hideT);
      el.innerHTML = icon + '<span>' + esc(text) + '</span>' + (btn ? '<button class="ptr-b" type="button">' + esc(btn) + '</button>' : '');
      el.classList.toggle('act', !!btn);
      place(0, 1, true); shown = true;
    }
    function close(delay) {
      clearTimeout(hideT);
      hideT = setTimeout(() => {
        if (ready && S.screen === 'home') { showReady(); return; }
        place(-70, 0, true); el.classList.remove('act'); shown = false;
      }, delay || 0);
    }
    function showReady() { open(IC.ok, t('upd.ready'), t('upd.apply')); }
    function apply() { save(); location.reload(); }
    el.addEventListener('click', e => { if (e.target.closest('.ptr-b')) apply(); });

    // legge solo l'inizio della pagina finché compare l'ID versione
    async function peekBuild(signal) {
      const res = await fetch(fresh(), { cache: 'no-store', signal });
      if (!res.ok) throw new Error('http ' + res.status);
      let txt = '';
      if (res.body && res.body.getReader) {
        const rd = res.body.getReader(), dec = new TextDecoder();
        let n = 0;
        for (;;) {
          const r = await rd.read();
          if (r.done) break;
          n += r.value.length; txt += dec.decode(r.value, { stream: true });
          const m = RE.exec(txt);
          if (m) { rd.cancel().catch(() => {}); return Number(m[1]); }
          if (n > PEEK_MAX) { rd.cancel().catch(() => {}); break; }
        }
      } else {
        txt = await res.text();
        const m = RE.exec(txt); if (m) return Number(m[1]);
      }
      throw new Error('no build');
    }
    // scarica la pagina intera aggiornando la cache del browser, così la prossima apertura è già pronta
    async function download(signal) {
      const res = await fetch(fresh(), { cache: 'reload', signal });
      if (!res.ok) throw new Error('http ' + res.status);
      const txt = await res.text();
      const m = RE.exec(txt);
      if (!m) throw new Error('no build');
      await keep(txt);
      return Number(m[1]);
    }

    async function run() {
      if (busy) return;
      if (ready) { showReady(); return; }
      if (!PAGE) { open(IC.info, t('upd.unavail')); close(2200); return; }
      if (FRAMED) { open(IC.info, t('upd.framed')); close(3200); return; }
      if (navigator.onLine === false) { open(IC.info, t('upd.offline')); close(2400); return; }
      busy = true;
      open(IC.spin, t('upd.checking'));
      const c = navigator.connection || {};
      const weak = !!c.saveData || /^(slow-)?2g$/.test(c.effectiveType || '');
      const ctrl = new AbortController();
      const hard = setTimeout(() => ctrl.abort(), HARD_MS);
      let detached = false;
      const job = (async () => {
        const b = await peekBuild(ctrl.signal);
        if (!(b > BUILD)) return { newer: false };
        if (!detached) open(IC.spin, t('upd.fetching'));
        return { newer: true, build: await download(ctrl.signal) };
      })();
      const settle = (v, bg) => {
        if (v.newer) { ready = v.build; if (S.screen === 'home') showReady(); return; }
        if (S.screen === 'home') { open(IC.ok, t('upd.uptodate')); close(1800); }
      };
      const fail = () => {
        if (S.screen !== 'home') return;
        if (navigator.onLine === false) open(IC.info, t('upd.offline'));
        else open(IC.info, t('upd.fail'));
        close(2400);
      };
      const first = await Promise.race([
        job.then(v => ({ v }), e => ({ e })),
        new Promise(r => setTimeout(r, weak ? 0 : SOFT_MS, 'soft'))
      ]);
      if (first === 'soft') {
        // connessione debole: libera la schermata e continua senza bloccare
        detached = true;
        open(IC.info, t('upd.slow'));
        close(2400);
        job.then(v => settle(v, true), fail).finally(() => { clearTimeout(hard); busy = false; });
        return;
      }
      clearTimeout(hard); busy = false;
      if (first.e) fail(); else settle(first.v);
    }

    // ---- gesto ----
    document.addEventListener('touchstart', e => {
      t0 = null;
      if (S.screen !== 'home' || S.sheet || busy || e.touches.length !== 1 || window.scrollY > 0 || e.target.closest('[data-scrub]')) return;
      t0 = { y: e.touches[0].clientY, x: e.touches[0].clientX, dir: null };
      pull = 0; armed = null;
    }, { passive: true });
    document.addEventListener('touchmove', e => {
      if (!t0) return;
      const dy = e.touches[0].clientY - t0.y, dx = e.touches[0].clientX - t0.x;
      if (t0.dir === null) {
        if (Math.abs(dy) < 6 && Math.abs(dx) < 6) return;
        t0.dir = dy > 0 && Math.abs(dy) > Math.abs(dx) && window.scrollY <= 0 ? 'v' : 'x';
      }
      if (t0.dir !== 'v') { t0 = null; return; }
      if (e.cancelable) e.preventDefault();
      pull = Math.min(MAXPULL, Math.max(0, dy) * 0.55);
      const isArmed = pull >= THRESH;
      if (!shown || isArmed !== armed) {
        clearTimeout(hideT);
        el.innerHTML = '<svg class="pi' + (isArmed ? ' up' : '') + '" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6 13l6 6 6-6"/></svg><span>' +
          esc(isArmed ? t('upd.release') : t('upd.pull')) + '</span>';
        el.classList.remove('act'); armed = isArmed; shown = true;
      }
      place(Math.min(-60 + pull, 14), Math.min(1, pull / 36), false);
    }, { passive: false });
    function end() {
      if (!t0) return;
      const was = t0.dir === 'v', p = pull;
      t0 = null; pull = 0; armed = null;
      if (!was) return;
      if (p >= THRESH) run(); else { shown = false; close(0); }
    }
    document.addEventListener('touchend', end, { passive: true });
    document.addEventListener('touchcancel', end, { passive: true });

    return {
      // chiamata a ogni ridisegno: fuori dalla Home la pillola sparisce, tornando in Home riappare se c'è un aggiornamento pronto
      sync() {
        if (S.screen !== 'home') { clearTimeout(hideT); place(-70, 0, false); el.classList.remove('act'); shown = false; return; }
        if (ready && !busy && !t0) showReady();
      },
      run, build: BUILD
    };
  })();
  if (window.__VR_TEST__) window.__vr.upd = Upd;

  if (window.__VR_TEST__) window.__vr.upd = Upd;

  draw(true);
  cloudInit();
})();

</script>
<script>
/* Modalità offline: il service worker salva l'app sul dispositivo. Solo su GitHub Pages (non nella cornice di Claude);
   non ricarica mai da solo la pagina, per non interrompere un esercizio. */
(function () {
  try {
    if (!('serviceWorker' in navigator) || location.protocol.indexOf('http') !== 0) return;
    if (window.top !== window.self || /\.frame\.claudeusercontent\.com$/i.test(location.hostname)) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.update().catch(function () {});
        document.addEventListener('visibilitychange', function () { if (!document.hidden) reg.update().catch(function () {}); });
      }).catch(function () {});
    });
  } catch (e) {}
})();
</script>
