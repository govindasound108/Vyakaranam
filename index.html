<style>
/* Layout: colonna da telefono nello stile di Kārtika, aggiornata alle linee guida Liquid Glass di iOS 27.
   Il vetro sta sullo strato dei comandi (pulsante Indietro, barra delle schede, fogli) e sui menu di navigazione (home, elenchi).
   Le pagine di studio (verso, scansione, domande) stanno su fondo quasi bianco, senza vetro dietro al testo.
   Tre elementi presi da iOS 27: bordo più definito con luce in alto, velo sfumato sotto i comandi quando il testo scorre,
   adattamento a "Riduci trasparenza" e "Aumenta contrasto". Accento ambra con etichetta scura sui pulsanti pieni. */
:root {
  --ground: #FDFAF3; --halo1: rgba(238, 168, 88, .13); --halo2: rgba(232, 198, 135, .22); --bgtop: rgba(255, 255, 255, .9);
  --ink: #1F2A5C; --soft: #3D466F;
  --accent: #A8620A; --accent-fill: #E8A33D; --on-accent: #1F2A5C;
  --paper: rgba(255, 255, 255, .8); --cell: rgba(255, 255, 255, .94); --row: rgba(255, 255, 255, .5); --fill: rgba(31, 42, 92, .06);
  --sel-bg: rgba(232, 163, 61, .22); --sel-ink: #7A4505;
  --hair: rgba(31, 42, 92, .14); --mark: #C98A12;
  --ti-glow: rgba(255, 244, 214, .96); --ti-sh: rgba(255, 249, 232, .9); --ti-a: #8A5A0C; --ti-b: #C08418;
  --lq-a: rgba(255, 255, 255, .82); --lq-b: rgba(255, 255, 255, .26); --lq-c: rgba(255, 255, 255, .62);
  --lq-sel-a: rgba(255, 255, 255, 1); --lq-sel-b: rgba(255, 255, 255, .62); --lq-in: rgba(255, 255, 255, .95);
  --gl-edge: inset 0 1.5px 0 rgba(255, 255, 255, 1), inset 0 0 0 1px rgba(255, 255, 255, .55), inset 0 -10px 16px -12px rgba(255, 255, 255, .7);
  --gl-ring: 0 0 0 1px rgba(31, 42, 92, .09);
  --bar-edge: inset 0 1px 0 rgba(255, 255, 255, .95), inset 0 0 0 1px rgba(255, 255, 255, .42), inset 0 -9px 14px -12px rgba(255, 255, 255, .38);
  --gl-sh: 0 10px 28px -14px rgba(60, 45, 20, .24);
  --good: #2A7448; --good-soft: rgba(48, 150, 92, .16); --bad: #A83A26; --bad-soft: rgba(200, 70, 45, .14);
  --t-r: #B9412C; --t-o: #D2802A; --t-y: #CFA21A;
  --f-dev: 'Noto Serif Devanagari', 'FreeSerif', 'Noto Sans Devanagari', 'Kohinoor Devanagari', serif;
  --f-serif: 'Noto Serif', Georgia, 'Liberation Serif', serif;
  --f-ui: 'Noto Sans', -apple-system, 'Helvetica Neue', Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1C1C1E; --halo1: rgba(0, 0, 0, 0); --halo2: rgba(0, 0, 0, 0); --bgtop: rgba(255, 255, 255, .08);
    --ink: #F5F5F7; --soft: #AEAEB2; --accent: #F0B24B; --accent-fill: #F0B24B; --on-accent: #1C1C1E;
    --paper: rgba(44, 44, 46, .78); --cell: rgba(58, 58, 60, .92); --row: rgba(58, 58, 60, .55); --fill: rgba(120, 120, 128, .26);
    --sel-bg: rgba(240, 178, 75, .2); --sel-ink: #F6C877;
    --hair: rgba(98, 98, 102, .6); --mark: #F0B24B;
    --ti-glow: rgba(240, 178, 75, .22); --ti-sh: rgba(0, 0, 0, .9); --ti-a: #F8DFA0; --ti-b: #EDB04A;
    --lq-a: rgba(98, 98, 102, .5); --lq-b: rgba(60, 60, 64, .22); --lq-c: rgba(80, 80, 84, .4);
    --lq-sel-a: rgba(130, 130, 136, .65); --lq-sel-b: rgba(90, 90, 96, .4); --lq-in: rgba(110, 110, 116, .7);
    --gl-edge: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 0 0 1px rgba(255, 255, 255, .07);
    --gl-ring: 0 0 0 1px rgba(0, 0, 0, .5);
    --bar-edge: inset 0 1px 0 rgba(255, 255, 255, .24), inset 0 0 0 1px rgba(255, 255, 255, .08);
    --gl-sh: 0 12px 32px -14px rgba(0, 0, 0, .7);
    --good: #32D74B; --good-soft: rgba(50, 215, 75, .16); --bad: #FF6B63; --bad-soft: rgba(255, 107, 99, .16);
    --t-r: #FF6B63; --t-o: #FF9F0A; --t-y: #FFD60A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #1C1C1E; --halo1: rgba(0, 0, 0, 0); --halo2: rgba(0, 0, 0, 0); --bgtop: rgba(255, 255, 255, .08);
  --ink: #F5F5F7; --soft: #AEAEB2; --accent: #F0B24B; --accent-fill: #F0B24B; --on-accent: #1C1C1E;
  --paper: rgba(44, 44, 46, .78); --cell: rgba(58, 58, 60, .92); --row: rgba(58, 58, 60, .55); --fill: rgba(120, 120, 128, .26);
  --sel-bg: rgba(240, 178, 75, .2); --sel-ink: #F6C877;
  --hair: rgba(98, 98, 102, .6); --mark: #F0B24B;
  --ti-glow: rgba(240, 178, 75, .22); --ti-sh: rgba(0, 0, 0, .9); --ti-a: #F8DFA0; --ti-b: #EDB04A;
  --lq-a: rgba(98, 98, 102, .5); --lq-b: rgba(60, 60, 64, .22); --lq-c: rgba(80, 80, 84, .4);
  --lq-sel-a: rgba(130, 130, 136, .65); --lq-sel-b: rgba(90, 90, 96, .4); --lq-in: rgba(110, 110, 116, .7);
  --gl-edge: inset 0 1px 0 rgba(255, 255, 255, .22), inset 0 0 0 1px rgba(255, 255, 255, .07);
  --gl-ring: 0 0 0 1px rgba(0, 0, 0, .5);
  --bar-edge: inset 0 1px 0 rgba(255, 255, 255, .24), inset 0 0 0 1px rgba(255, 255, 255, .08);
  --gl-sh: 0 12px 32px -14px rgba(0, 0, 0, .7);
  --good: #32D74B; --good-soft: rgba(50, 215, 75, .16); --bad: #FF6B63; --bad-soft: rgba(255, 107, 99, .16);
  --t-r: #FF6B63; --t-o: #FF9F0A; --t-y: #FFD60A;
  color-scheme: dark;
}

html { overflow-x: hidden; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background-color: var(--ground); color: var(--ink); font: 16px/1.55 var(--f-ui); -webkit-text-size-adjust: 100%; }
/* aloni di colore fissi ai bordi: il vetro li sfoca mentre il contenuto scorre */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(75% 26% at 100% 3%, var(--bgtop), transparent),
    radial-gradient(80% 34% at 0% 44%, var(--halo2), transparent),
    radial-gradient(75% 30% at 100% 80%, var(--halo1), transparent);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
#app {
  position: relative; z-index: 1; overflow-x: clip;
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 160px;
}
button { font-family: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
p { margin: 0 0 8px; }
.muted { color: var(--soft); }

/* vetro: strato dei comandi e dei menu. Bordo scuro sottile, luce in alto, sfocatura che diffonde ciò che sta dietro */
.card, .mods, .list, .tabs, .back, .sheet, .flow, .tbl {
  background: linear-gradient(140deg, var(--lq-a), var(--lq-b) 55%, var(--lq-c));
  box-shadow: var(--gl-edge), var(--gl-ring), var(--gl-sh);
  -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
  border: 0;
}
/* pannello piatto per ciò che si legge: nessun vetro dietro al testo */
.panel { background: var(--paper); border-radius: 26px; padding: 20px; margin: 0 0 12px; box-shadow: inset 0 0 0 1px var(--hair), 0 1px 2px rgba(31, 42, 92, .05); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .card, .mods, .list, .tabs, .back, .sheet, .flow, .tbl { background: var(--ground); }
}
/* iOS 27: il vetro segue "Riduci trasparenza" e "Aumenta contrasto" */
@media (prefers-reduced-transparency: reduce) {
  .card, .mods, .list, .tabs, .back, .sheet, .flow, .tbl { background: var(--ground); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .nav::before, .sheet-bg { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .nav::before { background: var(--ground); }
  .panel, :root { --paper: var(--ground); }
}
@media (prefers-contrast: more) {
  :root:root { --hair: color-mix(in srgb, var(--ink) 55%, transparent); --soft: var(--ink); }
  .card, .mods, .list, .tabs, .back, .sheet, .flow, .tbl { box-shadow: inset 0 0 0 1.5px var(--hair); }
}

/* --- testata e navigazione --- */
.hero { padding: 64px 4px 6px; text-align: center; }
.eyebrow { font: 600 12px var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin: 0 0 10px; }
.hero-dev { font: 600 40px/1.2 var(--f-dev); letter-spacing: .02em; margin: 0 0 2px;
  background: linear-gradient(180deg, var(--ti-a), var(--ti-b)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 8px var(--ti-glow)) drop-shadow(0 1px 0 var(--ti-sh)); }
.hero-t { font: 600 38px/1.15 var(--f-serif); letter-spacing: .015em; margin: 0; text-shadow: 0 0 3px var(--ti-sh), 0 1px 1px var(--ti-sh), 0 0 6px var(--ti-glow); text-wrap: balance; }
.lead { max-width: 40ch; margin: 12px auto 0; color: var(--soft); font-size: 15px; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; display: flex; align-items: center; height: 64px; padding-top: 6px; pointer-events: none; }
/* velo sfumato a tutta larghezza dietro il pulsante: il testo che scorre sotto sparisce dolcemente (un solo effetto di bordo per schermata) */
.nav::before { content: ""; position: absolute; z-index: -1; top: 0; bottom: -10px; left: 50%; width: 100vw; transform: translateX(-50%);
  background: linear-gradient(180deg, color-mix(in srgb, var(--ground) 92%, transparent) 0%, color-mix(in srgb, var(--ground) 80%, transparent) 70%, transparent 100%);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
.nav .back { pointer-events: auto; }

/* dentro il visualizzatore di Claude (cornice) il margine di sicurezza non viene passato (env = 0): lì si usa comunque almeno 34px */
html.in-frame .tabs { bottom: calc(max(env(safe-area-inset-bottom, 0px), 34px) + 26px); }
/* le barre (scheda in basso, controllo segmentato in alto) si nascondono scorrendo verso il basso e tornano scorrendo verso l'alto */
.nav .modbar { transition: transform .34s cubic-bezier(.3,.9,.3,1), opacity .24s ease; }
html.bars-off .tabs { transform: translateY(calc(100% + 90px)); opacity: 0; pointer-events: none; }
html.bars-off .nav .modbar { transform: translateY(-84px); opacity: 0; pointer-events: none; }
/* quando spariscono, le barre lo fanno con calma; quando tornano restano veloci */
html.bars-off .tabs, html.bars-off .nav .modbar, html.bars-off .nav.seg-nav { transition: transform .6s cubic-bezier(.4, 0, .2, 1), opacity .5s ease; }
@media (prefers-reduced-motion: reduce) { .tabs, .nav .modbar, html.bars-off .tabs, html.bars-off .nav .modbar, html.bars-off .nav.seg-nav { transition: opacity .01s; } }
/* esercizi: indietro è solo testo (niente cerchio di vetro) e a destra il cronometro */
.nav.exnav { justify-content: space-between; padding-left: 2px; }
.nav.exnav .back.txt { width: auto; min-width: 0; height: 44px; padding: 0 12px 0 0; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none;
  color: var(--accent-ink, var(--ink)); font: 600 16px var(--f-ui); gap: 2px; }
.nav.exnav .back.txt .bl { display: inline; }
.nav.exnav .back.txt .bk { width: 18px; height: 18px; }
.extimer { pointer-events: none; padding-right: 4px; font: 600 15px var(--f-ui); color: var(--soft); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.back { display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 44px; height: 44px; padding: 0 16px 0 10px; border-radius: 999px;
  color: var(--ink); font: 500 15px var(--f-ui); cursor: pointer; transition: transform .16s ease; }
.nav .back { padding: 0; width: 44px; }
.nav .back .bl { display: none; }
.back .bk { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.back.inline { margin: 4px 0 10px; color: var(--accent); font-weight: 600; }
.back:active { transform: scale(.94); }
.bar { padding: 4px 4px 4px; }
.t { font: 600 30px/1.15 var(--f-serif); margin: 0; text-wrap: balance; }
.sub { color: var(--soft); font-size: 14px; margin: 4px 0 0; }
.h2 { font: 600 12px var(--f-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--soft); margin: 28px 8px 8px; }
.lab { font: 600 12px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); margin: 18px 0 6px; }
.intro { color: var(--soft); font-size: 15px; margin: 12px 4px 16px; }
.dev-s { font: 400 18px var(--f-dev); color: var(--soft); margin-left: 8px; }
.t .dev-s { font-size: 24px; color: var(--accent); font-weight: 600; }
.foot { text-align: center; margin: 24px 0 0; }
.link { background: none; border: 0; color: var(--accent); font: 600 15px var(--f-ui); min-height: 44px; cursor: pointer; }
.ext { color: var(--accent); }
.note { font-size: 13px; color: var(--soft); margin-top: 18px; }
.ver { text-align: center; margin: 22px 0 0; font: 500 12px var(--f-ui); letter-spacing: .06em; color: var(--soft); font-variant-numeric: tabular-nums; }

/* --- barra delle schede fluttuante (capsula, margine dal bordo) --- */
.tabs {
  position: fixed; z-index: 8; left: 0; right: 0; margin: 0 auto;
  /* come la barra di Instagram: sopra l'indicatore home. Nel browser e nell'app aggiunta alla Home vale il margine di sicurezza reale del telefono */
  bottom: calc(env(safe-area-inset-bottom, 0px) + 26px);
  /* capsula compatta solo con icone (come la barra di Instagram): ogni voce è larga 64px */
  width: min(calc(var(--n, 3) * 64px + 8px + (var(--n, 3) - 1) * 2px), calc(100vw - 24px));
  display: flex; gap: 2px; padding: 4px; border-radius: 999px;
  /* liquid glass: poco colore, molto sfocato, bordo luminoso sottile */
  background: linear-gradient(135deg, color-mix(in srgb, var(--lq-a) 18%, transparent), color-mix(in srgb, var(--lq-b) 26%, transparent) 58%, color-mix(in srgb, var(--lq-c) 22%, transparent));
  box-shadow: var(--bar-edge), var(--gl-ring), 0 14px 34px -14px rgba(40, 30, 10, .3);
  -webkit-backdrop-filter: blur(26px) saturate(2.5) brightness(1.08); backdrop-filter: blur(26px) saturate(2.5) brightness(1.08);
  transition: transform .34s cubic-bezier(.3,.9,.3,1), opacity .24s ease;
}
@media (prefers-reduced-transparency: reduce) { .tabs { background: var(--ground); -webkit-backdrop-filter: none; backdrop-filter: none; } }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .tabs { background: var(--ground); } }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; padding: 0;
  border: 0; border-radius: 999px; background: none; color: var(--soft); font: 500 12px var(--f-ui); cursor: pointer; transition: transform .16s ease; }
.tab svg { display: block; width: 24px; height: 24px; }
.tab.on svg { stroke-width: 2.3; }
/* niente testo sotto le icone: resta per lo screen reader */
.tab span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tab.on { color: var(--sel-ink); font-weight: 600; }
.tab, .segb { position: relative; z-index: 1; }
/* indicatore scorrevole: segue il dito sulla barra in basso e sui controlli segmentati.
   --i è la posizione (anche frazionaria), --n il numero di voci, --pad il margine interno del contenitore */
[data-scrub] { touch-action: none; -webkit-user-select: none; user-select: none; }
.tabs { --pad: 4px; }
.seg { --pad: 4px; position: relative; }
.thumb { position: absolute; z-index: 0; top: var(--pad); bottom: var(--pad); left: var(--pad); border-radius: 999px; pointer-events: none;
  width: calc((100% - 2 * var(--pad) - (var(--n) - 1) * 2px) / var(--n));
  transform: translateX(calc(var(--i, 0) * (100% + 2px)));
  transition: transform .38s cubic-bezier(.22, 1.12, .36, 1);
  background: linear-gradient(140deg, var(--lq-sel-a), var(--lq-sel-b));
  box-shadow: inset 0 1px 1px var(--lq-in), 0 0 0 1px var(--hair), 0 6px 14px -9px rgba(90, 60, 10, .35); }
[data-scrub].drag .thumb { transition: none; }
@supports not (width: calc(100% / var(--n))) { .thumb { display: none; } .tab.on, .segb.on { background: var(--sel-bg); } }
.tab:active { transform: scale(.95); }

/* --- carte, elenchi e righe --- */
.card { border-radius: 28px; padding: 18px 20px; margin: 0 0 12px; }
.chip { font: 500 12px var(--f-ui); padding: 5px 11px; border-radius: 999px; background: var(--fill); color: var(--soft); white-space: nowrap; }
.chip-on { background: var(--sel-bg); color: var(--sel-ink); font-weight: 600; }

.prog-n { margin: 0 0 12px; }
.bar-track { height: 10px; border-radius: 99px; background: var(--fill); overflow: hidden; }
.bar-track.slim { height: 6px; margin: 10px 4px 14px; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-fill), var(--mark)); border-radius: 99px; transition: width .35s cubic-bezier(.3, .8, .3, 1); }

/* un unico blocco con righe separate da una linea sottile (moduli, metri, versi, esercizi) */
.mods, .list { display: flex; flex-direction: column; border-radius: 28px; overflow: hidden; }
.mods > *, .list > * { border-bottom: 1px solid var(--hair); }
.mods > *:last-child, .list > *:last-child { border-bottom: 0; }
.mod, .vrow { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 13px 16px 13px 14px; min-height: 68px;
  background: none; border: 0; font: inherit; color: var(--ink); cursor: pointer; transition: background .16s ease; }
.mod:active, .vrow:active { background: var(--fill); }
.mod.on { background: var(--sel-bg); }
.mod-main, .vt { flex: 1; min-width: 0; }
.mod-it { display: block; font: 600 18px/1.3 var(--f-serif); }
.mod.on .mod-it { color: var(--accent); }
.mod-src { display: block; font-size: 13px; color: var(--soft); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { flex: none; width: 20px; height: 20px; fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease; }
.metre.open .chev { transform: rotate(90deg); }
/* raggio concentrico: 28 (blocco) meno 14 (margine) */
.tile { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; color: var(--accent);
  background: var(--cell); box-shadow: inset 0 1px 0 var(--lq-in), inset 0 0 0 1px var(--hair); }
.tile svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mod.on .tile { background: var(--accent-fill); color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45); }
.tile.sm { width: 36px; height: 36px; border-radius: 12px; margin-right: 12px; }
.tile.sm svg { width: 22px; height: 22px; }

/* --- metri --- */
.metre { padding: 0; }
.metre-h { min-height: 64px; }
.mname { font: 600 18px var(--f-serif); }
.mh-sub { display: block; color: var(--soft); font-size: 14px; margin-top: 2px; }
.detail { padding: 2px 16px 18px 14px; }
.lak { font: italic 400 16px/1.65 var(--f-serif); margin: 0; }
.vlink { display: block; width: 100%; text-align: left; padding: 11px 16px; margin: 0 0 8px; min-height: 46px; background: var(--cell); border: 0; border-radius: 16px;
  box-shadow: inset 0 0 0 1px var(--hair); font: 500 15px var(--f-ui); color: var(--ink); cursor: pointer; }
.vlink:active { background: var(--sel-bg); }
.vc-ref { display: block; font: 600 17px var(--f-serif); }
.vc-first { display: block; margin-top: 2px; font: italic 400 15px var(--f-serif); color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vd { display: block; font: 400 13.5px/1.35 var(--f-ui); color: var(--soft); margin-top: 2px; }
.vp { display: block; font: 600 12px var(--f-ui); color: var(--accent); margin-top: 6px; }

/* simboli laghu / guru */
.mk { display: block; color: var(--ink); }
.mk.L { width: 9px; height: 5px; border: 2px solid currentColor; border-top: 0; border-radius: 0 0 8px 8px; }
.mk.G { width: 18px; height: 0; border-top: 2px solid currentColor; border-radius: 2px; }
.mk.U { width: 5px; height: 5px; border-radius: 50%; background: var(--hair); }
.strip { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 10px; }
.sg { display: flex; gap: 2px; }
.sc { width: 20px; height: 14px; display: flex; justify-content: center; align-items: center; }
.sc.yt { margin-right: 4px; padding-right: 4px; border-right: 2px solid var(--mark); box-sizing: content-box; }

/* griglia sillabe: riquadri pieni, leggibili, senza vetro */
.pada { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.grp { display: flex; gap: 4px; }
.syl { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 32px; padding: 7px 4px 5px;
  border: 0; background: var(--cell); border-radius: 14px; font: inherit; color: inherit;
  box-shadow: inset 0 0 0 1px var(--hair); transition: transform .12s ease; }
button.syl { cursor: pointer; min-height: 46px; }
button.syl:active { transform: scale(.92); }
.st { font: 500 14px/1.2 var(--f-serif); }
.mkbox { display: flex; justify-content: center; align-items: center; height: 12px; }
.rt { font: 600 9px/1 var(--f-ui); letter-spacing: .04em; color: var(--soft); }
.was { display: flex; align-items: center; gap: 3px; font: 600 9px/1 var(--f-ui); color: var(--bad); opacity: .85; margin-top: 1px; }
.was .mk { transform: scale(.8); }
button, .syl { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.syl.yt { margin-right: 8px; }
.syl.yt::after { content: ""; position: absolute; right: -7px; top: 3px; bottom: 3px; width: 2px; border-radius: 1px; background: var(--mark); }
.syl.ok { background: var(--good-soft); box-shadow: inset 0 0 0 1.5px var(--good); }
.syl.bad { background: var(--bad-soft); box-shadow: inset 0 0 0 1.5px var(--bad); }
.syl.ok .mk { color: var(--good); }
.syl.bad .mk { color: var(--bad); }

/* --- verso --- */
.v-ref { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font: 600 22px/1.25 var(--f-serif); margin: 6px 0 14px; }
.dev { font: 400 24px/1.75 var(--f-dev); }
.dev p { margin: 0; }
.v-iast { font: italic 400 16px/1.6 var(--f-serif); color: var(--soft); margin: 14px 0 16px; padding-top: 14px; border-top: 1px solid var(--hair); }
.v-iast p { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
.pl { font: 600 13px var(--f-ui); color: var(--soft); margin: 18px 0 8px; }
.res { padding: 12px 16px; border-radius: 20px; margin: 16px 0; background: var(--cell); box-shadow: inset 0 0 0 1px var(--hair); }
.res.ok { background: var(--good-soft); box-shadow: inset 0 0 0 1.5px var(--good); }
.res.bad { background: var(--bad-soft); box-shadow: inset 0 0 0 1.5px var(--bad); }
.legend { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 4px; font-size: 13px; color: var(--soft); }
.legend b { color: var(--ink); }

/* --- bottoni: l'azione principale è l'unico elemento pieno e colorato --- */
.btn { font: 600 15px var(--f-ui); padding: 0 22px; min-height: 48px; border-radius: 999px; border: 0; color: var(--ink); cursor: pointer;
  background: var(--cell); box-shadow: inset 0 0 0 1px var(--hair); transition: transform .16s ease, opacity .2s; }
.btn:active { transform: scale(.96); }
.btn-p { background: var(--accent-fill); color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 10px 22px -12px var(--accent-fill); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.wide { width: 100%; }

/* --- esercizi --- */
.ex-t { display: block; font: 600 18px/1.3 var(--f-serif); }
.ex-f { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; }
.q-lab { font: 600 13px var(--f-ui); color: var(--soft); margin: 0 0 8px; }
.q-dev { margin: 0; }
.q-iast { font: italic 400 15px var(--f-serif); color: var(--soft); margin: 2px 0 16px; }
.hint { background: var(--sel-bg); padding: 10px 14px; border-radius: 16px; }
.opts { display: grid; gap: 10px; margin: 16px 0; }
.opts.g4 { grid-template-columns: repeat(4, 1fr); }
.opts.g2 { grid-template-columns: repeat(2, 1fr); }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; min-height: 54px; text-align: left;
  border: 0; border-radius: 20px; background: var(--cell); font: inherit; color: inherit; cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--hair); transition: transform .12s ease; }
.opt:active:not(:disabled) { transform: scale(.97); }
.opt.ok { background: var(--good-soft); box-shadow: inset 0 0 0 1.5px var(--good); }
.opt.bad { background: var(--bad-soft); box-shadow: inset 0 0 0 1.5px var(--bad); }
.opt:disabled { cursor: default; color: inherit; }
/* risposte del metro: un unico elenco con righe sottili */
.opts.lst { display: flex; flex-direction: column; gap: 0; border-radius: 20px; overflow: hidden; background: var(--cell); box-shadow: inset 0 0 0 1px var(--hair); }
.opts.lst .opt { border-radius: 0; box-shadow: none; background: none; border-bottom: 1px solid var(--hair); }
.opts.lst .opt:last-child { border-bottom: 0; }
.opts.lst .opt.ok { background: var(--good-soft); box-shadow: inset 0 0 0 1.5px var(--good); }
.opts.lst .opt.bad { background: var(--bad-soft); box-shadow: inset 0 0 0 1.5px var(--bad); }
.gopt { justify-content: center; font: 600 17px var(--f-serif); }
.gmarks { display: inline-flex; gap: 8px; align-items: center; height: 20px; }
.gbig { display: flex; justify-content: center; padding: 22px 0 10px; }
.gbig .gmarks { gap: 20px; transform: scale(1.7); }
.mnem { text-align: center; font: italic 14px var(--f-serif); margin: 14px 0 0; }
.done { text-align: left; }
.done-n { font: 600 46px/1.1 var(--f-serif); margin: 0 0 4px; }

/* --- scheda informativa --- */
.flow { list-style: none; margin: 0; padding: 0; border-radius: 28px; overflow: hidden; }
.flow li { display: grid; gap: 2px; padding: 14px 18px; border-bottom: 1px solid var(--hair); }
.flow li:last-child { border-bottom: 0; }
.code { overflow-x: auto; background: var(--fill); border-radius: 20px; padding: 14px 16px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0 0 10px; }
.tbl { overflow-x: auto; border-radius: 22px; padding: 4px 16px; }
table { width: 100%; border-collapse: collapse; }
td { padding: 10px 4px; border-bottom: 1px solid var(--hair); }
tr:last-child td { border-bottom: 0; }
.num { text-align: right; font-variant-numeric: tabular-nums; }

/* --- home: anello, punti della settimana, azione principale --- */
.hero.sm { padding: 52px 4px 0; }
.hero.sm .hero-dev { font-size: 28px; }
.hero.sm .hero-t { font-size: 26px; }
.bar.top { padding-top: 60px; }
.today { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 20px 18px; margin-top: 18px; }
.ring { position: relative; width: 176px; height: 176px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.rg-track, .rg-arc { fill: none; stroke-width: 12; }
.rg-track { stroke: var(--fill); }
.rg-arc { stroke: var(--accent-fill); stroke-linecap: round; stroke-dasharray: var(--c); stroke-dashoffset: var(--off); animation: ringin .9s cubic-bezier(.2, .8, .2, 1) both; }
.rg-arc.still { animation: none; }
@keyframes ringin { from { stroke-dashoffset: var(--c); } }
.ring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.ring-c b { font: 600 50px/1 var(--f-serif); font-variant-numeric: tabular-nums; }
.ring-c span { font: 500 13px var(--f-ui); color: var(--soft); margin-top: 4px; }
.nudge { margin: 6px 0 0; font: italic 400 15px var(--f-serif); color: var(--soft); text-align: center; }
.dots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
.dot-c { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 36px; }
.dot-c > span { font: 500 11px var(--f-ui); color: var(--soft); }
.dot { display: block; width: 22px; height: 22px; border-radius: 50%; background: none; box-shadow: inset 0 0 0 1.5px var(--hair); }
.dot.part { background: var(--sel-bg); box-shadow: inset 0 0 0 1.5px var(--accent-fill); }
.dot.met { background: var(--accent-fill); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45); }
.dot.now { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot.fut { opacity: .45; }
.cta { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 64px; padding: 10px 18px 10px 22px; margin: 0 0 14px; text-align: left; }
.cta-x { display: flex; flex-direction: column; }
.cta-t { font: 600 17px/1.2 var(--f-ui); }
.cta-s { font: 400 14px/1.3 var(--f-ui); opacity: .85; }
.cta .chev { stroke: var(--on-accent); }
.list.gap { margin-top: 16px; }
.vrow:disabled { opacity: .55; cursor: default; }
.vrow:disabled:active { background: none; }

/* --- test: scelta dei moduli e della lunghezza --- */
.lab.first { margin-top: 0; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--cell);
  box-shadow: inset 0 0 0 1px var(--hair); font: 500 14px var(--f-ui); color: var(--ink); cursor: pointer; }
.pick .ck { display: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pick.on { background: var(--sel-bg); color: var(--sel-ink); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--accent-fill); }
.pick.on .ck { display: block; }
.pick:disabled { opacity: .5; cursor: default; }
.pick.all { font-weight: 600; }
.codebox { display: block; width: 100%; margin: 14px 0 0; padding: 12px 14px; border: 0; border-radius: 16px; background: var(--cell); color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--hair); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; resize: vertical; }
.codebox:focus-visible { outline: 2px solid var(--accent-fill); outline-offset: 2px; }
.note.nt { margin-top: 0; }
.note.tight { margin-top: 12px; }
.gtab { list-style: none; padding: 0; margin: 4px 0 0; }
.gtab li { display: grid; grid-template-columns: 78px 64px 1fr; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair); }
.gtab li:first-child { border-top: 0; }
.gn-n { font: 600 17px var(--f-serif); white-space: nowrap; }
.gn-n .dev-s { font-size: 15px; margin-left: 6px; }
.gn-w { color: var(--soft); font-size: 13px; }
/* alfabeto */
.al-lst { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
.al-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.al-row.r4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.al-c { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 62px; padding: 6px 2px;
  border: 0; border-radius: 14px; background: var(--cell); box-shadow: inset 0 0 0 1px var(--hair); font: inherit; color: inherit; }
.al-d { font: 500 26px/1.25 var(--f-dev); }
.al-i { font: 500 13px var(--f-ui); color: var(--soft); }
.al-n { position: absolute; top: 4px; left: 7px; font: 500 10px var(--f-ui); color: var(--soft); }
.al-cap { font: 600 12px var(--f-ui); color: var(--soft); margin: 14px 0 6px; }
.al-cap .dev-s { font-size: 14px; }
/* alfabeto, scheda Tabelle: tabelle vere (intestazione ambra, colonne alterne appena tinte, righe separate da un filo) */
.at-w { position: relative; border-radius: 18px; overflow: hidden; background: var(--cell); }
.at-w + .at-w { margin-top: 8px; }
.note + .at-w { margin-top: 14px; }
.at-w::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--hair); pointer-events: none; }
.at { width: 100%; border-collapse: collapse; table-layout: fixed; }
.at th, .at td { padding: 5px 2px; text-align: center; vertical-align: middle; border-bottom: 1px solid var(--hair); }
.at tr:last-child > * { border-bottom: 0; }
.at thead th { padding: 7px 2px; background: color-mix(in srgb, var(--accent-fill) 26%, var(--cell)); color: var(--sel-ink);
  font: 700 10.5px/1.2 var(--f-ui); overflow-wrap: anywhere; border-bottom: 1px solid color-mix(in srgb, var(--accent-fill) 50%, transparent); }
.at thead th i { display: block; font: 500 9.5px/1.1 var(--f-ui); font-style: normal; opacity: .75; }
.at thead .sp { border-left: 1px solid color-mix(in srgb, var(--accent-fill) 50%, transparent); }
.at .rh { text-align: left; padding: 5px 4px 5px 10px; background: var(--fill); color: var(--soft); font: 600 11px/1.25 var(--f-ui); overflow-wrap: anywhere; }
.at .rh .dev-s { display: block; margin: 0; font-size: 13px; }
.at .alt { background: color-mix(in srgb, var(--accent-fill) 11%, var(--cell)); }
.at .d { display: block; font: 500 22px/1.25 var(--f-dev); }
.at .i { display: block; font: 500 12px/1.2 var(--f-ui); color: var(--soft); }
.at .n { color: var(--soft); font: 500 11px var(--f-ui); font-variant-numeric: tabular-nums; }
.at .dv { font: 500 22px/1.3 var(--f-dev); }
.at .ia { font: 500 15px var(--f-ui); }
.at .sp { border-left: 1px solid var(--hair); }
.at .band th { text-align: left; padding: 6px 10px; background: color-mix(in srgb, var(--accent-fill) 26%, var(--cell)); color: var(--sel-ink);
  font: 700 11px var(--f-ui); border-bottom: 1px solid color-mix(in srgb, var(--accent-fill) 50%, transparent); }
.at .band .dev-s { margin: 0 0 0 8px; color: inherit; opacity: .85; font-size: 13px; }
@media (max-width: 380px) { .at thead th { font-size: 9px; letter-spacing: -.01em; padding-left: 0; padding-right: 0; } }
/* pagine di studio senza riquadro grosso: testo a tutta larghezza, come in Sandhi */
.card.flat { background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; border-radius: 0; padding: 0 2px; margin: 0 0 6px; }
.card.flat + .card.flat { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--hair); }
.list.flat { background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; border-radius: 0; overflow: visible; border-top: 1px solid var(--hair); }
.list.flat .vrow, .list.flat .metre-h { padding-left: 2px; padding-right: 2px; }
.list.flat .detail { padding-left: 2px; padding-right: 2px; }
/* paradigmi (Nomi, Pronomi, Verbi): tabelle vere, righe = casi o persone, colonne = singolare, duale, plurale */
.at.tp td { padding: 7px 3px; font: 500 14px/1.25 var(--f-serif); overflow-wrap: break-word; }
.at.tp td .dv { display: block; margin-top: 1px; font: 400 12px var(--f-dev); color: var(--soft); }
.at.tp td.x { color: color-mix(in srgb, var(--ink) 55%, transparent); }
.at .rh small { display: block; font: italic 400 10.5px var(--f-serif); color: var(--soft); }
/* barra delle schede del modulo: in alto, accanto al tasto indietro (resta fissa mentre scorri), a capsula di vetro */
.nav .modbar { flex: 1; min-width: 0; margin: 0 0 0 10px; pointer-events: auto; }
.modseg { --pad: 4px; padding: 4px; border-radius: 999px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--lq-a) 32%, transparent), color-mix(in srgb, var(--lq-b) 40%, transparent) 58%, color-mix(in srgb, var(--lq-c) 36%, transparent));
  box-shadow: var(--bar-edge), var(--gl-ring), 0 10px 26px -16px rgba(40, 30, 10, .3);
  -webkit-backdrop-filter: blur(28px) saturate(2.3); backdrop-filter: blur(28px) saturate(2.3); }
.modseg .segb { min-height: 34px; font-size: 14px; }

/* barra dei moduli: un'unica capsula di vetro (indietro + schede), voce attiva più leggibile */
.nav.seg-nav { padding-top: 8px; align-items: flex-start; transition: transform .34s cubic-bezier(.3,.9,.3,1), opacity .24s ease; }
.nav.seg-nav::after { content: ""; position: absolute; z-index: -1; left: 0; right: 0; top: 8px; height: 48px; border-radius: 999px; pointer-events: none;
  background: linear-gradient(135deg, color-mix(in srgb, var(--lq-a) 32%, transparent), color-mix(in srgb, var(--lq-b) 40%, transparent) 58%, color-mix(in srgb, var(--lq-c) 36%, transparent));
  box-shadow: var(--bar-edge), var(--gl-ring), 0 10px 26px -16px rgba(40, 30, 10, .3);
  -webkit-backdrop-filter: blur(24px) saturate(2.4) brightness(1.06); backdrop-filter: blur(24px) saturate(2.4) brightness(1.06); }
.nav.seg-nav .back { position: relative; z-index: 1; width: 44px; height: 48px; margin-left: 2px; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.nav.seg-nav .back::after { content: ""; position: absolute; right: 0; top: 14px; bottom: 14px; width: 1px; background: var(--hair); }
.nav.seg-nav .modbar { margin: 0; height: 48px; display: flex; align-items: center; transition: none; }
.nav.seg-nav .modseg { flex: 1; background: none; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; padding: 4px 4px 4px 6px; --pad: 4px; }
.nav.seg-nav .modseg .thumb { top: 4px; bottom: 4px; box-shadow: inset 0 1px 1px var(--lq-in), 0 0 0 1px var(--hair), 0 5px 12px -6px rgba(90, 60, 10, .45); background: linear-gradient(140deg, color-mix(in srgb, var(--lq-sel-a) 100%, #fff), var(--lq-sel-b)); }
.nav.seg-nav .modseg .segb { min-height: 40px; font-size: 14px; }
.nav.seg-nav .modseg .segb.on { color: var(--sel-ink); font-weight: 650; }
html.bars-off .nav.seg-nav { transform: translateY(-84px); opacity: 0; pointer-events: none; }
html.bars-off .nav.seg-nav .modbar { transform: none; opacity: 1; }
@media (prefers-reduced-transparency: reduce) { .nav.seg-nav::after { background: var(--ground); -webkit-backdrop-filter: none; backdrop-filter: none; } }
@media (prefers-reduced-transparency: reduce) { .modseg { background: var(--ground); -webkit-backdrop-filter: none; backdrop-filter: none; } }
/* swipe sui paradigmi: la tabella entra da lato */
.ps-f { animation: psF .26s cubic-bezier(.2, .8, .2, 1) backwards; }
.ps-b { animation: psB .26s cubic-bezier(.2, .8, .2, 1) backwards; }
@keyframes psF { from { opacity: 0; transform: translateX(26px); } }
@keyframes psB { from { opacity: 0; transform: translateX(-26px); } }

<script>
const Engine = (function () {
  'use strict';

  // ---- Tokenizzazione IAST ----
  const TOKEN = /kh|gh|ch|jh|ṭh|ḍh|th|dh|ph|bh|ai|au|[kgcjṭḍtdpbṅñṇnmyrlvśṣsh]|[aāiīuūṛṝḷḹeo]|[ṁḥ]/g;
  const VOWEL = /^(ai|au|[aāiīuūṛṝḷḹeo])$/;
  const LONGV = new Set(['ā', 'ī', 'ū', 'ṝ', 'ḹ', 'e', 'ai', 'o', 'au']);
  const SEMI = new Set(['r', 'y', 'v', 'l']);

  function clean(s) {
    return s.normalize('NFC').toLowerCase().replace(/ṃ/g, 'ṁ')
      .replace(/[^a-zāīūṛṝḷḹṅñṭḍṇśṣṁḥ]/g, '');
  }

  // ---- Sillabazione e peso (regole 1-4 del corso) ----
  // R1 vocale lunga per natura (ā ī ū ṝ e ai o au)
  // R2 vocale breve prima di un nesso consonantico (satsaṅga)
  // R3 vocale breve con anusvāra, visarga o consonante finale
  // R4 ultima sillaba del pāda (sempre guru)
  function syllabify(pada) {
    // confini di parola (spazi e trattini) serviti solo per la divisione mostrata, non per il peso
    const toks = [], after = new Set();
    String(pada).split(/[\s\-–]+/).forEach(wd => {
      const t = clean(wd).match(TOKEN) || [];
      if (!t.length) return;
      toks.push(...t); after.add(toks.length - 1);
    });
    const nuc = [];
    toks.forEach((t, i) => { if (VOWEL.test(t)) nuc.push(i); });
    if (!nuc.length) return [];
    const out = [];
    let prefix = toks.slice(0, nuc[0]);
    for (let k = 0; k < nuc.length; k++) {
      const i = nuc[k];
      let j = i + 1, mark = '';
      if (toks[j] === 'ṁ' || toks[j] === 'ḥ') { mark = toks[j]; j++; }
      const last = k === nuc.length - 1;
      const end = last ? toks.length : nuc[k + 1];
      const cons = toks.slice(j, end);
      let coda = [], onset = [];
      if (last) coda = cons;
      else if (cons.length === 1) onset = cons;
      else if (cons.length >= 2) {
        // solo per la visualizzazione: dentro la parola il nesso intero va con la vocale
        // seguente (ja | nma), come negli akṣara; il peso (R2) resta sulla vocale breve prima
        let b = -1;
        for (let x = j - 1; x < end; x++) if (after.has(x)) { b = x - j + 1; break; }
        if (b < 0) onset = cons;
        else {
          const prevPart = cons.slice(0, b), nextPart = cons.slice(b);
          if (nextPart.length) { coda = prevPart; onset = nextPart; }
          else { coda = prevPart.slice(0, -1); onset = prevPart.slice(-1); }
        }
      }
      const v = toks[i];
      let w = 'L', r = null;
      if (LONGV.has(v)) { w = 'G'; r = 'R1'; }
      else if (mark) { w = 'G'; r = 'R3'; }
      else if (cons.length >= 2) { w = 'G'; r = 'R2'; }
      else if (last) { w = 'G'; r = cons.length ? 'R3' : 'R4'; }
      out.push({ t: prefix.join('') + v + mark + coda.join(''), w, r, v });
      prefix = onset;
    }
    return out;
  }

  const wstr = syls => syls.map(s => s.w).join('');

  // ---- Gaṇa ----
  const GANA = { ya: 'LGG', ma: 'GGG', ta: 'GGL', ra: 'GLG', ja: 'LGL', bha: 'GLL', na: 'LLL', sa: 'LLG' };
  const GANA_BY_PATTERN = Object.fromEntries(Object.entries(GANA).map(([k, v]) => [v, k]));
  const GANA_ORDER = ['ya', 'ma', 'ta', 'ra', 'ja', 'bha', 'na', 'sa'];

  function ganaNames(w) {
    const names = [];
    for (let i = 0; i + 3 <= w.length; i += 3) names.push(GANA_BY_PATTERN[w.slice(i, i + 3)] || '?');
    const rest = w.slice(Math.floor(w.length / 3) * 3);
    for (const c of rest) names.push(c === 'G' ? 'ga' : 'la');
    return names;
  }

  // ---- Metri (dalla pagina Chandaḥ del corso) ----
  function metre(id, name, dev, ganas, tail, yati, lak, extra) {
    const pattern = ganas ? ganas.map(g => GANA[g]).join('') + tail : null;
    const n = pattern ? pattern.length : 8;
    const groups = pattern ? [...ganas.map(() => 3), ...(tail.length ? [tail.length] : [])] : [4, 4];
    return Object.assign({ id, name, dev, ganas, tail, pattern, n, groups, yati, lak }, extra || {});
  }

  const METRES = [
    metre('anustup', 'Anuṣṭup', 'अनुष्टुप्', null, '', [], [
      'pañcamaṁ laghu sarvatra |', 'saptamaṁ dvicaturthayoḥ |',
      'ṣaṣṭhaṁ guru vijānīyāt |', 'etad padyasya lakṣaṇam ||'
    ]),
    metre('indravajra', 'Indravajrā', 'इन्द्रवज्रा', ['ta', 'ta', 'ja'], 'GG', [5],
      ['syād indravajrā yadi tau ja gau gaḥ']),
    metre('shalini', 'Śālinī', 'शालिनी', ['ma', 'ta', 'ta'], 'GG', [4],
      ['māt tau gau cet śālinī vedalokaiḥ']),
    metre('vasantatilaka', 'Vasantatilakā', 'वसन्ततिलक', ['ta', 'bha', 'ja', 'ja'], 'GG', [8],
      ['uktā vasantatilakā tabhajā jagau gaḥ']),
    metre('malini', 'Mālinī', 'मालिनी', ['na', 'na', 'ma', 'ya', 'ya'], '', [8],
      ['nana-maya-yayuteyaṃ mālinī bhogilokaiḥ']),
    metre('shikharini', 'Śikhariṇī', 'शिखरिणी', ['ya', 'ma', 'na', 'sa', 'bha'], 'LG', [6],
      ['rasairudraiśchinnā yamanasabhalāgāḥ śikhariṇī']),
    metre('mandakranta', 'Mandākrāntā', 'मन्दाक्रान्ता', ['ma', 'bha', 'na', 'ta', 'ta'], 'GG', [4, 10],
      ['mandākrāntāmbudhi-rasanagair ma-bha-nau tau ga-yugmam']),
    metre('shardula', 'Śārdūlavikrīḍita', 'शार्दूलविक्रीडितम्', ['ma', 'sa', 'ja', 'sa', 'ta', 'ta'], 'G', [12],
      ['sūryāśvair yadi maḥ sajau satatagāḥ śārdūlavikrīḍitam'])
  ];
  const METRE_BY_ID = Object.fromEntries(METRES.map(m => [m.id, m]));

  // Confronto di un pāda con un metro. padaIdx 0..3 (serve per l'anuṣṭup).
  function matchPada(w, m, padaIdx) {
    if (!m.pattern) {
      if (w.length !== 8) return false;
      return w[4] === 'L' && w[5] === 'G' && (padaIdx % 2 === 0 || w[6] === 'L');
    }
    return w === m.pattern;
  }

  function analyze(lines) {
    return lines.map(l => { const s = syllabify(l); return { syls: s, w: wstr(s) }; });
  }

  function identify(lines) {
    const a = analyze(lines);
    return METRES.filter(m => a.every((p, i) => matchPada(p.w, m, i))).map(m => m.id);
  }

  // ---- IAST -> Devanāgarī ----
  const DC = { k: 'क', kh: 'ख', g: 'ग', gh: 'घ', 'ṅ': 'ङ', c: 'च', ch: 'छ', j: 'ज', jh: 'झ', 'ñ': 'ञ',
    'ṭ': 'ट', 'ṭh': 'ठ', 'ḍ': 'ड', 'ḍh': 'ढ', 'ṇ': 'ण', t: 'त', th: 'थ', d: 'द', dh: 'ध', n: 'न',
    p: 'प', ph: 'फ', b: 'ब', bh: 'भ', m: 'म', y: 'य', r: 'र', l: 'ल', v: 'व', 'ś': 'श', 'ṣ': 'ष', s: 'स', h: 'ह' };
  const DV = { a: ['अ', ''], 'ā': ['आ', 'ा'], i: ['इ', 'ि'], 'ī': ['ई', 'ी'], u: ['उ', 'ु'], 'ū': ['ऊ', 'ू'],
    'ṛ': ['ऋ', 'ृ'], 'ṝ': ['ॠ', 'ॄ'], 'ḷ': ['ऌ', 'ॢ'], 'ḹ': ['ॡ', 'ॣ'], e: ['ए', 'े'], ai: ['ऐ', 'ै'],
    o: ['ओ', 'ो'], au: ['औ', 'ौ'] };
  const DTOK = /kh|gh|ch|jh|ṭh|ḍh|th|dh|ph|bh|ai|au|[kgcjṭḍtdpbṅñṇnmyrlvśṣsh]|[aāiīuūṛṝḷḹeo]|ṁ|ḥ|’|'|\s+|-|[\s\S]/g;

  function toDevanagari(text) {
    const t = text.normalize('NFC').toLowerCase().replace(/ṃ/g, 'ṁ');
    const toks = t.match(DTOK) || [];
    let out = '', pend = false, space = false;
    for (const tk of toks) {
      if (DC[tk]) {
        if (pend) out += '्';
        if (space) out += ' ';
        space = false; out += DC[tk]; pend = true;
      } else if (DV[tk]) {
        if (pend) { out += DV[tk][1]; pend = false; space = false; }
        else { if (space) out += ' '; space = false; out += DV[tk][0]; }
      } else if (tk === 'ṁ') { out += 'ं'; pend = false; }
      else if (tk === 'ḥ') { out += 'ः'; pend = false; }
      else if (tk === '-') { /* i composti restano uniti */ }
      else if (/^\s+$/.test(tk)) {
        // consonante finale + parola che inizia per vocale: si scrive unita
        if (pend) { space = true; } else if (out) space = true;
      } else if (tk === '’' || tk === "'") {
        if (pend) { out += '्'; pend = false; }
        if (space) out += ' ';
        space = false; out += 'ऽ';
      } else {
        if (pend) { out += '्'; pend = false; }
        if (space) out += ' ';
        space = false; out += tk;
      }
    }
    if (pend) out += '्';
    return out;
  }

  const tokens = x => clean(x).match(TOKEN) || [];
  return { tokens, syllabify, wstr, analyze, identify, matchPada, toDevanagari, ganaNames, clean,
    METRES, METRE_BY_ID, GANA, GANA_ORDER, GANA_BY_PATTERN };
})();

  // N → 1.(N diviso 10).(resto): 1 → 1.0.1, 9 → 1.0.9, 10 → 1.1.0, 19 → 1.1.9, 20 → 1.2.0
  const APP_N = window.VR_N || 1;
  const appVersion = n => '1.' + Math.floor(n / 10) + '.' + (n % 10);

  function viewHome() {
    const rec = store.days[today()] || { sec: 0 };
    const last = LAST_KINDS.includes(store.last) ? store.last : null;
    return `
      <header class="hero sm">
        <p class="hero-dev">${E.toDevanagari('harināmāmṛta-vyākaraṇam')}</p>
        <h1 class="hero-t">Harināmāmṛta-vyākaraṇam</h1>
      </header>
      <section class="card today" aria-label="${esc(t('home.today'))}">
        ${ring(rec.sec, S.peek, S.still)}
        <p class="nudge" role="status">${nudge(rec.sec)}</p>
        ${dots()}
      </section>
      <button class="btn btn-p cta" data-act="resume"><span class="cta-x"><span class="cta-t">${last ? t('home.continue') : t('home.start')}</span><span class="cta-s">${last ? kindName(last) : t('home.startSub')}</span></span>${CHEV}</button>
      <div class="list">
        ${dailyRow()}
        ${reviewRow()}
        <button class="vrow" data-act="progress"><span class="tile" aria-hidden="true">${ICON.progress}</span>
          <span class="vt"><span class="ex-t">${t('progress.title')}</span><span class="vd">${t('progress.rowSub')}</span></span>${CHEV}</button>
      </div>
      <p class="ver">v${appVersion(APP_N)}</p>`;
  }

  function viewModuli() {
    // i moduli già attivi stanno in alto, gli altri (in arrivo) sotto, nell'ordine del corso
    const mods = MODULES.filter(m => m.active).concat(MODULES.filter(m => !m.active)).map(m => `
      <button class="mod" data-act="module" data-id="${m.id}">
        <span class="mod-main"><span class="mod-it">${t('mod.' + m.id)}</span><span class="mod-src">${esc(m.src)}</span></span>
        ${m.active ? '' : `<span class="chip">${t('mod.soon')}</span>`}
        ${CHEV}
      </button>`).join('');
    return `<header class="bar top"><h1 class="t">${t('mod.title')}</h1><p class="sub">${t('mod.sub')}</p></header>
      <p class="intro">${t('mod.intro')}</p>
      <div class="mods">${mods}</div>`;
  }

  function viewTest() {
    const act = MODULES.filter(m => m.active), soon = MODULES.length - act.length;
    const all = S.testAll;
    const sel = all ? act.map(m => m.id) : S.testMods.filter(id => act.some(m => m.id === id));
    const chips = `<button class="pick all${all ? ' on' : ''}" data-act="pickmod" data-id="*" aria-pressed="${all}">${CHECK}${t('test.all')}</button>` +
      act.map(m => { const on = !all && sel.includes(m.id);
        return `<button class="pick${on ? ' on' : ''}" data-act="pickmod" data-id="${m.id}" aria-pressed="${on}">${CHECK}${t('mod.' + m.id)}</button>`; }).join('');
    const lens = tabBar('len', LENS.map(k => `<button class="segb${S.testLen === k ? ' on' : ''}" data-act="testlen" data-n="${k}" aria-pressed="${S.testLen === k}">${k}</button>`),
      Math.max(0, LENS.indexOf(S.testLen)), 'seg', t('test.qAria'), false);
    return `<header class="bar top"><h1 class="t">${t('test.title')}</h1><p class="sub">${t('test.sub')}</p></header>
      <div class="list gap">${dailyRow()}${reviewRow()}</div>
      <h2 class="h2">${t('test.custom')}</h2>
      <section class="card">
        <p class="lab first">${t('test.modules')}</p><div class="picks">${chips}</div>
        ${soon ? `<p class="note tight">${tn('test.soon', soon)}</p>` : ''}
        <p class="lab">${t('test.questions')}</p>${lens}
        <p class="note">${t('test.mix')}</p>
        <button class="btn btn-p wide" data-act="test-start"${sel.length ? '' : ' disabled'}>${t('test.start')}</button>
      </section>`;
  }

  function weakText(k) {
    const i = k.indexOf(':'), ty = k.slice(0, i), a = k.slice(i + 1);
    if (ty === 'rule') return t('rule.' + a);
    if (ty === 'gana') return t('weak.gana', { x: a });
    if (ty === 'letter') return t('weak.letter', { x: ALPHA.L[a].dev + ' ' + a });
    if (ty === 'varga') return t('weak.varga', { g: gname(a) });
    if (ty === 'hname') return t('weak.hname', { n: ALPHA.NB[a].n });
    if (ty === 'sutra') return t('weak.sutra', { n: a }) + (SANDHI.SB[a] ? ' · ' + SANDHI.SB[a].t : '');
    if (ty === 'case') return t('weak.case', { c: caseN(+a) });
    if (ty === 'vform') return t('weak.vform', { p: pnLab(+a[0], +a[1]) });
    if (ty === 'word') return t('weak.word', { w: a });
    if (ty === 'yati') return t('weak.yati', { m: E.METRE_BY_ID[a] ? E.METRE_BY_ID[a].name : a });
    const [x, y] = a.split('>');
    return E.METRE_BY_ID[x] && E.METRE_BY_ID[y] ? t('weak.metre', { a: E.METRE_BY_ID[x].name, b: E.METRE_BY_ID[y].name }) : a;
  }

  const syncShort = () => t(CLOUD.state === 'on' ? 'sync.short.on' : 'sync.short.off');
  const syncNote = () => t({ on: 'sync.on', ready: 'sync.ready', loading: 'sync.loading', noperm: 'sync.noperm', error: 'sync.error' }[CLOUD.state] || 'sync.off');

  function viewProgress() {
    const wk = weekDays(), dl = t('days');
    const recs = wk.map(x => store.days[x.k] || { sec: 0, ok: 0, tot: 0 });
    const mins = recs.map(r => Math.round(r.sec / 60));
    const scale = Math.max(store.goal, ...mins, 10);
    const totQ = sum(recs.map(r => r.tot)), totOk = sum(recs.map(r => r.ok));
    // colori a soglia (percentuale dell'obiettivo o dei risultati): rosso < 30, arancione 30–60, giallo 60–90, verde da 90
    const tone = pc => (pc < 30 ? 'r' : pc < 60 ? 'o' : pc < 90 ? 'y' : 'g');
    const gm = Math.max(1, store.goal), el = Math.max(1, wk.filter(x => !x.future).length);
    const totMin = sum(recs.map(r => r.sec)) / 60, avg = totMin / el;
    const bar = pc => `<span class="mini"><i class="${tone(pc)}" style="width:${Math.max(0, Math.min(100, Math.round(pc)))}%"></i></span>`;
    const plot = wk.map((x, i) => `<div class="bw${x.now ? ' now' : ''}"><i class="${mins[i] ? tone(100 * mins[i] / gm) : ''}" style="height:${mins[i] ? Math.max(3, Math.round(100 * mins[i] / scale)) : 0}%"></i></div>`).join('') +
      `<i class="goalline" style="bottom:${Math.round(100 * store.goal / scale)}%"></i>`;
    const xl = wk.map(x => `<span class="${x.now ? 'now' : ''}">${dl[x.i]}</span>`).join('');
    const xm = wk.map((x, i) => `<span class="${x.now ? 'now' : ''}">${x.future ? '' : mins[i]}</span>`).join('');
    // una barra per modulo; toccandola si aprono gli esercizi del modulo
    const modRows = MODULES.filter(m => m.active && MOD_KINDS[m.id]).map(m => {
      const ks = MOD_KINDS[m.id].filter(k => EXK.includes(k));
      let ok = 0, tot = 0;
      ks.forEach(k => { const q = progress[k]; if (q && q.tot) { ok += q.ok; tot += q.tot; } });
      const pc = tot ? Math.round(100 * ok / tot) : null, open = !!S.pm[m.id];
      let h = `<li class="btnrow${open ? ' open' : ''}"><button type="button" data-act="progmod" data-id="${m.id}" aria-expanded="${open}"><span class="kl">${t('mod.' + m.id)}</span><span class="kv">${pc === null ? '—' : pc + '%'}</span>${CHEV}${bar(pc || 0)}</button></li>`;
      if (open) ks.forEach(k => {
        const q = progress[k], c = q && q.tot ? Math.round(100 * q.ok / q.tot) : null;
        h += `<li class="sub"><span class="kl">${kindName(k)}</span><span class="kv">${c === null ? '—' : c + '%'}</span>${bar(c || 0)}</li>`;
      });
      return h;
    }).join('');
    const weak = Object.entries(store.weak).sort((a, b) => b[1] - a[1]).slice(0, 3), weakTot = Math.max(1, sum(Object.values(store.weak)));
    return topbar(t('progress.title'), syncShort(), 'home', t('tab.home')) + `
      <h2 class="h2">${t('prog.goal')}</h2>
      <section class="card">
        <div class="stepper">
          <button class="btn round" data-act="goal" data-d="-5" aria-label="${esc(t('prog.minus'))}"${store.goal <= GOAL_MIN ? ' disabled' : ''}>−</button>
          <div class="gv"><b>${store.goal}</b><span>${t('prog.perDay')}</span></div>
          <button class="btn round" data-act="goal" data-d="5" aria-label="${esc(t('prog.plus'))}"${store.goal >= GOAL_MAX ? ' disabled' : ''}>+</button>
        </div>
        <p class="note c">${t('prog.goalNote')}</p>
      </section>
      <h2 class="h2">${t('prog.week')}</h2>
      <section class="card">
        <div class="chart"><div class="plot">${plot}</div><div class="xl">${xl}</div><div class="xl mv" aria-hidden="true">${xm}</div></div>
        <ul class="kvl"><li><span class="kl">${t('prog.minWeek')}</span><span class="kv">${sum(mins)} ${t('prog.min')}</span>${bar(100 * totMin / (gm * el))}</li>
          <li><span class="kl">${t('prog.avg')}</span><span class="kv">${Math.round(avg)} ${t('prog.min')}</span>${bar(100 * avg / gm)}</li>
          <li><span class="kl">${t('prog.questions')}</span><span class="kv">${totQ}</span></li>
          <li><span class="kl">${t('prog.correct')}</span><span class="kv">${totQ ? Math.round(100 * totOk / totQ) + '%' : '—'}</span>${totQ ? bar(100 * totOk / totQ) : ''}</li></ul>
      </section>
      <h2 class="h2">${t('prog.perEx')}</h2>
      <section class="card"><ul class="kvl">${modRows}</ul></section>
      <h2 class="h2">${t('prog.weak')}</h2>
      <section class="card">${weak.length ? `<ul class="kvl">${weak.map(([k, n]) => `<li><span class="kl">${esc(weakText(k))}</span><span class="kv">${Math.round(100 * n / weakTot)}%</span></li>`).join('')}</ul><p class="note c">${t('prog.weakNote')}</p>`
        : `<p class="muted" style="margin:0">${t('prog.weakNone')}</p>`}</section>
      <h2 class="h2">${t('prog.sync')}</h2>
      <section class="card"><p style="margin:0" role="status">${syncNote()}</p></section>
      <p class="foot"><button class="link" data-act="settings">${t('code.link')}</button></p>`;
  }

  function viewSettings() {
    const rows = [['auto', t('set.auto'), t('set.autoSub', { l: I18N[detectLang()]['lang.name'] })]]
      .concat(LANGS.map(c => [c, I18N[c]['lang.name'], '']));
    const lang = rows.map(([v, name, sub]) => {
      const sel = langPref === v;
      return `<button class="vrow" data-act="setlang" data-v="${v}" aria-pressed="${sel}"><span class="vt"><span class="ex-t">${esc(name)}</span>${sub ? `<span class="vd">${esc(sub)}</span>` : ''}</span>${sel ? LCK : ''}</button>`;
    }).join('');
    const THL = [['auto', t('theme.auto')], ['light', t('theme.light')], ['dark', t('theme.dark')]];
    const theme = tabBar('theme', THL.map(([v, l]) => `<button class="segb${themePref === v ? ' on' : ''}" data-act="settheme" data-v="${v}" aria-pressed="${themePref === v}">${l}</button>`),
      Math.max(0, THEMES.indexOf(themePref)), 'seg', t('theme.aria'), false);
    return `<header class="bar top"><h1 class="t">${t('set.title')}</h1><p class="sub">${t('set.sub')}</p></header>
      <h2 class="h2">${t('set.lang')}</h2>
      <div class="list" role="group" aria-label="${esc(t('set.lang'))}">${lang}</div>
      <p class="note">${t('set.langNote')}</p>
      <h2 class="h2">${t('set.theme')}</h2>
      <section class="card">${theme}<p class="note c">${t('theme.note')}</p></section>
      <h2 class="h2">${t('set.about')}</h2>
      <div class="list"><button class="vrow" data-act="info"><span class="tile" aria-hidden="true">${ICON.lang}</span>
        <span class="vt"><span class="ex-t">${t('set.how')}</span><span class="vd">${t('set.howSub')}</span></span>${CHEV}</button></div>
      <h2 class="h2">${t('code.title')}</h2>
      <section class="card">
        <p class="note nt">${t('code.note')}</p>
        <div class="row"><button class="btn" data-act="code-copy">${t('code.copy')}</button><button class="btn" data-act="code-open" aria-expanded="${S.restore}">${t('code.restore')}</button></div>
        ${S.code ? `<textarea class="codebox" readonly rows="4" aria-label="${esc(t('code.aria'))}" id="code-out">${esc(S.code)}</textarea>` : ''}
        ${S.restore ? `<textarea class="codebox" rows="4" id="code-in" placeholder="${esc(t('code.inPh'))}" aria-label="${esc(t('code.inAria'))}"></textarea>
          <div class="row"><button class="btn btn-p" data-act="code-apply">${t('code.apply')}</button></div>
          <p class="note nt">${t('code.mergeNote')}</p>` : ''}
        ${S.codeMsg ? `<p class="res ${S.codeMsg.ok ? 'ok' : 'bad'}" role="status">${esc(S.codeMsg.t)}</p>` : ''}
      </section>
      <h2 class="h2">${t('set.data')}</h2>
      <section class="card"><button class="btn wide danger" data-act="reset">${S.rst ? t('set.resetSure') : t('set.reset')}</button><p class="note">${t('set.resetNote')}</p></section>`;
  }

  function sheetView() {
    const m = MODULES.find(x => x.id === S.sheet);
    if (!m) return '';
    return `<div class="sheet-bg" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(t('mod.' + m.id))}" data-stop="1">
      <span class="grab" aria-hidden="true"></span>
      <h2 class="sheet-t">${t('mod.' + m.id)}</h2>
      <p class="muted">${esc(t('sheet.page', { src: m.src }))}</p>
      <p class="lab">${t('sheet.plan')}</p>
      <ul class="plan">${t('plan.' + m.id).map(p => `<li>${esc(p)}</li>`).join('')}</ul>
      <button class="btn btn-p wide" data-act="close-sheet">${t('sheet.close')}</button>
    </div></div>`;
  }

  // barra delle schede del modulo: in alto, sotto il titolo (la barra della Home resta sempre in basso, tranne negli esercizi)
  function modbar(id, tabs, cur, label, act) {
    const i = Math.max(0, tabs.findIndex(x => x[0] === cur));
    return `<div class="modbar">` + tabBar(id, tabs.map(([k, l]) =>
      `<button role="tab" class="segb${cur === k ? ' on' : ''}" aria-selected="${cur === k}" data-act="${act}" data-t="${k}">${esc(l)}</button>`), i, 'seg modseg', label, true) + `</div>`;
  }
  function chandaNav() {
    return modbar('c', [['metri', t('tab.metres')], ['esercizi', t('tab.exercises')]], S.tab === 'esercizi' ? 'esercizi' : 'metri', t('ch.title'), 'tab');
  }
  function alfaNav() {
    return modbar('a', [['tabelle', t('tab.tables')], ['esercizi', t('tab.exercises')]], S.atab, t('al.title'), 'atab');
  }
  function viewAlfabeto() {
    return topbar(t('al.title'), t('al.sub'), 'moduli', t('tab.modules'), alfaNav()) + (S.atab === 'tabelle' ? viewAlfaTabelle() : viewAlfaEsercizi());
  }

  // griglia ka–ma con il nome hari in testa a ogni colonna, poi harimitrāṇi e harigotrāṇi.
  // hl: nome da evidenziare ('c0'…'c4', 'mitra', 'gotra'); mark: lettera da segnare; varga: true = nome del varga sopra ogni riga (teoria), false = compatta (test)
  function hariGrid(o) {
    o = o || {};
    const L = ALPHA.L, hl = o.hl || '', mark = o.mark || '';
    const cell = (id, on, alt) => `<span class="al-c hg-c${alt ? ' alt' : ''}${on ? ' on' : ''}${id === mark ? ' mk' : ''}"><span class="al-d">${L[id].dev}</span><span class="al-i">${id}</span></span>`;
    const head = ALPHA.cols.map((c, i) => `<span class="hg-h${hl === 'c' + i ? ' on' : ''}"><i>hari</i><b>${c.replace(/^hari/, '')}</b></span>`).join('');
    const rows = ALPHA.grid.map(g => (o.varga ? `<p class="al-cap">${gname(g.id)} <span class="dev-s">${g.dev}</span></p>` : '')
      + `<div class="al-row">${g.ids.map((id, i) => cell(id, hl === 'c' + i, i % 2 === 0)).join('')}</div>`).join('');
    const grp = g => `<p class="hg-grp${hl === g.id ? ' on' : ''}"><b>${gname(g.id)}</b><span class="dev-s">${g.dev}</span></p><div class="al-row r4">${g.ids.map(id => cell(id, hl === g.id, false)).join('')}</div>`;
    return `<div class="hg${hl ? ' has-hl' : ''}${o.varga ? '' : ' sm'}"><div class="al-row">${head}</div>${rows}${grp(ALPHA.GB.mitra)}${grp(ALPHA.GB.gotra)}</div>`;
  }

  function viewAlfaTabelle() {
    const L = ALPHA.L;
    // vocali: due per riga, ciascuna con n. | devanāgarī | IAST
    const half = (id, sp) => `<td class="n${sp ? ' sp' : ''}">${L[id].n}</td><td class="dv">${L[id].dev}</td><td class="ia">${id}</td>`;
    const sv = ALPHA.svara, vrows = [];
    for (let k = 0; k < sv.length; k += 2) vrows.push(`<tr>${half(sv[k], false)}${sv[k + 1] ? half(sv[k + 1], true) : '<td class="sp"></td><td></td><td></td>'}</tr>`);
    const vcols = '<col style="width:11%"><col style="width:20%"><col style="width:19%">';
    const vh = (sp) => `<th${sp ? ' class="sp"' : ''}>N.</th><th>देवनागरी</th><th>IAST</th>`;
    const mrow = (key, id) => `<tr><th scope="row" class="rh">${t(key)}</th><td class="dv">${L[id].dev}</td><td class="ia">${id}</td></tr>`;
    // consonanti e nessi: lettera sopra, IAST sotto
    const cc = (id, alt) => `<td${alt ? ' class="alt"' : ''}><span class="d">${L[id].dev}</span><span class="i">${id}</span></td>`;
    const chead = '<th></th>' + ALPHA.cols.map(c => `<th scope="col"><i>hari</i>${c.replace(/^hari/, '')}</th>`).join('');
    const crows = ALPHA.grid.map(g => `<tr><th scope="row" class="rh">${gname(g.id)}<span class="dev-s">${g.dev}</span></th>${g.ids.map((id, i) => cc(id, i % 2 === 0)).join('')}</tr>`).join('');
    const band = g => `<tr class="band"><th colspan="4">${gname(g.id)}<span class="dev-s">${g.dev}</span></th></tr><tr>${g.ids.map((id, i) => cc(id, i % 2 === 0)).join('')}</tr>`;
    return `<p class="intro">${t('al.intro')}</p>
      <section class="card flat">
        <p class="lab first">${t('al.vowels')}</p>
        <div class="at-w"><table class="at" aria-label="${esc(t('al.vowels'))}">
          <colgroup>${vcols}${vcols}</colgroup>
          <thead><tr>${vh(false)}${vh(true)}</tr></thead><tbody>${vrows.join('')}</tbody></table></div>
        <p class="note tight">${t('al.vnote1')}<br>${t('al.vnote2')}</p>
        <div class="at-w"><table class="at" aria-label="${esc(t('al.anus') + ', ' + t('al.vis'))}">
          <colgroup><col style="width:52%"><col style="width:24%"><col style="width:24%"></colgroup>
          <thead><tr><th></th><th>देवनागरी</th><th>IAST</th></tr></thead>
          <tbody>${mrow('al.anus', 'aṁ')}${mrow('al.vis', 'aḥ')}</tbody></table></div>
        <p class="lab">${t('al.cons')}</p>
        <p class="note tight" style="margin-top:0">${t('al.consNote')}</p>
        <p class="lab">${t('al.colsT')}</p>
        <div class="at-w"><table class="at" aria-label="${esc(t('al.cons'))}">
          <colgroup><col style="width:64px"></colgroup>
          <thead><tr>${chead}</tr></thead><tbody>${crows}</tbody></table></div>
        <div class="at-w"><table class="at" aria-label="${esc(gname('mitra') + ', ' + gname('gotra'))}">
          <tbody>${band(ALPHA.GB.mitra)}${band(ALPHA.GB.gotra)}</tbody></table></div>
        <p class="lab">${t('al.conj')}</p>
        <div class="at-w"><table class="at" aria-label="${esc(t('al.conj'))}">
          <tbody><tr>${ALPHA.CJ.map((c, i) => cc(c[0], i % 2 === 0)).join('')}</tr></tbody></table></div>
      </section>`;
  }

  function viewAlfaEsercizi() {
    const EX = [['letter', 'ex.letterD'], ['varga', 'ex.vargaD'], ['hari', 'ex.hariD'], ['odd', 'ex.oddD'], ['grid', 'ex.gridD']];
    return `<p class="intro">${t('ex.intro')}</p><div class="list">` +
      EX.map(([id, dk]) => {
        const p = progress[id];
        return `<button class="vrow ex-c" data-act="start" data-type="${id}">
          <span class="vt"><span class="ex-t">${kindName(id)}</span><span class="vd">${t(dk)}</span><span class="vp">${p ? t('ex.tried', { ok: p.ok, tot: p.tot }) : t('ex.notTried')}</span></span>${CHEV}</button>`;
      }).join('') + '</div>';
  }

  function viewChanda() {
    let body;
    if (S.tab === 'metri') body = viewMetri();
    else if (S.tab === 'versi') body = S.verse ? viewVerse() : viewVersi();
    else body = viewEsercizi();
    return topbar(`${t('ch.title')} <span class="dev-s">छन्दः</span>`, t('ch.sub'), 'moduli', t('tab.modules'), chandaNav()) + body;
  }

  function viewMetri() {
    const gOpen = S.openMetre === 'gana';
    const gtab = E.GANA_ORDER.map(n => `<li><span class="gn-n">${n}<span class="dev-s">${E.toDevanagari(n)}</span></span>
        <span class="gmarks" aria-hidden="true">${[...E.GANA[n]].map(c => mk(c)).join('')}</span>
        <span class="gn-w">${[...E.GANA[n]].map(c => W(c)).join(' ')}</span></li>`).join('');
    const ganaRow = `<article class="metre gana-a${gOpen ? ' open' : ''}">
          <button class="metre-h vrow" data-act="metre" data-id="gana" aria-expanded="${gOpen}">
            <span class="vt"><span class="mh-row"><span class="mname">Gaṇa</span><span class="dev-s">गण</span></span>
            <span class="mh-sub">${t('met.ganaSub')}</span></span>
            ${CHEV}
          </button>
          ${gOpen ? `<div class="detail">
            <p class="lab first">${t('met.formula')}</p>
            <p class="lak">yamātārājabhānasalagaṃ<br>यमाताराजभानसलगं</p>
            <p class="lab">${t('met.ganas')}</p>
            <ul class="gtab">${gtab}</ul>
            <p class="note tight">${t('met.trick')}</p>
            <div class="row"><button class="btn" data-act="start" data-type="gana">${t('met.practiceGana')}</button></div>
          </div>` : ''}
        </article>`;
    return `<p class="intro">${t('met.intro')}</p><div class="list">` + ganaRow +
      E.METRES.map(m => {
        const open = S.openMetre === m.id;
        const vs = VERSES.filter(v => v.metre === m.id);
        return `<article class="metre${open ? ' open' : ''}">
          <button class="metre-h vrow" data-act="metre" data-id="${m.id}" aria-expanded="${open}">
            <span class="vt"><span class="mh-row"><span class="mname">${m.name}</span><span class="dev-s">${m.dev}</span></span>
            <span class="mh-sub">${t('met.sylls', { n: m.n })} · ${schemaOf(m)}</span></span>
            ${CHEV}
          </button>
          ${open ? `<div class="detail">
            <p class="lab">${t('met.laks')}</p>
            <p class="lak">${m.lak.map(esc).join('<br>')}</p>
            <p class="lab">${t('met.pattern')}</p>
            <p>${m.pattern ? E.ganaNames(m.pattern).join(' · ') + `<span class="muted"> · ${yatiText(m)}</span>` : esc(ruleOf(m))}</p>
            ${m.pattern ? strip(m) : ''}
            <div class="row">
              <button class="btn" data-act="metre-verses" data-id="${m.id}"${vs.length ? '' : ' disabled'}>${t('met.versesBtn')}</button>
              <button class="btn" data-act="metre-ex" data-id="${m.id}"${vs.length ? '' : ' disabled'}>${t('met.practiceBtn')}</button>
            </div>
            ${vs.length ? '' : `<p class="muted">${t('met.noVerses')}</p>`}
          </div>` : ''}
        </article>`;
      }).join('') + '</div>';
  }

  function viewVersi() {
    const m = S.vm ? E.METRE_BY_ID[S.vm] : null;
    const list = VERSES.filter(v => !m || v.metre === m.id);
    return `<button class="back inline" data-act="close-versi">${BACK}<span class="bl">${t('tab.metres')}</span></button>` +
      (m ? `<p class="intro">${t('vs.of', { m: m.name })}</p>` : '') +
      '<div class="list">' + list.map(v => `<button class="vrow verse-c" data-act="open-verse" data-id="${v.id}">
        <span class="vt"><span class="vc-ref">${esc(v.ref)}</span><span class="vc-first">${esc(v.lines[0])}</span></span>${CHEV}</button>`).join('') + '</div>';
  }

  function viewVerse() {
    const v = verseById(S.verse), m = E.METRE_BY_ID[v.metre];
    const a = E.analyze(v.lines);
    let scan = '';
    if (S.scan) {

        a.map((p, i) => `<p class="pl">${t('v.padaHead', { i: i + 1, n: p.syls.length, g: E.ganaNames(p.w).join(' ') })}</p>${padaGrid(p.syls, m, { tags: true })}`).join('') +
        `<p class="res ok" role="status">${t('v.allMatch', { m: m.name })}</p>${legend()}</section>`;
    }
    const src = v.src === 'vedabase'
      ? t('v.srcVeda', { link: `<a class="ext" href="${v.url}" target="_blank" rel="noopener">Vedabase ↗</a>` })
      : t('v.srcNotion');
    return `
      <button class="back inline" data-act="close-verse">${BACK}<span class="bl">${t('vs.back', { m: m.name })}</span></button>
      <article class="verse">

        <div class="dev v-dev">${versoLines(v, true)}</div>
        <div class="v-iast">${versoLines(v, false)}</div>
        <div class="row">
          <button class="btn${S.scan ? '' : ' btn-p'}" data-act="toggle-scan">${S.scan ? t('v.hide') : t('v.show')}</button>
        </div>
        ${scan}
        <p class="lab">${t('v.practice')}</p>
        <div class="row">
          <button class="btn" data-act="start" data-type="scan" data-vid="${v.id}">${t('v.scanBtn')}</button>
          <button class="btn" data-act="start" data-type="metre" data-vid="${v.id}">${t('v.metreBtn')}</button>
        </div>
